// 하늘
function paintSky(x, y, w, h, t, night){
  const sky = ctx.createLinearGradient(0, y, 0, y+h);
  if(night){
    sky.addColorStop(0,    "#0e1730");
    sky.addColorStop(0.55, "#1b2647");
    sky.addColorStop(1,    "#31405f");
  }else{
    sky.addColorStop(0,    "#6ea8dc");
    sky.addColorStop(0.45, "#9ec8e8");
    sky.addColorStop(1,    "#dfeaf0");
  }
  ctx.fillStyle = sky; ctx.fillRect(x, y, w, h);

  if(night){
    // 별
    ctx.fillStyle = "#fff";
    for(let i=0; i<26; i++){
      const sx = x + hash(i*1.7)*w, sy2 = y + hash(i*3.9)*h*0.7;
      const tw = 0.5 + 0.5*Math.sin(t*1.6 + i);
      ctx.globalAlpha = (0.18 + 0.55*tw) * (0.4 + hash(i*7.1)*0.6);
      ctx.beginPath(); ctx.arc(sx, sy2, 0.9 + hash(i*5.5), 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // 달 + 달무리
    const mx = x + 152, my = y + 44;
    let g = ctx.createRadialGradient(mx, my, 6, mx, my, 52);
    g.addColorStop(0, "rgba(226,232,246,.40)"); g.addColorStop(1, "rgba(226,232,246,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(mx, my, 52, 0, 6.283); ctx.fill();
    g = ctx.createRadialGradient(mx-6, my-7, 2, mx, my, 20);
    g.addColorStop(0, "#fdfcf4"); g.addColorStop(0.75, "#e6e5d6"); g.addColorStop(1, "#cfcfc0");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(mx, my, 19, 0, 6.283); ctx.fill();
    ctx.fillStyle = "rgba(150,150,140,.35)";
    ctx.beginPath(); ctx.arc(mx+5, my+4, 4.5, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(mx-6, my+8, 3, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(mx+8, my-7, 2.4, 0, 6.283); ctx.fill();
  }else{
    // 햇무리
    const sx = x + 44, sy2 = y + 34;
    let g = ctx.createRadialGradient(sx, sy2, 4, sx, sy2, 70);
    g.addColorStop(0, "rgba(255,248,214,.95)");
    g.addColorStop(0.25, "rgba(255,243,196,.45)");
    g.addColorStop(1, "rgba(255,243,196,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, sy2, 70, 0, 6.283); ctx.fill();
    // 흐르는 구름 (가장자리가 흐린 뭉게구름)
    softCloud(x + ((t*6) % (w+160)) - 70, y + 42, 42, 0.85);
    softCloud(x + ((t*4 + 130) % (w+180)) - 80, y + 78, 30, 0.6);
    softCloud(x + ((t*2.5 + 260) % (w+200)) - 90, y + 26, 24, 0.4);
  }
}
function softCloud(x, y, r, a){
  ctx.save();
  const blobs = [[0,0,1],[0.85,0.16,0.72],[-0.9,0.2,0.62],[0.35,-0.3,0.6],[-0.4,-0.22,0.5]];
  for(const b of blobs){
    const bx = x + b[0]*r, by = y + b[1]*r, br = r*b[2];
    const g = ctx.createRadialGradient(bx, by - br*0.2, br*0.2, bx, by, br);
    g.addColorStop(0, "rgba(255,255,255," + (0.95*a) + ")");
    g.addColorStop(0.6, "rgba(246,249,252," + (0.6*a) + ")");
    g.addColorStop(1, "rgba(232,240,246,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(bx, by, br, 0, 6.283); ctx.fill();
  }
  ctx.restore();
}
// 창밖 풍경 : 먼 언덕과 나무 (대기 원근으로 흐리게)
function paintOutside(x, y, w, h, t, night){
  const hz = y + h*0.62;   // 지평선
  // 먼 산
  ctx.fillStyle = night ? "rgba(38,48,74,.85)" : "rgba(150,172,178,.75)";
  ctx.beginPath();
  ctx.moveTo(x-5, hz+6);
  ctx.lineTo(x+22, hz-16); ctx.lineTo(x+48, hz-2); ctx.lineTo(x+78, hz-22);
  ctx.lineTo(x+112, hz+2); ctx.lineTo(x+150, hz-14); ctx.lineTo(x+190, hz+2);
  ctx.lineTo(x+w+5, hz-6); ctx.lineTo(x+w+5, hz+30); ctx.lineTo(x-5, hz+30);
  ctx.closePath(); ctx.fill();
  // 가까운 잔디밭
  const g = ctx.createLinearGradient(0, hz, 0, y+h);
  if(night){ g.addColorStop(0, "#2a3a3a"); g.addColorStop(1, "#16211f"); }
  else     { g.addColorStop(0, "#9dae7c"); g.addColorStop(1, "#6f8455"); }
  ctx.fillStyle = g; ctx.fillRect(x-5, hz+6, w+10, y+h-hz);
  // 나무 몇 그루
  for(let i=0; i<4; i++){
    const tx = x + 18 + i*58 + hash(i*3.3)*14;
    const ty = hz + 10 + hash(i*7.7)*8;
    const s  = 0.7 + hash(i*5.1)*0.5;
    ctx.fillStyle = night ? "#1e2b28" : "#5c7346";
    ctx.fillRect(tx-1.6*s, ty-14*s, 3.2*s, 14*s);
    for(let k=0; k<3; k++){
      const bx = tx + (hash(i*11+k)-0.5)*12*s, by = ty - 18*s - k*6*s;
      ctx.fillStyle = night
        ? "rgba(28,40,38,.95)"
        : (k === 0 ? "rgba(96,122,70,.95)" : "rgba(112,140,80,.95)");
      ctx.beginPath(); ctx.arc(bx, by, (11 - k*2)*s, 0, 6.283); ctx.fill();
    }
  }
  // 대기 원근 (멀수록 뿌옇게)
  const haze = ctx.createLinearGradient(0, hz-24, 0, hz+22);
  haze.addColorStop(0, night ? "rgba(30,42,70,.55)" : "rgba(226,236,240,.55)");
  haze.addColorStop(1, night ? "rgba(30,42,70,0)"   : "rgba(226,236,240,0)");
  ctx.fillStyle = haze; ctx.fillRect(x-5, hz-24, w+10, 46);
}

function paintSashBar(x, y, w, h, vertical){
  if(vertical){

  }else{

// 창틀(케이싱)
function paintCasing(x, y, w, h){
  const t = 15;
  const drawSide = (rx, ry, rw, rh, vertical, flip) => {
    let g;
    if(vertical){
      g = ctx.createLinearGradient(rx, 0, rx+rw, 0);
      if(flip){ g.addColorStop(0, "#e6ded0"); g.addColorStop(0.55, "#fbf8f1"); g.addColorStop(1, "#c3b8a4"); }
      else    { g.addColorStop(0, "#c9bfad"); g.addColorStop(0.45, "#fbf8f1"); g.addColorStop(1, "#e7dfd1"); }
    }else{
      g = ctx.createLinearGradient(0, ry, 0, ry+rh);
      if(flip){ g.addColorStop(0, "#efe7d9"); g.addColorStop(0.5, "#f6f1e6"); g.addColorStop(1, "#bdb29e"); }
      else    { g.addColorStop(0, "#fdfbf5"); g.addColorStop(1, "#ddd3c2"); }
    }
    ctx.fillStyle = g; ctx.fillRect(rx, ry, rw, rh);
  };
  drawSide(x - t, y - t, t, h + t*2, true, false);        // 왼쪽
  drawSide(x + w, y - t, t, h + t*2, true, true);         // 오른쪽
  drawSide(x - t, y - t, w + t*2, t, false, false);       // 위
  drawSide(x - t, y + h, w + t*2, t, false, true);        // 아래

  // 유리와 만나는 안쪽 턱
  ctx.strokeStyle = "rgba(80,62,44,.35)"; ctx.lineWidth = 2;
  ctx.strokeRect(x - 1, y - 1, w + 2, h + 2);
  ctx.strokeStyle = "rgba(255,255,255,.6)"; ctx.lineWidth = 1;
  ctx.strokeRect(x - 3, y - 3, w + 6, h + 6);
  // 바깥 모서리
  ctx.strokeStyle = "rgba(92,72,50,.30)"; ctx.lineWidth = 1.5;
  ctx.strokeRect(x - t, y - t, w + t*2, h + t*2);
}

/* =========================================================================
   가구 그리기
   바닥 아이템: (x, y) = 바닥에 닿는 지점의 중앙
   벽   아이템: (x, y) = 중심
   ========================================================================= */
function drawFurn(f){
  const D = FURN[f.t];
  if(!D) return;
  if(f.flip){
    ctx.save();
    ctx.translate(f.x, 0); ctx.scale(-1, 1); ctx.translate(-f.x, 0);
    D.draw(f.x, f.y, f);
    ctx.restore();
  }else{
    D.draw(f.x, f.y, f);
  }
}

function carpetSlab(cx, top, w, h, r){

  ctx.fillStyle = "rgba(50,36,22,.22)";
  roundRect(x0+3, top+h-3, w-6, 7, 4); ctx.fill();

    [0, "#e2d7c1"], [0.35, "#d3c6ad"], [0.8, "#b9aa8f"], [1, "#9c8d73"]

  ctx.save();

function dClockFace(x, y){
  wallShadow(()=>{ ctx.beginPath(); ctx.arc(x, y, 29, 0, 6.283); });

  ctx.fillStyle = face; ctx.beginPath(); ctx.arc(x, y, 24, 0, 6.283); ctx.fill();
  ctx.strokeStyle = "rgba(90,80,66,.25)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(x, y, 24, 0, 6.283); ctx.stroke();
  // 눈금
  for(let i=0; i<12; i++){
    const a = i*Math.PI/6;

    ctx.lineWidth = big ? 2.4 : 1.2;
    ctx.beginPath();

  }

function dClockHands(x, y){
  // 바늘 (그림자까지)
  const d = new Date();
  const hr = ((d.getHours()%12) + d.getMinutes()/60) * Math.PI/6 - Math.PI/2;
  const mn = d.getMinutes() * Math.PI/30 - Math.PI/2;
  const sc = d.getSeconds() * Math.PI/30 - Math.PI/2;
  ctx.lineCap = "round";
  ctx.strokeStyle = "rgba(80,70,58,.25)"; ctx.lineWidth = 3.4;
  ctx.beginPath(); ctx.moveTo(x+1.5, y+1.5); ctx.lineTo(x+Math.cos(hr)*11+1.5, y+Math.sin(hr)*11+1.5); ctx.stroke();
  ctx.strokeStyle = "#2b2823"; ctx.lineWidth = 3.2;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x+Math.cos(hr)*11, y+Math.sin(hr)*11); ctx.stroke();
  ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x+Math.cos(mn)*17, y+Math.sin(mn)*17); ctx.stroke();
  ctx.strokeStyle = "#b4523f"; ctx.lineWidth = 1.1;
  ctx.beginPath(); ctx.moveTo(x-Math.cos(sc)*4, y-Math.sin(sc)*4);
  ctx.lineTo(x+Math.cos(sc)*19, y+Math.sin(sc)*19); ctx.stroke();
  ctx.lineCap = "butt";
  ctx.fillStyle = "#2b2823"; ctx.beginPath(); ctx.arc(x, y, 2.4, 0, 6.283); ctx.fill();
  // 유리 반사
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, 24, 0, 6.283); ctx.clip();
  ctx.fillStyle = "rgba(255,255,255,.22)";
  ctx.beginPath();

function dFeather(x, y){ cachedPart("feather", {l:26, r:26, t:24, b:22}, dFeatherRaw, x, y); }
function dFeatherRaw(x, y){
  // 막대
  fillGradX(()=> roundRect(x-3, y-2, 6, 18, 3), x-3, x+3,
    [[0, "#8a6a44"], [0.35, "#c49a68"], [1, "#6d4f2f"]]);
  // 깃털 세 장
  const plume = (rot, len, c1, c2) => {
    ctx.save();
    ctx.translate(x, y-2); ctx.rotate(rot);
    const g = ctx.createLinearGradient(0, 0, 0, -len);
    g.addColorStop(0, c2); g.addColorStop(1, c1);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-5, -len*0.55, 0, -len);
    ctx.quadraticCurveTo(5, -len*0.55, 0, 0);
    ctx.fill();
    ctx.strokeStyle = "rgba(80,66,50,.45)"; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -len*0.94); ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 0.6;
    for(let i=1; i<=5; i++){
      const yy = -len*i/6;
      ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(-3.2, yy - 2.4);
      ctx.moveTo(0, yy); ctx.lineTo(3.2, yy - 2.4); ctx.stroke();
    }
    ctx.restore();
  };
  plume(-0.45, 20, "#e8dcc6", "#b3a488");
  plume( 0.42, 19, "#d9c4a6", "#a08d70");
  plume(-0.02, 23, "#f2ead9", "#c2b49a");
  // 방울
  const bg = ctx.createRadialGradient(x-2, y+12, 0.6, x, y+14, 5);
  bg.addColorStop(0, "#fdf3d0"); bg.addColorStop(0.5, "#dcb95f"); bg.addColorStop(1, "#94762c");
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.arc(x, y+14, 4.4, 0, 6.283); ctx.fill();
  ctx.strokeStyle = "rgba(120,94,30,.6)"; ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.moveTo(x-4, y+14); ctx.lineTo(x+4, y+14); ctx.stroke();
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* =========================================================================
   고양이 그리기 (전부 벡터)
   좌표계: 원점 = 발이 닿는 지점, +x = 앞쪽(바라보는 방향)
   ========================================================================= */

// 포즈별 파라미터 계산
// mode: stand(네 발로 서기) / sit(앉기) / curl(동그랗게 말고 자기)
function poseParams(c, t){
  const p = {
    mode:"stand",
    bodyY:-30, bodyRX:36, bodyRY:23, bodyRot:0,
    headX:36, headY:-50, headR:21, headRot:0,
    legLift:[0,0,0,0],
    legSpread:[24, 14, -16, -26],
    tailAmp:0.28, tailFreq:1,
    eyeOpen:1, mouthOpen:0, bob:0, pawL:0, pawR:0,
  };
  const wp = c.walkPhase;
  switch(c.state){
    case "walk":
      p.legLift = [Math.max(0,Math.sin(wp))*9, Math.max(0,Math.sin(wp+2.1))*9,
                   Math.max(0,Math.sin(wp+3.14))*9, Math.max(0,Math.sin(wp+5.2))*9];
      p.bodyY += Math.sin(wp*2)*1.6;
      p.tailAmp = 0.36; p.tailFreq = 1.6;
      break;
    case "run":
      p.legLift = [Math.max(0,Math.sin(wp))*15, Math.max(0,Math.sin(wp+0.5))*15,
                   Math.max(0,Math.sin(wp+3.14))*15, Math.max(0,Math.sin(wp+3.6))*15];
      p.bodyY += Math.sin(wp*2)*4 - 3;
      p.bodyRot = -0.05; p.headY -= 3;
      p.tailAmp = 0.5; p.tailFreq = 2.4; p.eyeOpen = 0.85;
      break;
    case "eat":     // 서서 고개만 숙임
      p.headX = 42; p.headY = -26; p.headRot = 0.5;
      p.mouthOpen = 0.5 + 0.5*Math.sin(t*9);
      p.bodyY = -28; p.tailAmp = 0.18;
      break;
    case "drink":
      p.headX = 42; p.headY = -22; p.headRot = 0.6;
      p.mouthOpen = 0.35 + 0.35*Math.sin(t*12);
      p.bodyY = -28; p.tailAmp = 0.16;
      break;
    case "sit":
      p.mode = "sit"; p.bob = Math.sin(t*1.5)*1.2;
      break;
    case "litter":
      p.mode = "sit"; p.bob = Math.sin(t*4)*1.4; p.eyeOpen = 0.35;
      break;
    case "groom":   // 앉아서 앞발 들고 그루밍
      p.mode = "sit"; p.headRot = 0.85 + 0.14*Math.sin(t*8);
      p.pawL = 16 + Math.sin(t*8)*3; p.eyeOpen = 0.25; p.tailAmp = 0.15;
      break;
    case "scratch": // 앉아서 두 앞발로 긁기
      p.mode = "sit"; p.bob = Math.sin(t*11)*1.5;
      p.pawL = 22 + Math.sin(t*11)*11;
      p.pawR = 22 + Math.sin(t*11 + Math.PI)*11;
      p.headRot = -0.12; p.tailAmp = 0.4; p.tailFreq = 2;
      break;
    case "bat":     // 앞발로 장난감 치기
      p.mode = "sit"; p.pawR = 26 + Math.sin(t*24)*10;
      p.bob = Math.sin(t*18)*2; p.tailAmp = 0.7; p.tailFreq = 3.5;
      break;
    case "perch":   // 높은 곳에 앉아서 방 구경
      p.mode = "sit"; p.bob = Math.sin(t*1.3)*1.1;
      p.tailAmp = 0.22;
      break;
    case "watch":   // 어항 구경 - 앉아서 고개를 살짝 움직인다
      p.mode = "sit"; p.bob = Math.sin(t*1.1)*1.0;
      p.headRot = Math.sin(t*1.9)*0.12;
      p.tailAmp = 0.45; p.tailFreq = 1.8;
      break;
    case "roll":    // 캣닢에 취해 뒹굴기
      p.mode = "curl"; p.bob = Math.sin(t*7.5)*2.2; p.eyeOpen = 0.2;
      break;
    case "hide":    // 상자·터널 안에 웅크림
      p.mode = "curl";
      break;
    case "chase":   // 달려서 쫓아감
    case "wheel": { // 캣휠 안에서 달리기
      const wp2 = c.walkPhase;
      p.legLift = [Math.max(0,Math.sin(wp2))*15, Math.max(0,Math.sin(wp2+0.5))*15,
                   Math.max(0,Math.sin(wp2+3.14))*15, Math.max(0,Math.sin(wp2+3.6))*15];
      p.bodyY += Math.sin(wp2*2)*4 - 3;
      p.bodyRot = -0.05; p.headY -= 3;
      p.tailAmp = 0.5; p.tailFreq = 2.4;
      break;
    }
    case "held":    // 손에 잡혀 대롱대롱
      p.mode = "held";
      p.eyeOpen = 1;
      p.mouthOpen = c.heldT > 3 ? 0.45 + 0.45*Math.sin(t*11) : 0;
      break;
    case "fall": {  // 공중에서 네 발을 쫙 편다
      p.legSpread = [30, 18, -20, -32];
      p.legLift = [-13 - Math.sin(t*9)*3, -11, -15, -13 - Math.cos(t*9)*3];
      p.bodyY = -32;
      p.tailAmp = 0.6; p.tailFreq = 3.2;
      p.eyeOpen = 1;
      break;
    }
    case "land": {  // 착지 직후 웅크림
      p.bodyY = -25;
      p.legSpread = [27, 16, -18, -29];
      p.headY = -44; p.eyeOpen = 0.45;
      p.tailAmp = 0.5; p.tailFreq = 2.6;
      break;
    }
    case "jump": {  // 포물선 점프
      const k = c.jump ? clamp(c.jump.t/c.jump.dur, 0, 1) : 0.5;
      p.legLift = [9 + Math.sin(k*Math.PI)*10, 7 + Math.sin(k*Math.PI)*10,
                   13 + Math.sin(k*Math.PI)*12, 15 + Math.sin(k*Math.PI)*12];
      p.bodyRot = -0.22 + 0.44*k;
      p.bodyY -= 2; p.headY -= 4;
      p.tailAmp = 0.12; p.tailFreq = 1.2; p.eyeOpen = 0.95;
      break;
    }
    case "play":
      p.mode = "sit"; p.bob = Math.sin(t*10)*3;
      p.headRot = -0.15; p.tailAmp = 0.7; p.tailFreq = 3;
      break;
    case "happy":
      p.mode = "sit"; p.bob = -Math.abs(Math.sin(t*6))*7;
      p.eyeOpen = 0.12; p.tailAmp = 0.6; p.tailFreq = 3;
      break;
    case "sleep":
      p.mode = "curl";
      break;
    default:        // idle
      p.bodyY += Math.sin(t*1.8)*1.2;
  }
  if(c.blink > 0) p.eyeOpen = Math.min(p.eyeOpen, 0.05);
  return p;
}

// 외곽선 색 (밝은 털 고양이도 배경에서 또렷하게 보이도록)
function outline(B){ return mix(B.base, "#4a3226", 0.42); }
const OL_W = 2.2;

function drawCat(c, t){
  const B = breed();

  // 사진 스프라이트가 준비돼 있으면 격자 메시로 그린다
  if(useSprite() && rigReady && rig.root){
    drawRigShadow(c);
    drawCatRig();
    drawPinchFur(t);
    drawHeldMarks(t);
    if(c.sayT > 0){
      const bb = catBBox();
      drawBubble(c.x, bb.y0 - 6, c.say, clamp(c.sayT/0.35, 0, 1));
    }
    return;
  }

  // 방 앞쪽(아래쪽)에 있을수록 조금 크게 그려서 원근감을 준다
  const sc = lerp(0.90, 1.06, clamp((c.gy - CAT_Y)/(FLOOR_MAX - CAT_Y), 0, 1));
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.scale(sc, sc);

  // 그림자 — 몸이 늘어나도 그림자는 바닥에 그대로 남는다
  // 점프하거나 들려 있으면 옅고 작아지고, 발 아래 바닥(gy)에 붙는다
  let air = 0;
  if(c.state === "jump" && c.jump) air = Math.sin(Math.PI*clamp(c.jump.t/c.jump.dur, 0, 1));
  else if(c.state === "held" || c.state === "fall") air = clamp((c.gy - c.y)/220, 0, 1);
  const shY = (c.state === "held" || c.state === "fall") ? (c.gy - c.y)/sc + 6 : 6 + air*20;
  ctx.globalAlpha = 1 - air*0.6;
  ctx.fillStyle = "rgba(80,50,30,.20)";
  ctx.beginPath();
  ctx.ellipse(0, shY, (c.state==="sleep" ? 46 : 40)*(1-air*0.4), 9*(1-air*0.35), 0, 0, 6.283);
  ctx.fill();
  ctx.globalAlpha = 1;

  // 늘어남/찌그러짐과 회전은 몸에만 적용
  ctx.scale(c.sx, c.sy);
  if(c.rot){ ctx.translate(0, -36); ctx.rotate(c.rot); ctx.translate(0, 36); }
  ctx.scale(c.dir, 1);
  drawCatPose(c, B, poseParams(c, t), t);
  ctx.restore();

  // 말풍선은 좌우 반전 밖에서 그린다
  const bubbleY = c.state === "held" ? 150 : (c.state==="sleep" || c.state==="hide" ? 56 : 104);
  if(c.sayT > 0) drawBubble(c.x, c.y - bubbleY, c.say, clamp(c.sayT/0.35, 0, 1));
}

function drawCatPose(c, B, p, t){
  if(p.mode === "curl")      drawCatCurled(c, B, t);
  else if(p.mode === "sit")  drawCatSitting(c, B, p, t);
  else if(p.mode === "held") drawCatHeld(c, B, p, t);
  else                       drawCatUpright(c, B, p, t);
}

/* ---------- 잡혀서 대롱대롱 매달린 자세 ---------- */
function drawCatHeld(c, B, p, t){
  const ol = outline(B);
  const sway = Math.sin(t*7)*0.16 + clamp(c.vx/2200, -0.3, 0.3);  // 버둥거림 + 관성

  // 꼬리 (아래로 늘어져 흔들림)
  drawTailCfg(c, B, t, { x:-15, y:-62, ang:Math.PI*0.60, curve:0.13,
                         amp:0.55, freq:2.4, len:9, segs:7, w0:11, w1:5 });

  // 뒷다리 (먼 쪽)
  ctx.fillStyle = shade(B.base, -0.15);
  danglingLeg(-13, -36, 0.26 + sway, 8.5, ol);
  danglingLeg( 10, -34, -0.20 - sway, 8.5, ol);

  // 몸통 — 세로로 길쭉하게
  ctx.save();
  ctx.translate(0, -58);
  ctx.beginPath(); ctx.ellipse(0, 0, 23, 33, 0, 0, 6.283);
  ctx.fillStyle = B.base; ctx.fill();
  ctx.save(); ctx.clip();
  ctx.globalAlpha = 0.55; ctx.fillStyle = B.belly;
  ctx.beginPath(); ctx.ellipse(7, 11, 17, 23, 0, 0, 6.283); ctx.fill();
  ctx.globalAlpha = 1;
  furPattern(B, "body", 23, 33);
  ctx.restore();
  ctx.beginPath(); ctx.ellipse(0, 0, 23, 33, 0, 0, 6.283);
  ctx.strokeStyle = ol; ctx.lineWidth = OL_W; ctx.stroke();
  ctx.restore();

  // 앞다리 (가까운 쪽)
  ctx.fillStyle = B.pattern === "siamese" ? mix(B.base, B.dark, 0.55) : B.base;
  danglingLeg(-9, -66, -0.34 - sway*1.7, 8, ol);
  danglingLeg(13, -64,  0.36 + sway*1.7, 8, ol);

  // 머리
  ctx.save();
  ctx.translate(2, -98); ctx.rotate(sway*0.55);
  drawHead(c, B, p, t);
  ctx.restore();
}
// 아래로 늘어진 다리
function danglingLeg(x, y, ang, w, ol){
  ctx.save();
  ctx.translate(x, y); ctx.rotate(ang);
  roundRect(-w/2, 0, w, 30, w/2); ctx.fill();
  ctx.strokeStyle = ol; ctx.lineWidth = OL_W*0.8; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, 31, w*0.72, w*0.46, 0, 0, 6.283);
  ctx.fill(); ctx.stroke();
  ctx.restore();
}

/* ---------- 털 무늬 (원점 중심, w/h = 반지름) ---------- */
function furPattern(B, kind, w, h){
  if(B.pattern === "tabby"){
    ctx.save(); ctx.globalAlpha = 0.5; ctx.fillStyle = B.dark;
    if(kind === "body"){
      for(let i=-2;i<=2;i++){
        ctx.save(); ctx.translate(i*w*0.36, -h*0.1); ctx.rotate(0.1);
        roundRect(-w*0.09, -h*0.7, w*0.18, h*0.95, w*0.09); ctx.fill();
        ctx.restore();
      }
    }else{
      for(let i=-1;i<=1;i++){
        ctx.save(); ctx.translate(i*w*0.32, -h*0.58);
        roundRect(-w*0.10, -h*0.30, w*0.20, h*0.6, w*0.10); ctx.fill();
        ctx.restore();
      }
    }
    ctx.restore();
  }
  else if(B.pattern === "tuxedo"){
    ctx.save(); ctx.fillStyle = B.belly;
    if(kind === "body"){
      ctx.beginPath(); ctx.ellipse(w*0.45, h*0.32, w*0.42, h*0.58, -0.12, 0, 6.283); ctx.fill();
    }else{
      // 코 주변 하얀 역삼각형
      ctx.beginPath();
      ctx.moveTo(w*0.10, h*0.05);
      ctx.quadraticCurveTo(w*0.55, h*0.15, w*1.05, h*0.30);
      ctx.quadraticCurveTo(w*0.55, h*1.05, w*0.05, h*0.70);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  else if(B.pattern === "calico"){
    ctx.save();
    if(kind === "body"){
      ctx.fillStyle = B.patch1;
      ctx.beginPath(); ctx.ellipse(-w*0.46, -h*0.30, w*0.30, h*0.45, 0.25, 0, 6.283); ctx.fill();
      ctx.fillStyle = B.patch2;
      ctx.beginPath(); ctx.ellipse(w*0.18, -h*0.42, w*0.24, h*0.36, -0.2, 0, 6.283); ctx.fill();
      ctx.fillStyle = B.patch1;
      ctx.beginPath(); ctx.ellipse(-w*0.05, h*0.55, w*0.20, h*0.26, 0, 0, 6.283); ctx.fill();
    }else{
      // 눈을 피해 머리 뒤통수 쪽에만 무늬
      ctx.fillStyle = B.patch2;
      ctx.beginPath(); ctx.ellipse(-w*0.62, -h*0.48, w*0.44, h*0.42, 0.1, 0, 6.283); ctx.fill();
      ctx.fillStyle = B.patch1;
      ctx.beginPath(); ctx.ellipse(w*0.20, -h*0.72, w*0.30, h*0.26, 0, 0, 6.283); ctx.fill();
    }
    ctx.restore();
  }
  else if(B.pattern === "siamese"){
    if(kind === "head"){
      ctx.save(); ctx.globalAlpha = 0.92; ctx.fillStyle = B.dark;
      // 주둥이 주변만 어둡게 (눈은 덮지 않는다)
      ctx.beginPath(); ctx.ellipse(w*0.88, h*0.34, w*0.52, h*0.44, 0, 0, 6.283); ctx.fill();
      ctx.restore();
    }else{
      ctx.save(); ctx.globalAlpha = 0.35; ctx.fillStyle = B.dark;
      ctx.beginPath(); ctx.ellipse(-w*0.75, h*0.1, w*0.4, h*0.7, 0, 0, 6.283); ctx.fill();
      ctx.restore();
    }
  }
}

/* ---------- 서 있는 자세 ---------- */
function drawCatUpright(c, B, p, t){
  const ol = outline(B);
  // 꼬리는 엉덩이 뒤에서 위로 치켜올린다
  drawTailCfg(c, B, t, { x:-p.bodyRX*0.92, y:p.bodyY+4, ang:Math.PI*1.06, curve:0.20,
                         amp:p.tailAmp, freq:p.tailFreq, len:9.5, segs:7, w0:12, w1:6 });

  // 먼 쪽 다리 (조금 어둡게)
  ctx.fillStyle = shade(B.base, -0.16);
  legVertical(p.legSpread[3], p.bodyY+10, p.legLift[3], 8, ol);
  legVertical(p.legSpread[1], p.bodyY+8,  p.legLift[1], 7.5, ol);

  // 몸통
  ctx.save();
  ctx.translate(0, p.bodyY); ctx.rotate(p.bodyRot);
  // 엉덩이
  ctx.beginPath(); ctx.ellipse(-p.bodyRX*0.6, 2, p.bodyRY*1.0, p.bodyRY*1.0, 0, 0, 6.283);
  ctx.fillStyle = B.base; ctx.fill();
  ctx.strokeStyle = ol; ctx.lineWidth = OL_W; ctx.stroke();
  // 몸
  ctx.beginPath(); ctx.ellipse(0, 0, p.bodyRX, p.bodyRY, 0, 0, 6.283);
  ctx.fillStyle = B.base; ctx.fill();
  ctx.save(); ctx.clip();
  ctx.globalAlpha = 0.55; ctx.fillStyle = B.belly;
  ctx.beginPath(); ctx.ellipse(6, p.bodyRY*0.55, p.bodyRX*0.78, p.bodyRY*0.6, 0, 0, 6.283); ctx.fill();
  ctx.globalAlpha = 1;
  furPattern(B, "body", p.bodyRX, p.bodyRY);
  ctx.restore();
  ctx.beginPath(); ctx.ellipse(0, 0, p.bodyRX, p.bodyRY, 0, 0, 6.283);
  ctx.strokeStyle = ol; ctx.lineWidth = OL_W; ctx.stroke();
  ctx.restore();

  // 가까운 쪽 다리
  ctx.fillStyle = B.pattern === "siamese" ? mix(B.base, B.dark, 0.55) : B.base;
  legVertical(p.legSpread[2]+4, p.bodyY+10, p.legLift[2], 8, ol);
  legVertical(p.legSpread[0],   p.bodyY+8,  p.legLift[0], 7.5, ol);

  // 머리
  ctx.save();
  ctx.translate(p.headX, p.headY); ctx.rotate(p.headRot);
  drawHead(c, B, p, t);
  ctx.restore();
}

/* ---------- 앉은 자세 ---------- */
function drawCatSitting(c, B, p, t){
  const ol = outline(B), bob = p.bob;

  // 뒷다리 / 엉덩이
  ctx.beginPath(); ctx.ellipse(-13, -25+bob, 23, 26, 0, 0, 6.283);
  ctx.fillStyle = shade(B.base, -0.08); ctx.fill();
  ctx.strokeStyle = ol; ctx.lineWidth = OL_W; ctx.stroke();

  // 몸통(가슴)
  ctx.save();
  ctx.translate(8, -34+bob);
  ctx.beginPath(); ctx.ellipse(0, 0, 21, 27, 0.05, 0, 6.283);
  ctx.fillStyle = B.base; ctx.fill();
  ctx.save(); ctx.clip();
  ctx.globalAlpha = 0.6; ctx.fillStyle = B.belly;
  ctx.beginPath(); ctx.ellipse(8, 12, 16, 20, 0, 0, 6.283); ctx.fill();
  ctx.globalAlpha = 1;
  furPattern(B, "body", 21, 27);
  ctx.restore();
  ctx.beginPath(); ctx.ellipse(0, 0, 21, 27, 0.05, 0, 6.283);
  ctx.strokeStyle = ol; ctx.lineWidth = OL_W; ctx.stroke();
  ctx.restore();

  // 뒷발 (앞으로 살짝 나온)
  ctx.fillStyle = B.pattern === "siamese" ? mix(B.base, B.dark, 0.6) : shade(B.base, 0.06);
  ctx.beginPath(); ctx.ellipse(-2, -5, 14, 6.5, 0, 0, 6.283); ctx.fill();
  ctx.strokeStyle = ol; ctx.lineWidth = OL_W*0.8; ctx.stroke();

  // 앞다리 두 개
  ctx.fillStyle = B.pattern === "siamese" ? mix(B.base, B.dark, 0.55) : B.base;
  const topY = -30 + bob;
  frontLegSit(24, topY, ol, p.pawR || 0);
  frontLegSit(15, topY, ol, p.pawL || 0);

  // 머리
  ctx.save();
  ctx.translate(15, -66+bob); ctx.rotate(p.headRot);
  drawHead(c, B, p, t);
  ctx.restore();

  // 꼬리: 엉덩이 뒤에서 바닥을 따라 앞발 앞쪽으로 감싼다 (몸 앞에 그림)
  drawTailCfg(c, B, t, { x:-28, y:-8, ang:0.12, curve:-0.10,
                         amp:p.tailAmp*0.55, freq:p.tailFreq, len:9.5, segs:7, w0:11, w1:5 });
}

/* ---------- 다리 ---------- */
function legVertical(x, topY, lift, w, ol){
  const bottom = -lift;
  roundRect(x - w/2, topY, w, bottom - topY, w/2);
  ctx.fill();
  ctx.strokeStyle = ol; ctx.lineWidth = OL_W*0.8; ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(x + 1.5, bottom - 1, w*0.72, w*0.42, 0, 0, 6.283);
  ctx.fill(); ctx.stroke();
}
function frontLegSit(x, topY, ol, lift){
  const bottom = -lift;
  roundRect(x - 4.5, topY, 9, bottom - topY, 4.5);
  ctx.fill();
  ctx.strokeStyle = ol; ctx.lineWidth = OL_W*0.8; ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(x + 2, bottom - 2, 7.5, 4.4, lift ? -0.5 : 0, 0, 6.283);
  ctx.fill(); ctx.stroke();
}

/* ---------- 머리 ---------- */
function drawHead(c, B, p, t){
  const R = p.headR, ol = outline(B);
  const tw = c.earTwitch > 0 ? Math.sin(elapsed*40)*0.18 : 0;
  drawEar(-R*0.60, -R*0.66, -0.38 + tw, B, ol);
  drawEar( R*0.56, -R*0.74,  0.32 + tw, B, ol);

  // 머리
  ctx.beginPath(); ctx.ellipse(0, 0, R*1.06, R, 0, 0, 6.283);
  ctx.fillStyle = B.base; ctx.fill();
  ctx.save(); ctx.clip();
  furPattern(B, "head", R, R);
  ctx.restore();
  ctx.beginPath(); ctx.ellipse(0, 0, R*1.06, R, 0, 0, 6.283);
  ctx.strokeStyle = ol; ctx.lineWidth = OL_W; ctx.stroke();

  // 볼/주둥이
  if(B.pattern !== "siamese"){
    ctx.fillStyle = (B.pattern === "tuxedo" || B.pattern === "calico") ? B.belly : shade(B.base, 0.18);
    ctx.beginPath(); ctx.ellipse(R*0.52, R*0.36, R*0.50, R*0.34, 0, 0, 6.283); ctx.fill();
  }

  // 눈
  drawEye(R*0.12, -R*0.14, R*0.20, p.eyeOpen, B);
  drawEye(R*0.66, -R*0.18, R*0.17, p.eyeOpen, B);

  // 코
  ctx.fillStyle = B.nose;
  ctx.beginPath();
  ctx.moveTo(R*0.76, R*0.16); ctx.lineTo(R*0.98, R*0.16); ctx.lineTo(R*0.87, R*0.31);
  ctx.closePath(); ctx.fill();

  // 입
  ctx.strokeStyle = shade(B.dark, -0.15); ctx.lineWidth = 1.6; ctx.lineCap = "round";
  if(p.mouthOpen > 0.05){
    ctx.fillStyle = "#e07a86";
    ctx.beginPath();
    ctx.ellipse(R*0.87, R*0.45 + p.mouthOpen*2, R*0.15, R*0.09 + p.mouthOpen*R*0.13, 0, 0, 6.283);
    ctx.fill();
  }else{
    ctx.beginPath();
    ctx.moveTo(R*0.87, R*0.33);
    ctx.quadraticCurveTo(R*0.76, R*0.47, R*0.66, R*0.36);
    ctx.moveTo(R*0.87, R*0.33);
    ctx.quadraticCurveTo(R*0.99, R*0.47, R*1.06, R*0.34);
    ctx.stroke();
  }

  // 수염
  ctx.strokeStyle = "rgba(255,255,255,.8)"; ctx.lineWidth = 1.3;
  for(let i=-1;i<=1;i++){
    ctx.beginPath();
    ctx.moveTo(R*0.72, R*0.26 + i*3.2);
    ctx.quadraticCurveTo(R*1.15, R*0.20 + i*5.5, R*1.55, R*0.10 + i*8);
    ctx.stroke();
  }

  // 골골 이펙트
  if(c.purr > 0){
    ctx.save(); ctx.globalAlpha = clamp(c.purr, 0, 1)*0.9;
    ctx.strokeStyle = "#ff9db0"; ctx.lineWidth = 2;
    for(let i=0;i<3;i++){
      const rr = R*1.2 + i*7 + (elapsed*20 % 8);
      ctx.beginPath(); ctx.arc(-R*0.4, -R*0.2, rr, -2.4, -0.9); ctx.stroke();
    }
    ctx.restore();
  }
}
function drawEar(x, y, rot, B, ol){
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.beginPath();
  ctx.moveTo(-9, 6); ctx.quadraticCurveTo(-2, -17, 9, 4);
  ctx.quadraticCurveTo(0, 9, -9, 6); ctx.closePath();
  ctx.fillStyle = B.pattern === "siamese" ? B.dark : shade(B.base, -0.10);
  ctx.fill();
  ctx.strokeStyle = ol; ctx.lineWidth = OL_W*0.8; ctx.stroke();
  ctx.fillStyle = "#f0aab6";
  ctx.beginPath();
  ctx.moveTo(-4.5, 4); ctx.quadraticCurveTo(-1, -8, 5, 3);
  ctx.quadraticCurveTo(0, 6, -4.5, 4); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawEye(x, y, r, open, B){
  if(open <= 0.08){
    ctx.strokeStyle = shade(B.dark, -0.25); ctx.lineWidth = 2; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(x-r*0.95, y); ctx.quadraticCurveTo(x, y+r*0.7, x+r*0.95, y); ctx.stroke();
    return;
  }
  ctx.save();
  ctx.fillStyle = "#2a231f";
  ctx.beginPath(); ctx.ellipse(x, y, r*1.12, r*open*1.28, 0, 0, 6.283); ctx.fill();
  ctx.fillStyle = B.eye;
  ctx.beginPath(); ctx.ellipse(x, y, r, r*open*1.15, 0, 0, 6.283); ctx.fill();
  ctx.fillStyle = "#241d1a";
  ctx.beginPath(); ctx.ellipse(x + r*0.12, y, r*0.34, r*open*1.0, 0, 0, 6.283); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.92)";
  ctx.beginPath(); ctx.arc(x - r*0.32, y - r*0.42*open, r*0.24, 0, 6.283); ctx.fill();
  ctx.restore();
}

/* ---------- 꼬리 ---------- */
function drawTailCfg(c, B, t, cfg){
  const sw = Math.sin(c.tailPhase * cfg.freq) * cfg.amp;
  let x = cfg.x, y = cfg.y, ang = cfg.ang;
  const pts = [[x, y]];
  for(let i=0;i<cfg.segs;i++){
    ang += cfg.curve + sw*0.30 + i*0.02;
    x += Math.cos(ang)*cfg.len;
    y += Math.sin(ang)*cfg.len;
    pts.push([x, y]);
  }
  ctx.save();
  ctx.lineCap = "round";
  // 외곽선
  ctx.strokeStyle = outline(B);
  for(let i=0;i<pts.length-1;i++){
    ctx.lineWidth = lerp(cfg.w0, cfg.w1, i/(pts.length-1)) + 2.6;
    ctx.beginPath(); ctx.moveTo(pts[i][0], pts[i][1]); ctx.lineTo(pts[i+1][0], pts[i+1][1]); ctx.stroke();
  }
  // 본체
  ctx.strokeStyle = B.pattern === "siamese" ? mix(B.base, B.dark, 0.65) : B.base;
  for(let i=0;i<pts.length-1;i++){
    ctx.lineWidth = lerp(cfg.w0, cfg.w1, i/(pts.length-1));
    ctx.beginPath(); ctx.moveTo(pts[i][0], pts[i][1]); ctx.lineTo(pts[i+1][0], pts[i+1][1]); ctx.stroke();
  }
  // 태비 꼬리 줄무늬
  if(B.pattern === "tabby"){
    ctx.globalAlpha = 0.5; ctx.strokeStyle = B.dark;
    for(let i=1;i<pts.length-1;i+=2){
      ctx.lineWidth = lerp(cfg.w0, cfg.w1, i/(pts.length-1));
      const mx = (pts[i][0]+pts[i+1][0])/2, my = (pts[i][1]+pts[i+1][1])/2;
      ctx.beginPath(); ctx.moveTo(pts[i][0], pts[i][1]); ctx.lineTo(mx, my); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  // 꼬리 끝 포인트
  if(B.pattern === "siamese" || B.pattern === "tuxedo"){
    const e = pts[pts.length-1];
    ctx.fillStyle = B.pattern === "siamese" ? B.dark : B.belly;
    ctx.beginPath(); ctx.arc(e[0], e[1], cfg.w1*0.8, 0, 6.283); ctx.fill();
  }
  ctx.restore();
}

/* ---------- 잠자는 자세 (동그랗게 말린 고양이) ---------- */
function drawCatCurled(c, B, t){
  const breath = Math.sin(t*1.6)*1.6, ol = outline(B);
  ctx.save();
  ctx.translate(0, -26 + breath*0.4);

  // 몸을 감싸는 꼬리
  ctx.lineCap = "round";
  ctx.strokeStyle = ol; ctx.lineWidth = 14;
  ctx.beginPath(); ctx.arc(2, 4, 40, 0.30, 2.45); ctx.stroke();
  ctx.strokeStyle = B.pattern === "siamese" ? mix(B.base, B.dark, 0.6) : B.base;
  ctx.lineWidth = 11;
  ctx.beginPath(); ctx.arc(2, 4, 40, 0.30, 2.45); ctx.stroke();
  if(B.pattern === "tabby"){
    ctx.strokeStyle = B.dark; ctx.globalAlpha = 0.5;
    for(let i=0;i<4;i++){ ctx.beginPath(); ctx.arc(2, 4, 40, 0.55+i*0.5, 0.78+i*0.5); ctx.stroke(); }
    ctx.globalAlpha = 1;
  }

  // 둥근 몸
  ctx.beginPath(); ctx.ellipse(0, 0, 44, 26 + breath, 0, 0, 6.283);
  ctx.fillStyle = B.base; ctx.fill();
  ctx.save(); ctx.clip();
  ctx.globalAlpha = 0.5; ctx.fillStyle = B.belly;
  ctx.beginPath(); ctx.ellipse(0, 18, 34, 14, 0, 0, 6.283); ctx.fill();
  ctx.globalAlpha = 1;
  if(B.pattern === "tabby"){
    ctx.globalAlpha = 0.5; ctx.fillStyle = B.dark;
    for(let i=-2;i<=2;i++){ roundRect(i*15-3, -30, 6, 28, 3); ctx.fill(); }
    ctx.globalAlpha = 1;
  }else if(B.pattern === "calico"){
    ctx.fillStyle = B.patch1; ctx.beginPath(); ctx.ellipse(-22,-6,16,15,0,0,6.283); ctx.fill();
    ctx.fillStyle = B.patch2; ctx.beginPath(); ctx.ellipse(14,-9,13,12,0,0,6.283); ctx.fill();
  }else if(B.pattern === "tuxedo"){
    ctx.fillStyle = B.belly; ctx.beginPath(); ctx.ellipse(24, 10, 18, 12, 0, 0, 6.283); ctx.fill();
  }
  ctx.restore();
  ctx.beginPath(); ctx.ellipse(0, 0, 44, 26 + breath, 0, 0, 6.283);
  ctx.strokeStyle = ol; ctx.lineWidth = OL_W; ctx.stroke();

  // 몸에 파묻은 머리
  ctx.save();
  ctx.translate(27, 0); ctx.rotate(0.42);
  drawEar(-11, -13, -0.52, B, ol);
  drawEar(  9, -16,  0.34, B, ol);
  ctx.beginPath(); ctx.ellipse(0, 0, 19, 17.5, 0, 0, 6.283);
  ctx.fillStyle = B.base; ctx.fill();
  ctx.save(); ctx.clip(); furPattern(B, "head", 18, 17); ctx.restore();
  ctx.beginPath(); ctx.ellipse(0, 0, 19, 17.5, 0, 0, 6.283);
  ctx.strokeStyle = ol; ctx.lineWidth = OL_W; ctx.stroke();
  // 감은 눈
  ctx.strokeStyle = shade(B.dark, -0.25); ctx.lineWidth = 2; ctx.lineCap = "round";
  [[-2,-3],[11,-2]].forEach(([ex,ey])=>{
    ctx.beginPath(); ctx.moveTo(ex-4.5, ey); ctx.quadraticCurveTo(ex, ey+4.5, ex+4.5, ey); ctx.stroke();
  });
  // 코
  ctx.fillStyle = B.nose;
  ctx.beginPath(); ctx.moveTo(12, 6); ctx.lineTo(19, 6); ctx.lineTo(15.5, 11); ctx.closePath(); ctx.fill();
  // 수염
  ctx.strokeStyle = "rgba(255,255,255,.7)"; ctx.lineWidth = 1.2;
  for(let i=0;i<2;i++){
    ctx.beginPath(); ctx.moveTo(14, 8+i*3); ctx.quadraticCurveTo(24, 10+i*4, 32, 10+i*7); ctx.stroke();
  }
  ctx.restore();

  // 앞발
  ctx.fillStyle = shade(B.base, 0.12);
  ctx.beginPath(); ctx.ellipse(13, 21, 12, 6, 0.08, 0, 6.283); ctx.fill();
  ctx.strokeStyle = ol; ctx.lineWidth = OL_W*0.8; ctx.stroke();
  ctx.restore();
}

// 색상 유틸
function shade(hex, amt){
  const c = hexToRgb(hex);
  const f = amt >= 0 ? 255 : 0, r = Math.abs(amt);
  return `rgb(${Math.round(lerp(c[0],f,r))},${Math.round(lerp(c[1],f,r))},${Math.round(lerp(c[2],f,r))})`;
}
function mix(h1,h2,t){
  const a=hexToRgb(h1), b=hexToRgb(h2);
  return `rgb(${Math.round(lerp(a[0],b[0],t))},${Math.round(lerp(a[1],b[1],t))},${Math.round(lerp(a[2],b[2],t))})`;
}
function hexToRgb(h){
  if(h[0] !== "#") { // rgb() 문자열이면 파싱
    const m = h.match(/\d+/g); return m ? m.slice(0,3).map(Number) : [0,0,0];
  }
  const n = parseInt(h.slice(1),16);
  return [(n>>16)&255, (n>>8)&255, n&255];
}

// 말풍선
function drawBubble(x, y, text, alpha){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = "bold 16px 'Malgun Gothic', system-ui";
  const w = ctx.measureText(text).width + 24, h = 30;
  ctx.fillStyle = "rgba(255,255,255,.96)";
  ctx.strokeStyle = "#d5bda3"; ctx.lineWidth = 2.5;
  roundRect(x-w/2, y-h, w, h, 12); ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x-7, y-2); ctx.lineTo(x, y+9); ctx.lineTo(x+7, y-2);
  ctx.fillStyle="rgba(255,255,255,.96)"; ctx.fill();
  ctx.strokeStyle="#d5bda3";
  ctx.beginPath(); ctx.moveTo(x-7,y-1); ctx.lineTo(x,y+9); ctx.lineTo(x+7,y-1); ctx.stroke();
  ctx.fillStyle = "#4a3b30"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText(text, x, y-h/2+1);
  ctx.textAlign="left"; ctx.textBaseline="alphabetic";
  ctx.restore();
}

/* =========================================================================
   사진 고양이 관절 리그 (CAT.webp)
   사진을 머리·몸통·꼬리 3마디·네 다리(각 2마디)로 잘라 뼈대에 물리고,
   보행은 발 위치를 정해 2본 IK로 푼다. 관절 각도는 스프링으로 부드럽게 따라간다.
   사진이 없으면 기존 벡터 그림으로 자동 대체.
   ========================================================================= */
const SPR = {
  file: "CAT.webp",
  sx: 56, sy: 25, sw: 449, sh: 406,   // 원본에서 고양이가 차지하는 영역
  W: 114, H: 103,                     // 게임에서의 표시 크기
  ax: 0.655,                          // 발이 바닥에 닿는 x 위치 (0~1)
  comU: 0.52, comV: 0.55,
};
const K_SPR = SPR.H / SPR.sh;                              // 원본 px -> 표시 px
const ORG = { x: SPR.sx + SPR.ax*SPR.sw, y: SPR.sy + SPR.sh };  // 발이 닿는 기준점
const LX = px => (px - ORG.x)*K_SPR;
const LY = py => (py - ORG.y)*K_SPR;

const catImg = new Image();
let catImgReady = false;
const breedSprite = {};               // 품종별 색보정 캔버스
let rigBreed = null, rigReady = false;

const TINT = {
  cheese:  { filter:"saturate(1.45) brightness(1.03)",               mul:"#ffb162", a:0.60 },
  tuxedo:  { filter:"grayscale(0.92) brightness(0.82) contrast(1.2)", mul:"#59617a", a:0.70 },
  calico:  { filter:"saturate(1.06)",                                 mul:null,      a:0 },
  russian: { filter:"grayscale(0.95) brightness(1.03)",               mul:"#a8b5c4", a:0.52 },
  siam:    { filter:"sepia(0.6) saturate(1.15) brightness(1.05)",     mul:"#e6cfa8", a:0.42 },
};
const FUR = { cheese:"#ffdcae", tuxedo:"#cfd6e2", calico:"#f5f0e7", russian:"#e2e9f0", siam:"#f3e6cd" };

catImg.onload = ()=>{
  try{ buildBreedSprites(); catImgReady = true; }catch(e){ catImgReady = false; }
  setTimeout(()=>{
    const ad = document.getElementById("adopt");
    if(!catImgReady || !ad || ad.classList.contains("hidden")) return;
    try{ buildPicks(); }catch(e){}
  }, 0);
};
catImg.onerror = ()=>{ catImgReady = false; };
catImg.src = SPR.file;

function buildBreedSprites(){
  for(const b of BREEDS){
    const c = document.createElement("canvas");
    c.width = SPR.sw; c.height = SPR.sh;
    const g = c.getContext("2d");
    const t = TINT[b.id] || TINT.calico;
    g.filter = t.filter || "none";
    g.drawImage(catImg, SPR.sx, SPR.sy, SPR.sw, SPR.sh, 0, 0, SPR.sw, SPR.sh);
    g.filter = "none";
    if(t.mul && t.a > 0){
      g.globalCompositeOperation = "multiply";
      g.globalAlpha = t.a; g.fillStyle = t.mul; g.fillRect(0, 0, SPR.sw, SPR.sh);
      g.globalAlpha = 1;
      g.globalCompositeOperation = "destination-in";
      g.drawImage(catImg, SPR.sx, SPR.sy, SPR.sw, SPR.sh, 0, 0, SPR.sw, SPR.sh);
      g.globalCompositeOperation = "source-over";
    }
    breedSprite[b.id] = c;
  }
}
const useSprite = ()=> catImgReady && !!breedSprite[S && S.breed];

/* ---------------- 부위 자르기 ----------------
   마스크는 캡슐(선분+반지름)과 타원의 합/차로 정의한다. 경계는 blur 로 부드럽게.
   좌표는 모두 원본 사진 기준. 잘린 조각끼리 겹치게 잘라야 관절이 벌어져도 틈이 안 보인다. */
const cap = (x1,y1,x2,y2,r)=> ({ t:"cap", x1,y1,x2,y2,r });
const ell = (x,y,rx,ry,rot)=> ({ t:"ell", x,y,rx,ry,rot:rot||0 });
const box = (x,y,w,h)=> ({ t:"box", x,y,w,h });

// z 가 작을수록 먼저(뒤에) 그린다. far=true 면 반대편 다리라 조금 어둡게 그린다.
const PARTS = {
  tail2: { z:0,  pivot:[486,105], feather:5, add:[cap(486,105,510,36,18)] },
  tail1: { z:1,  pivot:[462,170], feather:5, add:[cap(462,170,488,101,22)] },
  tail0: { z:2,  pivot:[428,248], feather:6, add:[cap(426,252,464,166,26)] },
  rfU:   { z:3,  pivot:[370,316], feather:4, far:true, add:[cap(370,314,352,366,38)] },
  rfL:   { z:4,  pivot:[352,364], feather:4, far:true, add:[cap(352,362,340,436,36)] },
  ffU:   { z:5,  pivot:[262,300], feather:4, far:true, add:[cap(262,298,258,358,35)] },
  ffL:   { z:6,  pivot:[258,356], feather:4, far:true, add:[cap(258,354,251,436,38)] },
  body:  { z:7,  pivot:[330,250], feather:9,
           add:[ell(322,246,146,101,-0.06)],
           // 다리는 따로 그리므로 배 아래를 잘라 낸다
           sub:[box(150,336,340,130)] },
  head:  { z:8,  pivot:[203,262], feather:7,
           add:[ell(134,224,92,92,0)], sub:[box(190,300,110,70)] },
  rnU:   { z:9,  pivot:[448,298], feather:4, add:[cap(448,296,456,358,41)] },
  rnL:   { z:10, pivot:[456,356], feather:4, add:[cap(456,354,478,436,40)] },
  fnU:   { z:11, pivot:[214,300], feather:4, add:[cap(214,298,178,334,31)] },
  fnL:   { z:12, pivot:[178,332], feather:4, add:[cap(178,330,124,404,34)] },
};
// 뼈대 (부모, 관절 위치는 PARTS.pivot). 다리는 위/아래 2마디.
const BONES = {
  body:  { parent:null },
  head:  { parent:"body" },
  tail0: { parent:"body" }, tail1:{ parent:"tail0" }, tail2:{ parent:"tail1" },
  fnU:   { parent:"body" }, fnL:{ parent:"fnU" },
  ffU:   { parent:"body" }, ffL:{ parent:"ffU" },
  rfU:   { parent:"body" }, rfL:{ parent:"rfU" },
  rnU:   { parent:"body" }, rnL:{ parent:"rnU" },
};
// 다리 4개: [위본, 아래본, 발끝(원본좌표), 걸음 위상]
const LEGS = [
  { u:"rnU", l:"rnL", foot:[476,430], stand:452, phase:0.00, far:false, front:false },
  { u:"fnU", l:"fnL", foot:[126,398], stand:206, phase:0.25, far:false, front:true  },
  { u:"rfU", l:"rfL", foot:[338,430], stand:362, phase:0.50, far:true,  front:false },
  { u:"ffU", l:"ffL", foot:[250,430], stand:256, phase:0.75, far:true,  front:true  },
];

const partCanvas = {};    // 부위별로 잘라 낸 캔버스 {img, ox, oy} (ox,oy = 원본 좌표계의 좌상단)
const REST = {};          // 본별 기준 방향(라디안)과 길이(표시 px)

function maskShapes(g, list, val){
  g.fillStyle = val; g.strokeStyle = val; g.lineCap = "round";
  for(const s of list){
    if(s.t === "cap"){
      g.lineWidth = s.r*2;
      g.beginPath(); g.moveTo(s.x1, s.y1); g.lineTo(s.x2, s.y2); g.stroke();
    }else if(s.t === "ell"){
      g.beginPath(); g.ellipse(s.x, s.y, s.rx, s.ry, s.rot, 0, 6.283); g.fill();
    }else{
      g.fillRect(s.x, s.y, s.w, s.h);
    }
  }
}
function shapesBBox(shapes, pad){
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for(const s of shapes){
    if(s.t === "cap"){
      x0 = Math.min(x0, s.x1-s.r, s.x2-s.r); x1 = Math.max(x1, s.x1+s.r, s.x2+s.r);
      y0 = Math.min(y0, s.y1-s.r, s.y2-s.r); y1 = Math.max(y1, s.y1+s.r, s.y2+s.r);
    }else if(s.t === "ell"){
      const r = Math.max(s.rx, s.ry);
      x0 = Math.min(x0, s.x-r); x1 = Math.max(x1, s.x+r);
      y0 = Math.min(y0, s.y-r); y1 = Math.max(y1, s.y+r);
    }else{
      x0 = Math.min(x0, s.x); x1 = Math.max(x1, s.x+s.w);
      y0 = Math.min(y0, s.y); y1 = Math.max(y1, s.y+s.h);
    }
  }
  return { x0:x0-pad, y0:y0-pad, x1:x1+pad, y1:y1+pad };
}
function buildRig(breedId){
  const src = breedSprite[breedId];
  if(!src) return false;
  for(const name in PARTS){
    const P = PARTS[name];
    // 조각이 차지하는 원본 영역만 잘라 낸다
    const bb = shapesBBox(P.add, P.feather*2.5 + 2);
    const x0 = Math.max(SPR.sx, Math.floor(bb.x0)), y0 = Math.max(SPR.sy, Math.floor(bb.y0));
    const x1 = Math.min(SPR.sx+SPR.sw, Math.ceil(bb.x1)), y1 = Math.min(SPR.sy+SPR.sh, Math.ceil(bb.y1));
    const c = document.createElement("canvas");
    c.width = Math.max(2, x1-x0); c.height = Math.max(2, y1-y0);
    const g = c.getContext("2d");
    g.translate(-x0, -y0);                    // 원본 좌표를 그대로 쓴다
    g.filter = `blur(${P.feather}px)`;        // 경계를 부드럽게
    maskShapes(g, P.add, "#fff");
    if(P.sub){
      g.globalCompositeOperation = "destination-out";
      maskShapes(g, P.sub, "#fff");
      g.globalCompositeOperation = "source-over";
    }
    g.filter = "none";
    g.globalCompositeOperation = "source-in"; // 마스크가 있는 곳에만 사진을 남긴다
    g.drawImage(src, SPR.sx, SPR.sy);
    g.globalCompositeOperation = "source-over";
    partCanvas[name] = { img:c, ox:x0, oy:y0 };
  }
  // 3) 본별 기준 방향/길이
  const dirLen = (a, b)=>({ dir:Math.atan2(b[1]-a[1], b[0]-a[0]),
                            len:Math.hypot(b[0]-a[0], b[1]-a[1])*K_SPR });
  for(const leg of LEGS){
    REST[leg.u] = dirLen(PARTS[leg.u].pivot, PARTS[leg.l].pivot);
    REST[leg.l] = dirLen(PARTS[leg.l].pivot, leg.foot);
    // 무릎이 앞/뒤 어느 쪽으로 꺾이는지 (사진의 자연스러운 방향 유지)
    const h = PARTS[leg.u].pivot, k = PARTS[leg.l].pivot, f = leg.foot;
    leg.flip = Math.sign((k[0]-h[0])*(f[1]-h[1]) - (k[1]-h[1])*(f[0]-h[0])) || 1;
    leg.restFootY = LY(leg.foot[1]);
  }
  for(const leg of LEGS){
    leg.len = REST[leg.u].len + REST[leg.l].len;             // 다리 전체 길이(표시 px)
    // 어깨(고관절)에서 발끝까지의 거리와 방향 — 발을 원하는 위치에 정확히 놓는 데 쓴다
    const h = PARTS[leg.u].pivot;
    leg.hipR   = Math.hypot(leg.foot[0]-h[0], leg.foot[1]-h[1])*K_SPR;
    leg.hipPhi = Math.atan2(leg.foot[1]-h[1], leg.foot[0]-h[0]);
    /* 이 다리가 사진 자세에서 앞/뒤로 낼 수 있는 거리.
       사진 속 앞다리는 이미 앞으로 뻗어 있어서 더 앞으로는 거의 못 간다.
       그래서 다리마다 걸음 구간을 낼 수 있는 범위 안으로 옮겨 준다. */
    const co = Math.cos(leg.hipPhi);
    leg.fwd  = leg.hipR*(co - Math.cos(leg.hipPhi + MAX_LIMB));
    leg.back = leg.hipR*(Math.cos(leg.hipPhi - MAX_LIMB) - co);
    leg.st = 0; leg.d0 = 0; leg.h0 = 0; leg.sw0 = 0; leg.lastDx = 0;
  }
  REST.tail0 = dirLen(PARTS.tail0.pivot, PARTS.tail1.pivot);
  REST.tail1 = dirLen(PARTS.tail1.pivot, PARTS.tail2.pivot);
  REST.tail2 = dirLen(PARTS.tail2.pivot, [508,40]);
  REST.head  = { dir:Math.atan2(224-262, 134-203), len:0 };
  REST.body  = { dir:0, len:0 };
  rigBreed = breedId; rigReady = true;
  return true;
}

// 방 앞쪽(아래쪽)에 있을수록 조금 크게 그려서 원근감을 준다
function depthScale(){ return lerp(0.90, 1.06, clamp((cat.gy - CAT_Y)/(FLOOR_MAX - CAT_Y), 0, 1)); }

/* ---------------- 2D 행렬 ---------------- */
const Mmul = (m,n)=>[ m[0]*n[0]+m[2]*n[1], m[1]*n[0]+m[3]*n[1],
                      m[0]*n[2]+m[2]*n[3], m[1]*n[2]+m[3]*n[3],
                      m[0]*n[4]+m[2]*n[5]+m[4], m[1]*n[4]+m[3]*n[5]+m[5] ];
const Mtrans = (x,y)=>[1,0,0,1,x,y];
const Mrot = a=>{ const c=Math.cos(a), s=Math.sin(a); return [c,s,-s,c,0,0]; };
const Mscale = (x,y)=>[x,0,0,y,0,0];
const Mapply = (m,x,y)=>[ m[0]*x+m[2]*y+m[4], m[1]*x+m[3]*y+m[5] ];

/* ---------------- 리그 상태 ---------------- */
const rig = {
  a: {},        // 본별 회전 (기준 자세로부터의 델타)
  aT: {},       // 목표 각도
  T: {},        // 본별 로컬 변환
  bodyX: 0, bodyY: 0, bodyXT: 0, bodyYT: 0,
  root: null,
  step: 0,      // 발소리용
};
for(const b in BONES){ rig.a[b] = 0; rig.aT[b] = 0; }

// 어떤 본의 월드(로컬공간) 방향 = 조상들의 델타 합 + 기준 방향
function chainDelta(name){
  let s = 0, n = name;
  while(n){ s += rig.a[n]; n = BONES[n].parent; }
  return s;
}

/* ---------------- 자세 만들기 ----------------
   기준 자세는 '사진 그대로'(모든 각도 0). 여기서 조금씩만 돌린다.
   사진을 표준 자세로 억지로 펴면 조각이 심하게 뒤틀리므로, 회전 폭을 작게 유지한다. */
const BONE_ORDER = ["body","head","tail0","tail1","tail2",
                    "fnU","fnL","ffU","ffL","rfU","rfL","rnU","rnL"];
const DRAW_ORDER = Object.keys(PARTS).sort((a,b)=> PARTS[a].z - PARTS[b].z);

const TAU = Math.PI*2;
const BODY_DROP = 4;          // 기본으로 몸을 살짝 낮춰 다리에 여유를 준다
rig.gait = 0;                 // 걸음 위상 (이동 거리로 진행)
const MAX_LIMB = 0.55;        // 다리 관절 최대 회전 (라디안) — 넘으면 사진이 뒤틀린다

/* 보폭 — 빠를수록 넓어진다. 이 거리만큼 나아갈 때 걸음 한 주기가 돈다.
   (속도가 아니라 '나아간 거리'로 위상을 돌려야 발이 땅에서 미끄러지지 않는다) */
function strideLen(){
  return clamp(26 + cat.spd*0.21, 26, 78);
}
// 이동 거리만큼 걸음 위상을 진행 (travel = 지금까지 나아간 총 거리)
function advanceGait(dist){
  rig.gait = (rig.gait + dist/strideLen()) % 1;
  rig.travel += dist;
}
rig.travel = 0;

/* 걸음걸이 종류 — 속도에 따라 자연스럽게 바뀐다.
   duty = 한 주기 중 발이 땅에 붙어 있는 비율. 느릴수록 오래 딛는다.
   ph   = 다리별 착지 시점 [rn(오른뒤), fn(오른앞), rf(왼뒤), ff(왼앞)] */
const GAITS = {
  //  느린 걸음: 대각선이 아니라 한 발씩 차례로 (뒤→앞, 오른→왼)
  walk:   { duty:0.66, ph:[0, 0.28, 0.5, 0.78], bob:2, lift:1.00 },
  //  종종걸음: 대각선 두 발씩
  trot:   { duty:0.48, ph:[0, 0.5, 0.5, 0],     bob:2, lift:1.15 },
  //  전력질주: 뒷발로 차고 앞발로 받는 도약 (공중에 뜨는 구간이 있다)
  gallop: { duty:0.34, ph:[0.08, 0.52, 0, 0.62],bob:1, lift:1.35 },
};
/* 속도에 따라 걸음걸이를 고른다. 경계에서 덜덜 떨지 않게 올라갈 때와
   내려올 때의 기준을 다르게 둔다(히스테리시스) */
rig.gaitK = 0;
const GAIT_LIST = [GAITS.walk, GAITS.trot, GAITS.gallop];
function gaitOf(spd){
  const k = rig.gaitK;
  if(k === 0){ if(spd > 126) rig.gaitK = 1; }
  else if(k === 1){ if(spd > 180) rig.gaitK = 2; else if(spd < 98) rig.gaitK = 0; }
  else if(spd < 152) rig.gaitK = 1;
  return GAIT_LIST[rig.gaitK];
}

/* 다리 한 짝.
   접지 구간에선 발이 땅에 박힌 채 몸만 앞으로 나가고, 유각 구간에선 무릎을 접어
   들어 올리며 앞으로 되돌아온다.
   발이 미끄러지지 않도록 '원하는 발 위치'에서 어깨 각도를 거꾸로 풀어 쓴다.
   half = 한 걸음에 발이 몸을 기준으로 앞뒤로 오가는 거리의 절반 (로컬 px) */
function stepLeg(A, leg, ph, half, ampK, G, gw, sc){
  ph -= Math.floor(ph);
  // 낼 수 있는 범위 안으로 걸음 구간을 옮긴다 (앞으로 못 뻗으면 그만큼 뒤에서 딛는다)
  const mid = clamp(half - leg.fwd, 0, Math.max(0, leg.back - half));
  let dx, lift;
  if(ph < G.duty){                       // ── 접지 (발은 땅에 박아 두고 몸만 나아간다)
    if(!leg.st){ leg.st = 1; leg.d0 = rig.travel; leg.h0 = half - mid; }
    // 발이 몸 기준으로 뒤로 밀리는 거리 = 그동안 실제로 나아간 거리
    dx = clamp(-leg.h0 + (rig.travel - leg.d0)/sc, -half*1.6, half*1.9);
    // 체중을 받아 살짝 눌린다 (양 끝에서 속도가 0 이라 발 딛는 순간이 매끄럽다)
    lift = -0.16*(0.5 - 0.5*Math.cos(TAU*clamp(ph/G.duty, 0, 1)));
  }else{                                 // ── 유각 (발을 들어 앞으로)
    if(leg.st){ leg.st = 0; leg.sw0 = leg.lastDx; }
    const u = (ph - G.duty)/(1 - G.duty);
    /* 에르미트 곡선으로 뒤 → 앞. 양 끝의 '속도'까지 접지 구간과 맞춰 준다.
       특히 착지 직전에 발을 이미 뒤로 당기고 있어야(= 지면 속도와 같아야)
       발이 닿는 순간 앞으로 쭉 미끄러지지 않는다. */
    const vs = 2*half/G.duty*(1 - G.duty);                   // 접지 중 발이 밀리는 속도
    const plant = mid - half;                                // 발을 딛을 자리
    const UR = 0.82;                                         // 여기서부터는 착지 속도로 곧게 당긴다
    if(u >= UR){
      dx = plant + vs*(u - 1);
    }else{
      const uu = u/UR, u2 = uu*uu, u3 = u2*uu;
      const p1 = plant - vs*(1 - UR);
      dx = (2*u3 - 3*u2 + 1)*leg.sw0 + (u3 - 2*u2 + uu)*vs*0.4*UR
         + (-2*u3 + 3*u2)*p1        + (u3 - u2)*vs*UR;
    }
    // 발 들기 — 앞쪽(0.4 지점)에서 가장 높이 들고, 뗄 때와 딛을 때는 속도가 0
    const uw = u < 0.4 ? u/0.8 : 0.5 + (u - 0.4)/1.2;
    lift = 0.5 - 0.5*Math.cos(TAU*uw);
  }
  leg.lastDx = dx;
  // 발끝을 dx 만큼 옮기려면 어깨를 얼마나 돌려야 하는가 (원호 위의 점을 역산)
  const c = clamp(Math.cos(leg.hipPhi) + dx/leg.hipR, -0.999, 0.999);
  A[leg.u] = clamp(Math.acos(c) - leg.hipPhi, -MAX_LIMB, MAX_LIMB)*gw;
  A[leg.l] = lift*ampK*leg.flip*gw;
}

function poseTargets(t){
  const st = cat.state;
  const A = rig.aT;
  for(const b in A) A[b] = 0;
  rig.bodyXT = 0; rig.bodyYT = 0;
  let handled = true;

  // 호흡 — 뛰고 나면 빨라지고 자면 느려진다
  const rate = st === "sleep" ? 0.22 : lerp(0.30, 1.05, cat.exert);
  const br = breathe(t, rate) - 0.5;
  const brA = (st === "sleep" ? 1.5 : 1) * lerp(0.8, 1.7, cat.exert);

  // 꼬리 기본 — 마디마다 조금씩 늦게 따라오는 물결
  const w = 1.5, amp = 0.085;
  A.tail0 = Math.sin(t*w)*amp        + Math.sin(t*2.6)*0.030;
  A.tail1 = Math.sin(t*w - 0.45)*amp*1.5 + Math.sin(t*2.6 - 0.6)*0.045;
  A.tail2 = Math.sin(t*w - 0.90)*amp*2.0 + Math.sin(t*2.6 - 1.2)*0.060 + cat.flick;
  A.head  = Math.sin(t*1.3)*0.025;

  switch(st){
    case "walk": case "run": case "chase": case "wheel": {
      const G = gaitOf(cat.spd);
      const sc = Math.max(0.55, depthScale()*(cat.sx || 1));
      const gw = clamp(cat.spd/26, 0, 1);            // 멈추면 걸음을 접는다
      const fast = G !== GAITS.walk;
      // 접지하는 동안 몸이 나아가는 거리 = 발이 뒤로 밀려나야 하는 거리
      const half = strideLen()*G.duty/(2*sc);
      for(let i=0;i<4;i++)
        stepLeg(A, LEGS[i], rig.gait + G.ph[i], half, 0.30*G.lift, G, gw, sc);
      // 몸통 상하 — 걸을 땐 좌우 발마다 두 번, 달릴 땐 도약마다 크게 한 번
      const g = rig.gait*TAU;
      rig.bodyYT = (G.bob === 2
        ? -Math.abs(Math.sin(g))*1.9
        : -(0.62*Math.sin(g - 1.4) + 0.38*Math.sin(2*(g - 1.4)))*3.6) * gw;
      // 등의 굴신 (달릴수록 크게) + 가속·감속에 따른 앞뒤 기울기
      A.body = Math.sin(g - (fast ? 0.7 : 0))*(fast ? 0.075 : 0.022)*gw
             + clamp(cat.accX*cat.dir/6200, -0.09, 0.09);
      A.head = -A.body*0.55 + cat.lookA*0.5 + Math.sin(g + 0.9)*0.02*gw;
      // 등이 굽었다 펴져도 딛고 있는 발은 제자리에 있어야 한다 (어깨로 상쇄)
      for(let i=0;i<4;i++)
        A[LEGS[i].u] = clamp(A[LEGS[i].u] - rig.a.body, -MAX_LIMB*1.1, MAX_LIMB*1.1);
      // 꼬리는 몸이 흔들리는 것을 따라 한 박자 늦게 휜다
      A.tail0 += (fast ? -0.20 : -0.07) + Math.sin(g - 0.5)*0.07*gw;
      A.tail1 += Math.sin(g - 1.1)*0.11*gw;
      A.tail2 += Math.sin(g - 1.7)*0.15*gw;
      // 멈칫 서 있는 동안엔 숨소리만
      if(gw < 0.35) rig.bodyYT += -br*brA*(1 - gw);
      break;
    }
    case "sit": case "perch": case "litter": case "watch": {
      // 앉은 자세에서도 숨을 쉬고, 아주 느리게 무게중심을 옮긴다
      rig.bodyYT = 7 - br*brA*1.1;
      rig.bodyXT = 4 + Math.sin(t*0.31)*0.9;
      A.body = 0.17 + br*0.010;                     // 앞을 살짝 세운다
      A.head = -0.14 + cat.lookA + br*0.012;
      A.rnU = 0.20; A.rnL = 0.26;                   // 뒷다리를 접는다
      A.rfU = 0.18; A.rfL = 0.22;
      A.fnU = -0.10 + Math.sin(t*0.43)*0.012; A.ffU = -0.06;
      A.tail0 += 0.30; A.tail1 += 0.22; A.tail2 += 0.16;
      break;
    }
    case "play": case "happy": case "bat": {
      rig.bodyYT = 7 - Math.abs(Math.sin(t*6.2))*3.4 - br*brA*0.6;
      rig.bodyXT = 4;
      A.body = 0.17;
      A.head = -0.18 + cat.lookA*0.6;
      A.rnU = 0.22; A.rnL = 0.28; A.rfU = 0.18; A.rfL = 0.22;
      A.tail0 += 0.14 + Math.sin(t*6.2)*0.26;
      A.tail1 += Math.sin(t*6.2 - 0.5)*0.24;
      A.tail2 += Math.sin(t*6.2 - 1.0)*0.22;
      if(st === "bat"){
        /* 앞발 치기 — 웅크렸다가(예비) 확 뻗고(타격) 천천히 되돌린다 */
        const k = clamp(cat.stateT/0.42, 0, 1);
        const sw = k < 0.28 ? -0.5*(1 - Math.cos(Math.PI*k/0.28))          // 당기기
                 : k < 0.46 ? -1 + 2.6*((k - 0.28)/0.18)                   // 뻗기
                            : 1.6 - 1.6*(k - 0.46)/0.54;                   // 되돌리기
        A.fnU = -0.30 - sw*0.22; A.fnL = -0.16 - sw*0.16;
        A.ffU = -0.10 - sw*0.06;
        A.body = 0.17 - sw*0.04;
        A.head = -0.22 - sw*0.05;
      }else{
        A.fnU = -0.10; A.ffU = -0.06;
      }
      break;
    }
    case "groom": {
      /* 핥기 — 서너 번 몰아 핥고 잠깐 쉰다 (일정한 진동이 아니다) */
      const cyc = (t*0.42) % 1;                     // 한 묶음 주기
      const busy = cyc < 0.62 ? 1 : 0;              // 쉬는 구간
      const lk = busy*(0.5 - 0.5*Math.cos(t*9.5));
      rig.bodyYT = 7 - br*brA*0.8; rig.bodyXT = 4;
      A.body = 0.17;
      A.head = 0.20 + lk*0.20 + (1-busy)*cat.lookA*0.5;   // 고개를 숙여 핥는다
      A.rnU = 0.20; A.rnL = 0.26; A.rfU = 0.18; A.rfL = 0.22;
      A.fnU = -0.30 - lk*0.14;                      // 앞발을 입으로
      A.fnL = -0.22 - lk*0.12;
      A.tail0 += 0.30; A.tail1 += 0.20;
      break;
    }
    case "scratch": {
      /* 긁기 — 발을 위로 걸었다가 아래로 당긴다 (좌우 교대) */
      const p1 = (t*2.6) % 1, p2 = (t*2.6 + 0.5) % 1;
      const pull = u => u < 0.34 ? -1 + 2*(u/0.34)      // 위로 걸기
                                 : 1 - 2*((u-0.34)/0.66); // 아래로 당기기
      const s1 = pull(p1), s2 = pull(p2);
      rig.bodyYT = -3 - Math.abs(s1)*0.8; rig.bodyXT = -3;
      A.body = 0.26 + s1*0.015;                     // 몸을 세우고
      A.head = -0.20 + s1*0.03;
      A.fnU = -0.40 - s1*0.20;  A.fnL = -0.20 - s1*0.12;
      A.ffU = -0.34 - s2*0.20;  A.ffL = -0.16 - s2*0.12;
      A.rnU = 0.10; A.rfU = 0.08;
      A.tail0 += 0.16 + s1*0.05;
      break;
    }
    case "eat": case "drink": {
      /* 그릇에 고개를 담그고 씹거나 혀를 놀린다. 가끔 고개를 들어 씹는다 */
      const up = st === "eat" ? (Math.sin(t*0.9) > 0.86 ? 1 : 0) : 0;
      const chew = st === "eat" ? Math.sin(t*7.5)*0.045 : Math.sin(t*11)*0.030;
      rig.bodyYT = 2 - br*brA*0.5;
      A.body = -0.10 + up*0.06;                     // 앞을 낮추고
      A.head = 0.48 + chew - up*0.26;               // 고개를 그릇으로
      A.fnU = 0.10; A.ffU = 0.06;
      A.tail0 += -0.06 + Math.sin(t*0.8)*0.05;
      break;
    }
    case "sleep": case "hide": case "roll": {
      /* 잠 — 깊고 느린 숨. 아주 가끔 몸을 씰룩한다 */
      const tw = Math.max(0, Math.sin(t*0.37) - 0.985)*60;   // 드문 경련
      rig.bodyYT = 19 - br*brA*1.4; rig.bodyXT = 2;          // 바닥에 엎드린다
      A.body = 0.02 + br*0.014;
      A.head = 0.26 + br*0.020 + tw*0.05;
      A.fnU = 0.16 + tw*0.06; A.fnL = 0.14;                  // 발을 몸 아래로 모은다
      A.ffU = 0.14; A.ffL = 0.12;
      A.rnU = 0.22; A.rnL = 0.20;
      A.rfU = 0.20; A.rfL = 0.18;
      A.tail0 += 0.34; A.tail1 += 0.30; A.tail2 += 0.26 + tw*0.10;
      break;
    }
    case "jump": case "fall": {
      const j = cat.jump;
      // 도약 직전엔 웅크리고(예비동작), 뜨는 순간 몸을 쭉 펴고, 내려올 땐 발을 모은다
      const pre = (st === "jump" && j && j.t < j.pre) ? clamp(j.t/j.pre, 0, 1) : 0;
      const up = st === "jump" && j
        ? Math.cos(Math.PI*clamp((j.t - j.pre)/j.dur, 0, 1))
        : clamp(-cat.vy/500, -1, 1);
      if(pre > 0){                                  // ── 웅크리기
        const c2 = Math.sin(Math.PI*pre*0.5);
        rig.bodyYT = 9*c2; rig.bodyXT = 2*c2;
        A.body = 0.06*c2; A.head = -0.10 - 0.10*c2;
        A.rnU = 0.26*c2; A.rnL = 0.30*c2; A.rfU = 0.24*c2; A.rfL = 0.26*c2;
        A.fnU = -0.06*c2; A.ffU = -0.04*c2;
        A.tail0 += 0.10*c2; A.tail1 += 0.14*c2;
        break;
      }
      rig.bodyYT = -3;
      A.body = -0.04*up;
      A.head = -0.12 - clamp(up, 0, 1)*0.08;
      A.fnU = -0.26 - up*0.14; A.ffU = -0.22 - up*0.12;   // 앞발을 앞으로
      A.rnU = 0.24 + up*0.14;  A.rfU = 0.20 + up*0.12;    // 뒷발을 뒤로
      A.fnL = -0.10; A.ffL = -0.08; A.rnL = 0.10; A.rfL = 0.08;
      A.tail0 += -0.30; A.tail1 += -0.18 + Math.sin(t*6)*0.06; A.tail2 += -0.12 + Math.sin(t*6-0.6)*0.09;
      break;
    }
    case "land": {
      /* 착지 — 충격을 무릎으로 받아 깊이 눌린 뒤 천천히 일어선다 */
      const k = clamp(cat.stateT/Math.max(0.25, cat.stateDur), 0, 1);
      const sq = k < 0.22 ? k/0.22 : Math.pow(1 - (k - 0.22)/0.78, 1.6);
      rig.bodyYT = 3 + sq*9;
      A.body = 0.03 + sq*0.05; A.head = 0.06 + sq*0.10;
      A.fnU = -0.10 - sq*0.10; A.ffU = -0.07 - sq*0.08;
      A.fnL = sq*0.12; A.ffL = sq*0.10;
      A.rnU = 0.10 + sq*0.14;  A.rfU = 0.08 + sq*0.12;
      A.rnL = sq*0.16; A.rfL = sq*0.14;
      A.tail0 += 0.10 + sq*0.14; A.tail1 += sq*0.10;
      break;
    }
    case "held": handled = false; break;            // 아래에서 따로
    default: {                                      // idle — 숨쉬기 · 무게중심 이동
      rig.bodyYT = -br*brA*1.15;
      rig.bodyXT = Math.sin(t*0.29)*1.5 + Math.sin(t*0.47 + 1.3)*0.9;
      A.body = br*0.012;
      A.head += cat.lookA + br*0.010;
      // 서 있는 다리에도 아주 작은 무게 이동을 준다
      A.fnU = Math.sin(t*0.31)*0.020;  A.ffU = Math.sin(t*0.31 + 2.1)*0.016;
      A.rnU = Math.sin(t*0.26 + 1)*0.018; A.rfU = Math.sin(t*0.26 + 3)*0.014;
    }
  }
  if(handled) rig.bodyYT += BODY_DROP;
  return handled;
}

// 잡혀 있을 때 — 팔다리와 꼬리가 중력 방향으로 축 늘어진다
function poseHeld(t){
  const A = rig.aT;
  const flip = (cat.face === undefined ? cat.dir : cat.face) < 0 ? 1 : -1;
  // 화면상의 '아래'를 리그 로컬 각도로 환산
  const down = (Math.PI/2 - (rig.rootRot || 0))*flip;
  const kick = cat.limp ? 0.06 : (cat.heldT > 3 ? 1 : 0.45);
  A.body = 0; rig.bodyXT = 0; rig.bodyYT = 0;
  for(let i=0;i<4;i++){
    const leg = LEGS[i];
    const w = Math.sin(t*7 + i*1.7)*0.30*kick;
    A[leg.u] = clamp(down - REST[leg.u].dir + w, -1.3, 1.3);
    A[leg.l] = clamp(down - REST[leg.l].dir - A[leg.u] + w*0.5, -1.0, 1.0);
  }
  const tailTarget = down - Math.PI/2;
  A.tail0 = clamp(tailTarget*0.5, -1.2, 1.2) + Math.sin(t*5)*0.12*kick;
  A.tail1 = clamp(tailTarget*0.25, -0.9, 0.9) + Math.sin(t*5+0.7)*0.14*kick;
  A.tail2 = clamp(tailTarget*0.15, -0.7, 0.7) + Math.sin(t*5+1.4)*0.16*kick;
  A.head  = clamp(tailTarget*0.14, -0.5, 0.5) + (cat.limp ? 0.16 : Math.sin(t*9)*0.08);
}

/* ---------------- 리그 갱신 ----------------
   머리와 꼬리는 '목표 각도로 당겨지는 스프링 + 관성'으로 움직인다.
   몸이 가속/감속/선회할 때 한 박자 늦게 휘었다가 살짝 지나쳐서 되돌아온다. */
const SPRINGS = {                          // k = 당기는 힘, d = 감쇠(작을수록 더 출렁인다)
  body:  { k:230, d:26, drag:0.00 },
  head:  { k:150, d:19, drag:0.55 },
  tail0: { k: 96, d:11, drag:1.00 },
  tail1: { k: 74, d: 9, drag:1.55 },
  tail2: { k: 58, d: 7, drag:2.10 },
};
rig.v = {}; rig.aP = {};
for(const b in BONES){ rig.v[b] = 0; rig.aP[b] = 0; }

function updateRig(dt, t){
  if(!useSprite()) return;
  if(!rigReady || rigBreed !== S.breed){ if(!buildRig(S.breed)) return; }

  /* 방향 전환 — 몸이 실제로 '돌아가는' 것처럼 보이게 각도를 돌린다.
     face = cos(turnA) 라서 정면(0)을 지나는 구간을 빠르게 통과한다 */
  if(cat.turnA === undefined) cat.turnA = cat.dir > 0 ? 0 : Math.PI;
  const wantA = cat.dir > 0 ? 0 : Math.PI;
  const step = clamp(wantA - cat.turnA, -10.5*dt, 10.5*dt);
  cat.turnA += step;
  const turning = Math.abs(wantA - cat.turnA) > 0.02 ? step/Math.max(dt,1e-4) : 0;
  cat.face = Math.cos(cat.turnA);
  if(Math.abs(cat.face) < 0.22) cat.face = 0.22*(cat.dir >= 0 ? 1 : -1);

  const handled = poseTargets(t);
  if(!handled){ computeRoot(); poseHeld(t); }

  // 몸을 돌리는 동안엔 살짝 낮아진다 (제자리에서 몸을 비트는 느낌)
  if(handled) rig.bodyYT += (1 - Math.abs(cat.face))*1.6;

  /* 관성의 근원 — 진행 방향 기준 가속도. 몸이 앞으로 튀어나가면 꼬리는 뒤로 처진다 */
  const fwd  = clamp(cat.accX*cat.dir/900, -2.5, 2.5);        // 앞뒤 가속
  const vert = clamp(cat.accY/900, -2.5, 2.5);                // 상하 가속
  const spin = clamp(turning*0.12 + cat.turnV*0.10, -1.2, 1.2);
  const inertia = clamp(-(fwd*1.3 + vert*0.45 + spin), -2.0, 2.0);

  const held = cat.state === "held";
  // 빠를수록 다리가 목표 각도를 바짝 따라가야 발이 미끄러지지 않는다
  const limbRate = held ? 7 : (cat.spd > 24 ? lerp(30, 58, clamp((cat.spd - 60)/140, 0, 1)) : 14);

  // 스프링은 잘게 나눠 적분한다 (프레임이 길어져도 튀지 않게)
  let rem = dt;
  while(rem > 1e-5){
    const h = Math.min(rem, 1/70); rem -= h;
    for(const b in SPRINGS){
      const S2 = SPRINGS[b];
      const drive = S2.drag ? inertia*S2.drag*(held ? 0.4 : 1)*0.09 : 0;
      rig.v[b] += ((rig.aT[b] + drive - rig.a[b])*S2.k - rig.v[b]*S2.d)*h;
      rig.v[b] = clamp(rig.v[b], -30, 30);
      rig.a[b] = clamp(rig.a[b] + rig.v[b]*h, -1.6, 1.6);
    }
    // 몸통 높이도 스프링으로 (착지·도약에서 묵직하게 눌린다)
    rig.bvy = (rig.bvy || 0) + ((rig.bodyYT - rig.bodyY)*340 - (rig.bvy || 0)*29)*h;
    rig.bodyY += rig.bvy*h;
  }
  /* 다리는 목표 각도를 '따라가되', 따라가느라 생기는 지연만큼 미리 앞서 준다.
     (지연을 그대로 두면 발을 딛는 순간 발이 앞으로 주욱 미끄러진다) */
  const lim = held ? 1.35 : MAX_LIMB*1.25;       // 너무 꺾이면 사진 조각이 뒤틀린다
  for(const b in rig.a){
    if(SPRINGS[b]) continue;
    const target = clamp(rig.aT[b], -lim, lim);
    const prev = rig.aP[b] === undefined ? target : rig.aP[b];
    const lead = clamp((target - prev)/Math.max(dt, 1e-4)/limbRate, -0.18, 0.18);
    rig.aP[b] = target;
    rig.a[b] += (target + lead - rig.a[b])*clamp(limbRate*dt, 0, 1);
  }
  rig.bodyX += (rig.bodyXT - rig.bodyX)*clamp(10*dt, 0, 1);

  computeRigTransforms();
  computeRoot();
}

function computeRigTransforms(){
  for(const name of BONE_ORDER){
    const P = PARTS[name], B = BONES[name];
    const px = LX(P.pivot[0]), py = LY(P.pivot[1]);
    let m = B.parent ? rig.T[B.parent] : Mtrans(rig.bodyX, rig.bodyY);
    m = Mmul(m, Mtrans(px, py));
    m = Mmul(m, Mrot(rig.a[name]));
    m = Mmul(m, Mtrans(-px, -py));
    rig.T[name] = m;
  }
}
function computeRoot(){
  const sc = depthScale();
  let fx = -(cat.face === undefined ? cat.dir : cat.face);   // 사진이 왼쪽을 보므로 반전
  if(Math.abs(fx) < 0.12) fx = 0.12*Math.sign(fx || 1);
  const Sx = sc*cat.sx*fx, Sy = sc*cat.sy;

  if(cat.state === "held" && cat.pin){
    // 집은 점이 손에 오도록, 무게중심이 그 아래로 매달리도록
    const pin = rig.T[cat.pin.part]
      ? Mapply(rig.T[cat.pin.part], LX(cat.pin.sx), LY(cat.pin.sy))
      : [0, -SPR.H*0.5];
    const com = Mapply(rig.T.body, LX(ORG.x + (SPR.comU - SPR.ax)*SPR.sw), LY(SPR.sy + SPR.comV*SPR.sh));
    const dx = (com[0] - pin[0])*Sx, dy = (com[1] - pin[1])*Sy;
    const th = Math.PI/2 - Math.atan2(dy, dx) + cat.swing;
    rig.rootRot = th;
    let m = Mtrans(cat.holdX, cat.holdY);
    m = Mmul(m, Mrot(th));
    m = Mmul(m, Mscale(Sx, Sy));
    m = Mmul(m, Mtrans(-pin[0], -pin[1]));
    rig.root = m;
  }else{
    rig.rootRot = cat.rot;
    let m = Mtrans(cat.x, cat.y);
    m = Mmul(m, Mtrans(0, -SPR.H*0.45));
    m = Mmul(m, Mrot(cat.rot));
    m = Mmul(m, Mtrans(0, SPR.H*0.45));
    m = Mmul(m, Mscale(Sx, Sy));
    rig.root = m;
  }
}

/* ---------------- 그리기 ---------------- */
function drawCatRig(){
  if(!rigReady || !rig.root) return false;
  for(const name of DRAW_ORDER){
    const pc = partCanvas[name];
    if(!pc) continue;
    const m = Mmul(rig.root, rig.T[name]);
    ctx.save();
    ctx.transform(m[0], m[1], m[2], m[3], m[4], m[5]);
    if(PARTS[name].far) ctx.filter = "brightness(0.87) saturate(0.9)";
    ctx.drawImage(pc.img, LX(pc.ox), LY(pc.oy), pc.img.width*K_SPR, pc.img.height*K_SPR);
    ctx.restore();
  }
  return true;
}
// 리그 전체의 화면 바운딩 박스
function catBBox(){
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  if(!rigReady || !rig.root) return { x0:cat.x-40, y0:cat.y-90, x1:cat.x+40, y1:cat.y+10 };
  for(const name of DRAW_ORDER){
    const pc = partCanvas[name]; if(!pc) continue;
    const m = Mmul(rig.root, rig.T[name]);
    const w = pc.img.width*K_SPR, h = pc.img.height*K_SPR;
    const ox = LX(pc.ox), oy = LY(pc.oy);
    for(const [cx, cy] of [[ox,oy],[ox+w,oy],[ox,oy+h],[ox+w,oy+h]]){
      const p = Mapply(m, cx, cy);
      if(p[0]<x0)x0=p[0]; if(p[0]>x1)x1=p[0];
      if(p[1]<y0)y0=p[1]; if(p[1]>y1)y1=p[1];
    }
  }
  return { x0, y0, x1, y1 };
}
// 어느 부위를 집었는지 찾는다 (마스크 도형으로 판정)
function shapeHit(shapes, x, y, grow){
  for(const s of shapes){
    if(s.t === "cap"){
      const dx = s.x2-s.x1, dy = s.y2-s.y1, L2 = dx*dx+dy*dy || 1;
      let u = ((x-s.x1)*dx + (y-s.y1)*dy)/L2; u = clamp(u, 0, 1);
      const px = s.x1+dx*u, py = s.y1+dy*u;
      if(Math.hypot(x-px, y-py) <= s.r + grow) return true;
    }else if(s.t === "ell"){
      const c = Math.cos(-s.rot), si = Math.sin(-s.rot);
      const ax = (x-s.x)*c - (y-s.y)*si, ay = (x-s.x)*si + (y-s.y)*c;
      if((ax*ax)/((s.rx+grow)*(s.rx+grow)) + (ay*ay)/((s.ry+grow)*(s.ry+grow)) <= 1) return true;
    }else if(x >= s.x-grow && x <= s.x+s.w+grow && y >= s.y-grow && y <= s.y+s.h+grow) return true;
  }
  return false;
}
function pickGrabPart(px, py){
  if(!rigReady || !rig.root) return null;
  for(let i=DRAW_ORDER.length-1; i>=0; i--){
    const name = DRAW_ORDER[i];
    const m = Mmul(rig.root, rig.T[name]);
    const det = m[0]*m[3] - m[1]*m[2];
    if(!det) continue;
    const ix = px - m[4], iy = py - m[5];
    const lx = ( m[3]*ix - m[2]*iy)/det;
    const ly = (-m[1]*ix + m[0]*iy)/det;
    const sxp = lx/K_SPR + ORG.x, syp = ly/K_SPR + ORG.y;   // 원본 좌표로
    const P = PARTS[name];
    if(shapeHit(P.add, sxp, syp, 4) && !(P.sub && shapeHit(P.sub, sxp, syp, -6)))
      return { part:name, sx:sxp, sy:syp };
  }
  return null;
}
// 리그가 준비됐을 때의 그림자 — 발밑 접지 그림자 + 몸통 그림자
function drawRigShadow(c){
  const sc = depthScale();
  let air = 0;
  if(c.state === "jump" && c.jump) air = Math.sin(Math.PI*clamp(c.jump.t/c.jump.dur, 0, 1));
  else if(c.state === "held" || c.state === "fall") air = clamp((c.gy - c.y)/220, 0, 1);
  const gy = (c.state === "held" || c.state === "fall") ? c.gy : c.y;

  ctx.save();
  // 몸통 아래 넓고 옅은 그림자
  ctx.globalAlpha = (1 - air*0.7)*0.9;
  const gr = ctx.createRadialGradient(c.x, gy + 3, 2, c.x, gy + 3, 46*sc*(1 - air*0.35));
  gr.addColorStop(0, "rgba(72,48,32,.30)");
  gr.addColorStop(0.55, "rgba(72,48,32,.16)");
  gr.addColorStop(1, "rgba(72,48,32,0)");
  ctx.fillStyle = gr;
  ctx.beginPath();
  ctx.ellipse(c.x, gy + 3, 46*sc*(1 - air*0.35), 12*sc*(1 - air*0.3), 0, 0, 6.283);
  ctx.fill();
  // 발끝 접지 그림자 (발이 바닥에 가까울수록 진하다)
  if(rigReady && rig.root && air < 0.5 && c.state !== "held"){
    for(let i=0;i<4;i++){
      const leg = LEGS[i];
      const w = Mapply(Mmul(rig.root, rig.T[leg.l]), LX(leg.foot[0]), LY(leg.foot[1]));
      const lift = clamp(1 - (gy - w[1])/16, 0, 1);   // 발이 뜰수록 옅게
      if(lift <= 0.02) continue;
      ctx.globalAlpha = 0.34*lift*(1 - air);
      ctx.fillStyle = "rgba(60,40,26,1)";
      ctx.beginPath();
      ctx.ellipse(w[0], gy + 3, 8.5*sc, 3.4*sc, 0, 0, 6.283);
      ctx.fill();
    }
  }
  ctx.restore();
}
// 입양 화면 미리보기 — 리그 없이 한 장 그리기
function drawSpritePlain(g, breedId, cx, baseY, h){

// 집힌 자리에서 털이 딸려 올라오는 모습

// 잡혀 있을 때의 만화식 표현
function drawHeldMarks(t){
  if(cat.state !== "held") return;
  const pw = pinWorld();
  const bb = catBBox();
  const pin = pw ? { x:pw[0], y:pw[1] } : { x:(bb.x0+bb.x1)/2, y:bb.y0 };
  const speed = Math.hypot(cat.vx, cat.vy);

  if(cat.limp){                              // 얌전히 매달려 있으면 하트

  }
  if(cat.heldT > 1.2){                       // 땀방울
    ctx.save();
    const k = (t*1.6) % 1;
    ctx.globalAlpha = 0.85*(1 - k*0.6);
    ctx.fillStyle = "#9fd8f5";
    ctx.beginPath();
    ctx.ellipse(pin.x - 24, pin.y - 6 + k*9, 4.2, 6, 0.2, 0, 6.283);

  if(cat.heldT > 3){                         // 화남 표시
    ctx.save();

    const s = 1 + Math.sin(t*9)*0.12;
    ctx.scale(s, s);
    ctx.strokeStyle = "#e0574f"; ctx.lineWidth = 2.6; ctx.lineCap = "round";
    for(let i=0;i<2;i++){
      ctx.save(); ctx.rotate(i*Math.PI/2);
      ctx.beginPath();
      ctx.moveTo(-6, -3); ctx.lineTo(0, 0); ctx.lineTo(-6, 3);
      ctx.moveTo(6, -3);  ctx.lineTo(0, 0); ctx.lineTo(6, 3);
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }
  if(speed > 420){                           // 휘두를 때 잔상 선
    ctx.save();
    ctx.globalAlpha = clamp((speed - 420)/700, 0, 0.6);
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.lineCap = "round";
    const a = Math.atan2(cat.vy, cat.vx);
    const cxm = (bb.x0+bb.x1)/2, cym = (bb.y0+bb.y1)/2;
    for(let i=-1;i<=1;i++){
      const ox = -Math.cos(a)*26 + Math.sin(a)*i*15;
      const oy = -Math.sin(a)*26 - Math.cos(a)*i*15;
      ctx.beginPath();
      ctx.moveTo(cxm + ox, cym + oy);
      ctx.lineTo(cxm + ox - Math.cos(a)*22, cym + oy - Math.sin(a)*22);
      ctx.stroke();
    }
    ctx.restore();
  }
}

/* --------- 낚싯대 ---------
   진짜 낚싯대 장난감처럼 :
   막대는 화면 밖(오른쪽 위)에서 들어오고, 낚싯줄은 속도에 따라 늘어졌다 팽팽해지며,
   깃털은 손보다 한 박자 늦게 끌려와 매달린 채 흔들린다 */
function resetLure(){
  lure.x = pointer.x; lure.y = pointer.y;
  lure.vx = lure.vy = lure.ang = lure.angV = 0;
  lure.tipX = clamp(pointer.x + 118, 150, W-24); lure.tipY = 48;
}
function updateLure(dt){
  if(!playMode) return;
  const h = Math.min(dt, 1/50);
  // 줄에 매달린 깃털 = 스프링 + 감쇠. 손을 조금 늦게 따라오고 멈춰도 잠깐 더 흔들린다
  lure.vx += ((pointer.x - lure.x)*168 - lure.vx*16) * h;
  lure.vy += ((pointer.y - lure.y)*168 - lure.vy*16) * h;
  lure.x  += lure.vx*h;  lure.y += lure.vy*h;
  // 막대 끝 — 손보다 앞서 나가되 굼뜨게 따라온다
  const tx = clamp(lure.x + 118, 150, W-24), ty = 44 + Math.sin(elapsed*1.6)*3;
  const k = 1 - Math.pow(0.02, h);
  lure.tipX = lerp(lure.tipX, tx, k); lure.tipY = lerp(lure.tipY, ty, k);
  // 매달린 각도 — 줄이 당기는 방향으로 기울고, 가로 속도만큼 뒤로 젖혀진다
  const strAng = Math.atan2(lure.x - lure.tipX, lure.y - lure.tipY);
  const target = strAng*0.34 + clamp(-lure.vx/560, -0.85, 0.85) + Math.sin(elapsed*4.3)*0.045;
  lure.angV += ((target - lure.ang)*120 - lure.angV*12) * h;
  lure.ang  += lure.angV*h;
}
// 깃털이 바닥에 떨구는 그림자 (고양이·가구보다 먼저 깔린다)
function drawLureShadow(){
  if(!playMode || !pointer.active) return;
  const up = clamp((CAT_Y - lure.y)/380, 0, 1);        // 바닥에서 뜬 정도
  const rx = 20 + up*24;                               // 높이 뜰수록 넓고 흐려진다
  shadowEllipse(lure.x + up*22, CAT_Y + 8, rx, rx*0.3, (1-up)*1.05 + 0.12);
}

/* 깃털 한 장. 아래(+y)로 뻗는 국소 좌표에 그린다 */
function plumeVane(len, wid, cBase, cMid, cTip, curve, phase){
  const P = t => {                                     // 깃대(rachis) 곡선
    const u = 1-t;
    return [ 2*u*t*(curve*len*0.35) + t*t*(curve*len),
             2*u*t*(len*0.52)       + t*t*len ];
  };
  const N = t => {                                     // 깃대에 수직인 방향
    const a = P(Math.max(0, t-0.03)), b = P(Math.min(1, t+0.03));
    const dx = b[0]-a[0], dy = b[1]-a[1], d = Math.hypot(dx,dy) || 1;
    return [-dy/d, dx/d];
  };
  // 뿌리는 가늘고 중간이 가장 넓다. 바람에 판이 살짝 물결친다
  const wAt = t => wid * Math.pow(Math.sin(Math.PI*clamp(t*0.94+0.05, 0, 1)), 0.75)
                       * (1 + 0.09*Math.sin(t*8 + phase));
  const SEG = 14, L = 1, R = 0.72;                     // 좌우가 다른 실제 깃털 비율
  const edge = (side, from, to) => {
    const step = from <= to ? 1 : -1;
    for(let i=from; step > 0 ? i <= to : i >= to; i += step){
      const t = i/SEG, p = P(t), n = N(t), w = wAt(t)*side;
      const x = p[0] + n[0]*w, y = p[1] + n[1]*w;
      (i === 0 && step > 0) ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
  };
  const tip = P(1);
  const vane = () => { ctx.beginPath(); edge(-L, 0, SEG); edge(R, SEG, 0); ctx.closePath(); };
  // 뿌리에서 끝으로 갈수록 밝아지는 깃털 판
  const g = ctx.createLinearGradient(0, 0, tip[0], tip[1]);
  g.addColorStop(0, cBase); g.addColorStop(0.45, cMid); g.addColorStop(1, cTip);
  ctx.fillStyle = g; vane(); ctx.fill();
  // 깃대를 경계로 한쪽은 빛을, 반대쪽은 그늘을 받는다
  const mp = P(0.5), mn = N(0.5), mw = wAt(0.5);
  const sg = ctx.createLinearGradient(mp[0]-mn[0]*mw, mp[1]-mn[1]*mw, mp[0]+mn[0]*mw, mp[1]+mn[1]*mw);
  sg.addColorStop(0,    "rgba(255,250,238,.34)");
  sg.addColorStop(0.42, "rgba(255,250,238,0)");
  sg.addColorStop(0.58, "rgba(46,36,24,.10)");
  sg.addColorStop(1,    "rgba(46,36,24,.34)");
  ctx.fillStyle = sg; vane(); ctx.fill();
  // 깃가지(barb) — 깃대에서 끝쪽으로 비스듬히 뻗는다
  ctx.lineWidth = 0.62;
  for(let i=1; i<SEG; i++){
    const t = i/SEG, p = P(t), n = N(t), w = wAt(t);
    const fw = P(Math.min(1, t+0.12));
    const bx = (fw[0]-p[0])*0.55, by = (fw[1]-p[1])*0.55;   // 끝 방향으로 눕히기
    ctx.strokeStyle = "rgba(255,250,236,.30)";
    ctx.beginPath();
    ctx.moveTo(p[0], p[1]); ctx.lineTo(p[0] - n[0]*w*0.94 + bx, p[1] - n[1]*w*0.94 + by);
    ctx.stroke();
    ctx.strokeStyle = "rgba(52,40,26,.40)";
    ctx.beginPath();
    ctx.moveTo(p[0], p[1]); ctx.lineTo(p[0] + n[0]*w*R*0.94 + bx, p[1] + n[1]*w*R*0.94 + by);
    ctx.stroke();
  }
  // 야생 깃털의 가로 얼룩무늬
  ctx.save(); vane(); ctx.clip();
  ctx.strokeStyle = "rgba(64,50,34,.20)"; ctx.lineWidth = 2.4;
  for(let i=1; i<=3; i++){
    const t = 0.28 + i*0.19, p = P(t), n = N(t), w = wAt(t)*1.4;
    ctx.beginPath();
    ctx.moveTo(p[0] - n[0]*w, p[1] - n[1]*w); ctx.lineTo(p[0] + n[0]*w, p[1] + n[1]*w);
    ctx.stroke();
  }
  ctx.restore();
  // 판 가장자리 — 배경과 분리되도록 아주 옅게
  ctx.strokeStyle = "rgba(58,45,30,.28)"; ctx.lineWidth = 0.6;
  vane(); ctx.stroke();
  // 끝에서 갈라진 몇 가닥
  ctx.strokeStyle = "rgba(240,234,220,.45)"; ctx.lineWidth = 0.7;
  for(let i=-1; i<=1; i++){
    const p = P(0.9), n = N(0.9);
    ctx.beginPath(); ctx.moveTo(p[0], p[1]);
    ctx.lineTo(tip[0] + n[0]*i*2.6 + i*1.2, tip[1] + 3.5 + Math.abs(i)*1.5);
    ctx.stroke();
  }
  // 깃대
  ctx.strokeStyle = "rgba(252,248,238,.75)"; ctx.lineWidth = 1.1;
  ctx.beginPath(); ctx.moveTo(0,0);
  ctx.quadraticCurveTo(curve*len*0.35, len*0.52, tip[0], tip[1]); ctx.stroke();
  ctx.strokeStyle = "rgba(70,56,40,.35)"; ctx.lineWidth = 0.5;
  ctx.beginPath(); ctx.moveTo(0.6, 0);
  ctx.quadraticCurveTo(curve*len*0.35+0.6, len*0.52, tip[0]+0.6, tip[1]); ctx.stroke();
}

function drawFeather(){
  if(!playMode) return;
  const x = lure.x, y = lure.y, tx = lure.tipX, ty = lure.tipY;
  const sc = lerp(0.80, 1.06, clamp((y - 90)/(FLOOR_Y - 90), 0, 1));   // 멀수록(위) 작게
  const spd = Math.hypot(lure.vx, lure.vy);

  ctx.save();
  ctx.lineCap = "round"; ctx.lineJoin = "round";

  // --- 막대 : 화면 밖에서 들어오는 가느다란 검은 대 ---
  const hx = W + 120, hy = -90;                       // 손잡이(화면 밖)
  const ang = Math.atan2(ty - hy, tx - hx);
  const nx = -Math.sin(ang), ny = Math.cos(ang);
  const rod = (w0, w1, style) => {
    ctx.beginPath();
    ctx.moveTo(hx + nx*w0, hy + ny*w0); ctx.lineTo(tx + nx*w1, ty + ny*w1);
    ctx.lineTo(tx - nx*w1, ty - ny*w1); ctx.lineTo(hx - nx*w0, hy - ny*w0);
    ctx.closePath(); ctx.fillStyle = style; ctx.fill();
  };
  ctx.globalAlpha = 0.30;                             // 대의 그림자
  rod(6.5, 2.6, "rgba(30,22,14,.9)");
  ctx.globalAlpha = 1;
  const rg = ctx.createLinearGradient(hx, hy, tx, ty);
  rg.addColorStop(0, "#3a332c"); rg.addColorStop(0.5, "#22201e"); rg.addColorStop(1, "#4a453e");
  rod(5.2, 1.7, rg);
  ctx.strokeStyle = "rgba(255,248,235,.28)"; ctx.lineWidth = 0.9;   // 대 위쪽 하이라이트
  ctx.beginPath();
  ctx.moveTo(hx + nx*3.2, hy + ny*3.2); ctx.lineTo(tx + nx*0.9, ty + ny*0.9); ctx.stroke();

  // --- 낚싯줄 : 천천히 움직이면 늘어지고, 휙 채면 팽팽해진다 ---
  const sag = clamp(34 - spd/26, 3, 34);
  const mx = (tx + x)/2, my = (ty + y)/2 + sag;
  const line = (w, style) => {
    ctx.strokeStyle = style; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(tx, ty);
    ctx.quadraticCurveTo(mx, my, x, y - 3*sc); ctx.stroke();
  };
  line(1.6, "rgba(35,28,20,.28)");                    // 줄 그림자
  line(0.9, "rgba(240,236,228,.55)");                 // 빛 받는 면

  // --- 깃털 뭉치 ---
  ctx.translate(x, y);
  ctx.rotate(lure.ang);
  ctx.scale(sc, sc);
  // 줄을 묶은 매듭과 회전 고리
  ctx.fillStyle = "#9a9490";
  ctx.beginPath(); ctx.ellipse(0, -3.5, 1.9, 3.2, 0, 0, 6.283); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.45)";
  ctx.beginPath(); ctx.ellipse(-0.6, -4.4, 0.7, 1.4, 0, 0, 6.283); ctx.fill();

  const fl = Math.sin(elapsed*9)*0.10 + lure.angV*0.02;   // 판이 팔랑이는 정도
  ctx.save(); ctx.rotate(-0.52 - fl);     plumeVane(33, 6.0, "#4a3f31", "#8a7a61", "#c3b393", -0.20, 1.1); ctx.restore();
  ctx.save(); ctx.rotate( 0.44 + fl);     plumeVane(29, 5.6, "#554836", "#9a8a6d", "#d2c3a4",  0.24, 2.7); ctx.restore();
  ctx.save(); ctx.rotate(-0.04 + fl*0.4); plumeVane(38, 6.6, "#3f362a", "#7d6f57", "#e2d6bb",  0.06, 0.3); ctx.restore();
  // 묶인 뿌리를 감춘 실
  ctx.fillStyle = "#7d6a4e";
  ctx.beginPath(); ctx.ellipse(0, 1.2, 3.2, 2.4, 0, 0, 6.283); ctx.fill();
  ctx.strokeStyle = "rgba(50,38,24,.5)"; ctx.lineWidth = 0.7;
  ctx.beginPath(); ctx.moveTo(-3, 0.4); ctx.lineTo(3, 0.9);
  ctx.moveTo(-3, 2.2); ctx.lineTo(3, 2.6); ctx.stroke();
  ctx.restore();
}

/* --------- 방 분위기 (사진 고양이와 어울리도록) --------- */
// 벽과 바닥이 만나는 곳의 그늘 — 방에 깊이를 준다
function drawFloorAO(){
  // 벽에 바짝 붙은 진한 접지 그늘
  let g = ctx.createLinearGradient(0, FLOOR_Y-1, 0, FLOOR_Y+10);
  g.addColorStop(0, "rgba(48,32,18,.40)");
  g.addColorStop(1, "rgba(48,32,18,0)");
  ctx.fillStyle = g; ctx.fillRect(0, FLOOR_Y-1, W, 11);
  // 그 뒤로 넓게 퍼지는 반그림자
  g = ctx.createLinearGradient(0, FLOOR_Y, 0, FLOOR_Y+44);
  g.addColorStop(0, "rgba(58,40,24,.22)");
  g.addColorStop(1, "rgba(58,40,24,0)");
  ctx.fillStyle = g; ctx.fillRect(0, FLOOR_Y, W, 44);
}

/* --------- 창을 통과한 빛이 바닥에 그리는 창살 무늬 ---------
   창의 네 유리면을 바닥에 투영해 한 번만 그려 두고 매 프레임 겹쳐 쓴다 */
const _lightPatch = {};
function lightPatch(color){
  if(_lightPatch[color]) return _lightPatch[color];
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const g = c.getContext("2d");
  // 창 (u,v) -> 바닥 좌표. 창 위쪽일수록 방 안쪽(앞)으로 길게 늘어난다
  const P = (u, v) => {
    const nearL = [556, FLOOR_Y+16], nearR = [792, FLOOR_Y+16];
    const farL  = [452, H+22],       farR  = [756, H+22];
    const lx = nearL[0] + (farL[0]-nearL[0])*(1-v), ly = nearL[1] + (farL[1]-nearL[1])*(1-v);
    const rx = nearR[0] + (farR[0]-nearR[0])*(1-v), ry = nearR[1] + (farR[1]-nearR[1])*(1-v);
    return [lx + (rx-lx)*u, ly + (ry-ly)*u];
  };
  const pane = (u0, u1, v0, v1) => {
    const a = P(u0,v0), b = P(u1,v0), d = P(u1,v1), e = P(u0,v1);
    g.beginPath();
    g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.lineTo(d[0],d[1]); g.lineTo(e[0],e[1]);
    g.closePath(); g.fill();
  };
  const grad = g.createLinearGradient(0, FLOOR_Y, 0, H+20);
  grad.addColorStop(0,   color.replace("$A", "0.46"));
  grad.addColorStop(0.55,color.replace("$A", "0.24"));
  grad.addColorStop(1,   color.replace("$A", "0"));
  g.fillStyle = grad;
  if(g.filter !== undefined) g.filter = "blur(7px)";
  pane(0.02, 0.46, 0.04, 0.46); pane(0.54, 0.98, 0.04, 0.46);
  pane(0.02, 0.46, 0.54, 0.96); pane(0.54, 0.98, 0.54, 0.96);
  g.filter = "none";
  _lightPatch[color] = c;
  return c;
}
// 창에서 들어오는 빛 + 가장자리 비네팅
/* 바닥에 떨어진 창살 모양 햇빛.
   가구와 고양이보다 '먼저' 그린다. 위에 덮으면 그 자리에 있는 것들이
   전부 하얗게 날아가 버린다 (빛은 바닥에 깔리는 것이지 물건을 가리지 않는다) */
function drawSunPatch(){
  if(S.lightOff) return;
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.globalAlpha = 0.55;
  ctx.drawImage(lightPatch("rgba(255,226,158,$A)"), 0, 0);
  ctx.restore();
}

function drawRoomMood(t){
  ctx.save();
  if(!S.lightOff){
    ctx.globalCompositeOperation = "lighter";
    // 빛이 퍼지며 방 전체가 아주 살짝 밝아진다 (여기서 세게 올리면 다 날아간다)
    let g = ctx.createRadialGradient(740, 430, 20, 740, 430, 430);
    g.addColorStop(0, "rgba(255,232,180,.06)");
    g.addColorStop(0.55, "rgba(255,232,180,.025)");
    g.addColorStop(1, "rgba(255,232,180,0)");
    ctx.fillStyle = g; ctx.fillRect(300, 120, W-300, H-120);
    // 창 주변 벽에 번지는 반사광
    g = ctx.createRadialGradient(705, 150, 20, 705, 150, 300);
    g.addColorStop(0, "rgba(255,240,206,.07)");
    g.addColorStop(1, "rgba(255,240,206,0)");
    ctx.fillStyle = g; ctx.fillRect(400, 0, W-400, 460);
  }
  ctx.restore();
  // 왼쪽에서 오른쪽(창)으로 갈수록 밝아지는 전체 광량
  ctx.save();
  const lr = ctx.createLinearGradient(0, 0, W, 0);
  lr.addColorStop(0, "rgba(40,28,18,.18)");
  lr.addColorStop(0.45, "rgba(40,28,18,.04)");
  lr.addColorStop(1, "rgba(40,28,18,0)");
  ctx.fillStyle = lr; ctx.fillRect(0, 0, W, H);
  // 가장자리 비네팅 (사진처럼 시선이 가운데로 모이게)
  const v = ctx.createRadialGradient(W*0.52, H*0.44, H*0.34, W*0.52, H*0.44, H*1.02);
  v.addColorStop(0, "rgba(46,32,20,0)");
  v.addColorStop(0.65, "rgba(46,32,20,.10)");
  v.addColorStop(1, "rgba(46,32,20,.30)");
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

/* --------- 야간 오버레이 --------- */
function drawNight(){
  if(!S.lightOff) return;
  ctx.save();
  // 밤의 실내는 채도가 빠지고 푸르게 가라앉는다
  ctx.fillStyle = "rgba(20,28,54,.52)";
  ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation = "multiply";
  ctx.fillStyle = "rgba(120,140,190,.35)";
  ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation = "lighter";
  // 창살 모양 달빛 (패치 자체가 옅어져서 알파로 보정)
  ctx.globalAlpha = 0.78;
  ctx.drawImage(lightPatch("rgba(176,206,255,$A)"), 0, 0);
  ctx.globalAlpha = 1;
  const g = ctx.createRadialGradient(705,140,20, 705,140,360);
  g.addColorStop(0,"rgba(178,204,255,.20)"); g.addColorStop(1,"rgba(178,204,255,0)");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.restore();
  // 켜 둔 플로어 램프
  for(const f of (S.furn||[])) if(f.t === "lamp") lampGlow(f.x, f.y);
}
