<style>
/* ===== 기본 레이아웃 ===== */
:root{
  --bg:#f6ece1;
  --panel:#fffaf3;
  --line:#e2cdb6;
  --ink:#4a3b30;
  --ink-soft:#8a7565;
  --accent:#e88b5a;
  --accent-dark:#c96a3c;
  --shadow:0 6px 0 rgba(120,90,70,.18);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  background:radial-gradient(120% 120% at 50% 0%, #fff6ea 0%, var(--bg) 60%, #ecd9c6 100%);
  color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  display:flex; flex-direction:column; align-items:center;
  padding:12px; gap:10px;
  overflow-x:hidden;
}
.wrap{width:100%; max-width:980px; display:flex; flex-direction:column; gap:10px;}

/* ===== 상단 바 ===== */
.topbar{
  display:flex; align-items:center; gap:10px;
  background:var(--panel); border:2px solid var(--line); border-radius:16px;
  padding:8px 12px; box-shadow:var(--shadow);
}
.logo{font-weight:800; font-size:18px; letter-spacing:-.5px;}
.logo small{font-weight:600; color:var(--ink-soft); font-size:12px; margin-left:4px;}
.catname{
  margin-left:auto; display:flex; align-items:center; gap:8px;
  font-weight:700; font-size:15px;
}
.badge{
  background:#f3e2d1; border:1.5px solid var(--line); border-radius:999px;
  padding:2px 10px; font-size:12px; color:var(--ink-soft); font-weight:700;
}
.icon-btn{
  border:2px solid var(--line); background:#fff; border-radius:12px;
  width:36px; height:36px; font-size:16px; cursor:pointer; line-height:1;
}
.icon-btn:hover{background:#fdf1e4;}

/* ===== 스탯 ===== */
.stats{
  display:grid; grid-template-columns:repeat(5,1fr); gap:8px;
  background:var(--panel); border:2px solid var(--line); border-radius:16px;
  padding:10px; box-shadow:var(--shadow);
}
.stat{display:flex; flex-direction:column; gap:4px;}
.stat .lab{display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:var(--ink-soft);}
.bar{height:12px; background:#eddfd0; border-radius:999px; overflow:hidden; border:1.5px solid #dcc6ad;}
.bar > i{display:block; height:100%; width:50%; border-radius:999px; transition:width .3s ease, background .3s;}

/* ===== 무대 ===== */
.stage{
  position:relative; width:100%; border:3px solid #cbb096; border-radius:20px;
  overflow:hidden; box-shadow:0 10px 0 rgba(120,90,70,.2); background:#d9b98f;
  touch-action:none;
}
canvas{display:block; width:100%; height:auto;}
.stage.playmode{cursor:none;}

/* ===== 액션 버튼 ===== */
.actions{display:grid; grid-template-columns:repeat(7,1fr); gap:8px;}
.act{
  background:var(--panel); border:2px solid var(--line); border-radius:16px;
  padding:10px 4px 8px; cursor:pointer; text-align:center;
  box-shadow:var(--shadow); transition:transform .08s, background .15s;
  display:flex; flex-direction:column; align-items:center; gap:2px;
}
.act:hover{background:#fff3e6;}
.act:active{transform:translateY(3px); box-shadow:0 3px 0 rgba(120,90,70,.18);}
.act .em{font-size:22px; line-height:1;}
.act .tx{font-size:12px; font-weight:700;}
.act.on{background:#ffe6cf; border-color:var(--accent);}
.act[disabled]{opacity:.45; cursor:not-allowed;}
.hint{
  text-align:center; font-size:12px; color:var(--ink-soft); min-height:18px; font-weight:600;
}

/* ===== 꾸미기 바 ===== */
.editbar{
  background:var(--panel); border:2px solid var(--accent); border-radius:16px;
  padding:10px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:8px;
}
.editbar.hidden{display:none;}
.ptools{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.ptools .etitle{font-weight:800; font-size:15px;}
.ptools .ehelp{font-size:12px; color:var(--ink-soft); font-weight:600; margin-right:auto;}
.ptools .btn{padding:8px 14px; font-size:13px; border-radius:12px;}
.palette{
  display:flex; gap:8px; overflow-x:auto; padding:4px 2px 8px;
  scrollbar-width:thin;
}
.pitem{
  flex:0 0 auto; width:88px; border:2px solid var(--line); border-radius:14px;
  background:#fff; cursor:pointer; text-align:center; padding:4px 4px 6px;
  transition:transform .1s, background .15s;
}
.pitem:hover{transform:translateY(-3px); background:#fff3e6; border-color:var(--accent);}
.pitem:active{transform:translateY(0);}
.pitem canvas{width:76px; height:76px; display:block; margin:0 auto;}
.pitem span{display:block; font-size:11px; font-weight:700; color:var(--ink-soft); margin-top:2px;}
.stage.editmode{cursor:move; outline:3px dashed var(--accent); outline-offset:-3px;}
.stage.grabbing{cursor:grabbing;}

/* ===== 입양 화면 ===== */
.modal{
  position:fixed; inset:0; background:rgba(60,44,34,.55); backdrop-filter:blur(3px);
  display:flex; align-items:center; justify-content:center; padding:16px; z-index:50;
}
.modal.hidden{display:none;}
.card{
  background:var(--panel); border:3px solid var(--line); border-radius:24px;
  padding:20px; width:100%; max-width:720px; box-shadow:0 12px 0 rgba(60,44,34,.25);
  max-height:92vh; overflow:auto;
}
.card h2{margin:0 0 4px; font-size:22px;}
.card p.sub{margin:0 0 14px; color:var(--ink-soft); font-size:13px; font-weight:600;}
.picks{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px;}
.pick{
  border:2.5px solid var(--line); border-radius:16px; background:#fff; padding:8px;
  cursor:pointer; text-align:center; transition:transform .1s;
}
.pick:hover{transform:translateY(-3px);}
.pick.sel{border-color:var(--accent); background:#fff3e6;}
.pick canvas{width:100%; height:auto; display:block;}
.pick .nm{font-size:13px; font-weight:800; margin-top:4px;}
.pick .ds{font-size:11px; color:var(--ink-soft); font-weight:600;}
.namerow{display:flex; gap:8px; margin-top:16px;}
input[type=text]{
  flex:1; padding:12px 14px; border:2.5px solid var(--line); border-radius:14px;
  font-size:15px; font-family:inherit; font-weight:700; color:var(--ink); background:#fff;
}
input[type=text]:focus{outline:none; border-color:var(--accent);}
.btn{
  background:var(--accent); color:#fff; border:none; border-radius:14px;
  padding:12px 22px; font-size:15px; font-weight:800; cursor:pointer;
  box-shadow:0 4px 0 var(--accent-dark); font-family:inherit;
}
.btn:active{transform:translateY(2px); box-shadow:0 2px 0 var(--accent-dark);}
.btn.ghost{background:#fff; color:var(--ink); box-shadow:0 4px 0 var(--line); border:2px solid var(--line);}

/* ===== 토스트 ===== */
.toast{
  position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
  background:rgba(58,44,35,.92); color:#fff; padding:10px 18px; border-radius:999px;
  font-size:13px; font-weight:700; opacity:0; pointer-events:none; transition:.25s; z-index:60;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

@media (max-width:640px){
  .stats{grid-template-columns:repeat(3,1fr);}
  .actions{grid-template-columns:repeat(4,1fr);}
  .logo small{display:none;}
  .ptools .ehelp{width:100%; margin-right:0;}
}

/* 작은 폰(≤480px): 상단바 이름·배지와 버튼 글자가 두 줄로 깨지는 것을 막는다 */
@media (max-width:480px){
  .topbar{flex-wrap:wrap; row-gap:6px; padding:8px 10px;}
  .logo{font-size:16px;}
  .catname{font-size:13px; gap:6px;}
  .catname #uiName{white-space:nowrap;}
  .badge{font-size:11px; padding:2px 8px; white-space:nowrap;}
  .icon-btn{width:32px; height:32px; font-size:14px;}
  .namerow .btn{white-space:nowrap; padding:12px 16px;}
  .hint{font-size:11px;}
}
</style>
</head>

<div class="wrap">
  <div class="topbar">

</div>

<!-- 입양 모달 -->
<div class="modal" id="adopt">
  <div class="card">
    <h2>어떤 고양이를 입양할까요?</h2>
    <p class="sub">스타터 고양이를 고르고 이름을 지어주세요. 성격에 따라 행동이 조금씩 달라요.</p>
    <div class="picks" id="picks"></div>
    <div class="namerow">
      <input type="text" id="nameInput" maxlength="10" placeholder="이름 (예: 나비)">

</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* =========================================================================
   CatHome - 고양이 육성 시뮬레이션
   외부 에셋 없이 Canvas 벡터 드로잉으로 전부 그립니다.
   ========================================================================= */

/* ---------------------------- 상수 / 설정 ---------------------------- */
const W = 960, H = 600;              // 논리 해상도
const FLOOR_Y   = 442;               // 벽과 바닥이 만나는 선 (바닥을 넓게 쓰려고 위로 올렸다)
const CAT_Y     = FLOOR_Y + 22;      // 고양이가 걸어다니는 기본 바닥선
const FLOOR_MIN = FLOOR_Y + 8;       // 바닥 가구를 놓을 수 있는 앞뒤 범위
const FLOOR_MAX = H - 14;
const WALL_MIN  = 28, WALL_MAX = FLOOR_Y - 74;
const X_MIN = 64, X_MAX = 900;       // 좌우 이동 범위
const GRAVITY = 1500;                // 장난감에 걸리는 중력 (px/s^2)
const TOY_GY  = CAT_Y + 8;           // 장난감의 기본 바닥선
const TOY_MIN = FLOOR_MIN + 4;       // 장난감을 놓을 수 있는 앞뒤 범위
const TOY_MAX = FLOOR_MAX;
// 장난감은 저마다 자기 바닥선을 갖는다 (앞뒤 어디에나 놓을 수 있게)
const toyGY = o => clamp((o && o.gy !== undefined) ? o.gy : TOY_GY, TOY_MIN, TOY_MAX);
/* 손을 놓았을 때 어느 앞뒤 자리에 떨어질지 정한다.
   - 바닥 근처에서 놓으면 그 자리
   - 위에서 던지면 잡고 있던 자리를 기준으로, 아래로 던진 만큼 앞쪽으로 나아간다
   - 위로 띄우면 원래 자리로 되돌아온다 */
function throwLanding(y, vy, curGY, min, max){
  // 바닥에 닿을 만큼 내려놓았고 힘도 없으면 그 자리에 그대로 놓인다
  if(Math.abs(vy) < 200 && y >= curGY - 40) return clamp(y, min, max);
  // 던졌을 때는 잡고 있던 자리를 기준으로, 세로로 던진 만큼 앞뒤로 날아간다
  // (아래로 던지면 방 앞쪽, 위로 띄우면 방 뒤쪽. 들어 올린 높이는 영향을 주지 않는다)
  return clamp(curGY + vy*0.11, min, max);
}
const MAX_FURN = 42;                 // 배치 가능한 최대 가구 수
const HOLD_DY = 104;                 // 고양이를 잡았을 때 손에서 발까지의 거리
const SAVE_KEY = "cathome.save.v1";

// 스탯 감소 속도 (분당). 100 -> 0 까지 걸리는 시간을 기준으로 계산.
const DECAY = {
  hunger: 100 / 45,   // 45분
  thirst: 100 / 35,   // 35분
  happy:  100 / 60,   // 60분
  clean:  100 / 110,  // 110분
  energy: 100 / 95,   // 95분 (깨어 있을 때)
};
const ENERGY_RECOVER = 100 / 5;  // 자는 동안 5분이면 완충
const ENERGY_REST    = 100 / 22; // 앉아 쉬거나 구경하는 동안의 회복 (분당)
const OFFLINE_MULT = 0.35;       // 접속하지 않은 동안의 소모 배율

// 품종 팔레트
const BREEDS = [
  { id:"cheese", name:"치즈", desc:"먹보 · 애교쟁이", pattern:"tabby",
    base:"#efa254", dark:"#d07a2c", belly:"#ffe4c2", eye:"#4aa96c", nose:"#e58f8f",
    trait:{ appetite:1.25, energy:1.0, social:1.2 } },
  { id:"tuxedo", name:"턱시도", desc:"똑똑 · 새침함", pattern:"tuxedo",
    base:"#3a4150", dark:"#252b36", belly:"#f8f5ef", eye:"#f0c24a", nose:"#c98b8b",
    trait:{ appetite:1.0, energy:1.1, social:0.8 } },
  { id:"calico", name:"삼색", desc:"자유분방 · 활발", pattern:"calico",
    base:"#f7f0e4", dark:"#3b342f", belly:"#ffffff", eye:"#7fae4d", nose:"#e79a9a",
    patch1:"#e08a3c", patch2:"#3b342f",
    trait:{ appetite:1.0, energy:1.3, social:1.0 } },
  { id:"russian", name:"회색 태비", desc:"차분 · 잠꾸러기", pattern:"tabby",
    base:"#9aa3ad", dark:"#6d7681", belly:"#e6ebef", eye:"#69c07a", nose:"#c9a0a0",
    trait:{ appetite:0.9, energy:0.75, social:0.9 } },
  { id:"siam", name:"샴", desc:"수다쟁이 · 응석", pattern:"siamese",
    base:"#f0e2cd", dark:"#5b4534", belly:"#fdf6ea", eye:"#5cb6e8", nose:"#b08d7a",
    trait:{ appetite:1.0, energy:1.0, social:1.35 } },
];

/* =========================================================================
   가구 카탈로그
   kind : floor(바닥) / wall(벽) / toy(물리 장난감)
   roles: 고양이가 이 가구로 할 수 있는 행동
   ========================================================================= */
const FURN = {
  rug:      { name:"러그",     kind:"floor", deco:true, w:230, h:52, draw:dRug },
  tower:    { name:"캣타워",   kind:"floor", w:96,  h:178, roles:["perch","scratch"], draw:dTower },
  bed:      { name:"방석",     kind:"floor", w:118, h:38,  roles:["sleep"],   draw:dBed },
  scratcher:{ name:"스크래처", kind:"floor", w:58,  h:94,  roles:["scratch"], draw:dScratcher },
  box:      { name:"종이상자", kind:"floor", w:96,  h:68,  roles:["hide"],    draw:dBox },
  tunnel:   { name:"캣터널",   kind:"floor", w:146, h:64,  roles:["hide"],    draw:dTunnel },
  sofa:     { name:"소파",     kind:"floor", w:160, h:90,  roles:["sleep","perch"], draw:dSofa },
  wheel:    { name:"캣휠",     kind:"floor", w:136, h:136, roles:["run"],     draw:dWheel },
  plant:    { name:"화분",     kind:"floor", w:62,  h:102, draw:dPlant },
  bowlF:    { name:"밥그릇",   kind:"floor", w:66,  h:30,  roles:["food"],    draw:dBowlF },
  bowlW:    { name:"물그릇",   kind:"floor", w:60,  h:28,  roles:["water"],   draw:dBowlW },

function furnSpot(f, role){
  const D = FURN[f.t];
  switch(role){
    case "food":   return { x:f.x-76, y:f.y-2 };
    case "water":  return f.t === "fountain" ? { x:f.x-58, y:f.y-2 } : { x:f.x-74, y:f.y-2 };
    case "litter": return { x:f.x-30, y:f.y-2 };
    case "sleep":
      if(f.t === "sofa")    return { x:f.x-10, y:f.y-46, jump:true };
      if(f.t === "hammock") return { x:f.x, y:f.y-58, jump:true };
      if(f.t === "cave")    return { x:f.x, y:f.y-16, behind:true, jump:true };
      return { x:f.x, y:f.y-12 };                       // 방석은 오목한 안쪽에 앉는다
    case "perch":
      if(f.t === "tower") return { x:f.x+2, y:f.y-164, jump:true };
      if(f.t === "shelf" || f.t === "step") return { x:f.x, y:f.y-D.h/2, jump:true };
      if(f.t === "hammock") return { x:f.x, y:f.y-58, jump:true };
      return { x:f.x-14, y:f.y-48, jump:true };
    case "scratch":
      return f.t === "tower" ? { x:f.x+58, y:f.y-4 } : { x:f.x-42, y:f.y-2 };
    case "hide":
      if(f.t === "tunnel") return { x:f.x-26, y:f.y-10, behind:true, jump:true };
      if(f.t === "cave")   return { x:f.x, y:f.y-16, behind:true, jump:true };
      return { x:f.x, y:f.y-12, behind:true, jump:true };
    case "run":    return { x:f.x-2, y:f.y-12, behind:true, jump:true };
    case "catnip": return { x:f.x-32, y:f.y-2 };                    // 캣닢 옆에서 뒹군다
    case "watch":  return { x:f.x-2, y:Math.min(FLOOR_MAX-6, f.y+26) };  // 어항 앞에 앉아 구경
  }
  return { x:f.x, y:f.y };
}
function furnWithRole(role){
  return (S.furn||[]).filter(f => (FURN[f.t].roles||[]).indexOf(role) >= 0);
}
// 역할을 가진 가구 중 고양이와 가장 가까운 것
function nearestFurn(role){
  const list = furnWithRole(role);
  if(!list.length) return null;
  let best = list[0], bd = 1e9;
  for(const f of list){
    const d = Math.abs(f.x - cat.x) + Math.abs(f.y - cat.y)*0.5;
    if(d < bd){ bd = d; best = f; }
  }
  return best;
}

/* ---------------------------- 사운드 (WebAudio 합성) ---------------------------- */
let actx = null;
function audio(){
  if(!soundOn) return null;
  if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
  if(actx.state === "suspended") actx.resume();
  return actx;
}
/* --- 고양이 발성 엔진 ------------------------------------------------------
   실제 고양이 소리 = 성대(하모닉스가 풍부한 원음) + 성도(입 모양 = 포먼트).
   catCry()에 곡선 값만 다르게 넣어서 야옹/냥/트릴/하악질 등을 전부 만든다.  */
let _noiseBuf = null, _rumbleBuf = null;
function whiteBuf(a){                       // 화이트 노이즈 (숨소리 / 하악질)
  if(!_noiseBuf){
    _noiseBuf = a.createBuffer(1, a.sampleRate*3, a.sampleRate);
    const d = _noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  }
  return _noiseBuf;
}
function rumbleBuf(a){                      // 저역 랜덤워크 (지터 / 골골거림)
  if(!_rumbleBuf){
    _rumbleBuf = a.createBuffer(1, a.sampleRate*3, a.sampleRate);
    const d = _rumbleBuf.getChannelData(0); let v = 0;
    for(let i=0;i<d.length;i++){ v = v*0.985 + (Math.random()*2-1)*0.015; d[i] = v*8; }
  }
  return _rumbleBuf;
}
function catCry(o){
  const a = audio(); if(!a) return;
  const t = a.currentTime + (o.at || 0);
  const dur = o.dur, E = t + dur;
  const pk  = o.peak || 0.24;
  const def = (v,d)=> (v === undefined ? d : v);

  // 입이 가장 크게 벌어지는 순간 / 다시 닫기 시작하는 순간
  const atk    = Math.min(def(o.attack, 0.045), dur*0.25);
  const openT  = t + clamp(Math.max(atk+0.01, dur*def(o.openAt, 0.28)), 0, dur*0.55);
  const closeT = t + clamp(dur*def(o.closeAt, 0.8), (openT-t)+dur*0.05, dur*0.95);

  /* 출구 게인 - 다물었다가(ㅁ) 벌리고(ㅑ) 다시 닫는(ㅗㅇ) 흐름 */
  const out = a.createGain();
  out.gain.setValueAtTime(0.0001, t);
  out.gain.exponentialRampToValueAtTime(pk*def(o.head, 0.2), t+atk);
  out.gain.exponentialRampToValueAtTime(pk, openT);
  out.gain.setValueAtTime(pk, closeT);
  out.gain.exponentialRampToValueAtTime(pk*def(o.tail, 0.3), E);
  out.gain.exponentialRampToValueAtTime(0.0001, E + def(o.release, 0.07));
  out.connect(a.destination);

  /* 음색 - 입이 닫히면 먹먹하고 벌리면 밝다 */
  const tn = o.tone || [800, 4300, 1000];
  const tone = a.createBiquadFilter();
  tone.type = "lowpass"; tone.Q.value = 0.6;
  tone.frequency.setValueAtTime(tn[0], t);
  tone.frequency.exponentialRampToValueAtTime(tn[1], openT);
  tone.frequency.exponentialRampToValueAtTime(tn[2], E);
  tone.connect(out);

  /* 포먼트 - 각 f는 [시작, 가장 벌렸을 때, 닫을 때] */
  const bus = a.createGain();
  (o.formants || []).forEach(fm=>{
    const bp = a.createBiquadFilter();
    bp.type = "bandpass"; bp.Q.value = fm.q || 9;
    bp.frequency.setValueAtTime(fm.f[0], t);
    bp.frequency.exponentialRampToValueAtTime(fm.f[1], openT);
    bp.frequency.exponentialRampToValueAtTime(fm.f[2], E);
    const bg = a.createGain(); bg.gain.value = fm.g;
    bus.connect(bp); bp.connect(bg); bg.connect(tone);
  });
  const dry = a.createGain(); dry.gain.value = def(o.dry, 0.16);  // 몸통이 될 원음
  bus.connect(dry); dry.connect(tone);

  /* 거친 소리(하악질/성난 울음)는 파형을 찌그러뜨린다 */
  const pre = a.createGain();
  if(o.rasp){
    const ws = a.createWaveShaper(), n = 1024, curve = new Float32Array(n);
    for(let i=0;i<n;i++){ const x = i/(n-1)*2-1; curve[i] = Math.tanh(x*3.4); }
    ws.curve = curve; ws.oversample = "2x";
    pre.connect(ws); ws.connect(bus);
  }else{
    pre.connect(bus);
  }

  /* 성대 - o.f0 는 [시간비율, 주파수] 점을 이은 피치 곡선 */
  if(o.voiced !== false){
    const base = o.f0[0][1], oscs = [];
    [["sawtooth", 1, 0.62], [o.wave2 || "square", 1.006, 0.18]].forEach(w=>{
      const osc = a.createOscillator();
      osc.type = w[0];
      o.f0.forEach((pt,i)=>{
        const tt = t + dur*pt[0];
        if(i === 0) osc.frequency.setValueAtTime(pt[1]*w[1], tt);
        else        osc.frequency.exponentialRampToValueAtTime(pt[1]*w[1], tt);
      });
      const og = a.createGain(); og.gain.value = w[2];
      osc.connect(og); og.connect(pre);
      osc.start(t); osc.stop(E+0.1);
      oscs.push(osc);
    });
    // 떨림(비브라토) - 고양이 특유의 파르르 떠는 울음
    const vd = def(o.vibDepth, 0.045);
    if(vd > 0){
      const vib = a.createOscillator(), vg = a.createGain();
      vib.frequency.setValueAtTime(def(o.vibRate, 22), t);
      vg.gain.setValueAtTime(base*vd*(o.vibRamp === false ? 1 : 0.25), t);
      vg.gain.linearRampToValueAtTime(base*vd, E);
      vib.connect(vg); oscs.forEach(x=> vg.connect(x.frequency));
      vib.start(t); vib.stop(E+0.1);
    }
    // 지터 - 기계처럼 규칙적이지 않게 주파수를 미세하게 흔든다
    const jt = def(o.jitter, 0.03);
    if(jt > 0){
      const jn = a.createBufferSource(); jn.buffer = rumbleBuf(a);
      const jg = a.createGain(); jg.gain.value = base*jt;
      jn.connect(jg); oscs.forEach(x=> jg.connect(x.frequency));
      jn.start(t, Math.random()*1.2); jn.stop(E+0.1);
    }
  }

  /* 숨소리 / 바람소리 */
  if(o.noise){
    const nf2 = o.noiseFreq || [2400, 2000];
    const ns = a.createBufferSource(); ns.buffer = whiteBuf(a);
    const nf = a.createBiquadFilter(); nf.type = "bandpass"; nf.Q.value = def(o.noiseQ, 0.9);
    nf.frequency.setValueAtTime(nf2[0], t);
    nf.frequency.exponentialRampToValueAtTime(nf2[1], E);
    const ng = a.createGain();
    ng.gain.setValueAtTime(0.0001, t);
    ng.gain.exponentialRampToValueAtTime(o.noise, openT);
    ng.gain.setValueAtTime(o.noise, closeT);
    ng.gain.exponentialRampToValueAtTime(0.0001, E+0.05);
    ns.connect(nf); nf.connect(ng); ng.connect(o.mouthNoise ? bus : tone);
    ns.start(t, Math.random()*1.2); ns.stop(E+0.1);
  }
}

  o.frequency.value = 42+Math.random()*10;

  const ns = a.createBufferSource(); ns.buffer = rumbleBuf(a);
  const lp = a.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=520; lp.Q.value=1.2;
  const ng = a.createGain(); ng.gain.value = 0.4;
  ns.connect(lp); lp.connect(ng); ng.connect(gate);
  ns.start(t, Math.random()*1.2); ns.stop(E);
}

/* --- 상황(mood)에 맞는 울음소리를 무작위로 골라 낸다 --- */
function catVoice(mood, pitch){
  const p = pitch || 1, r = Math.random();
  switch(mood){
    case "beg":                                  // 밥 달라고 조를 때
      return r<0.55 ? sfxMeowLong(p*0.95) : r<0.85 ? sfxMeow(p*0.95) : sfxMeowLong(p);
    case "happy":                                // 쓰다듬을 때 / 기분 좋을 때
      return r<0.32 ? sfxPurr() : r<0.62 ? sfxTrill(p*1.05) : r<0.85 ? sfxMew(p) : sfxMeow(p);
    case "greet":                                // 인사
      return r<0.5 ? sfxTrill(p) : r<0.85 ? sfxMeow(p) : sfxMew(p*1.1);
    case "surprise":                             // 깜짝 놀랐을 때
      return r<0.5 ? sfxMew(p*1.25) : r<0.8 ? sfxMeow(p*1.2) : sfxTrill(p*1.2);
    case "angry":                                // 짜증날 때
      return r<0.4 ? sfxYowl(p) : r<0.7 ? sfxHiss() : sfxMeow(p*1.25);
    case "scared":                               // 세게 던져졌을 때
      return r<0.5 ? sfxYowl(p*1.15) : r<0.8 ? sfxHiss() : sfxMew(p*1.35);
    case "hunt":                                 // 사냥 본능
      return r<0.6 ? sfxChatter() : sfxMew(p*1.2);
    default:                                     // 그냥 부르는 소리
      return r<0.45 ? sfxMeow(p) : r<0.75 ? sfxMew(p*1.1) : sfxTrill(p);
  }
}
/* --- 생활 소음(폴리) -------------------------------------------------------
   삑- 하는 발진음 대신 전부 "노이즈 + 짧은 공진"으로 만든다.
   현실의 소리는 대부분 마찰(노이즈)과 물체의 울림(공진)이 겹친 결과라서   */
function shapedNoise(a, dur, decay, grain){        // 감쇠하는 노이즈 한 덩어리
  const n = Math.max(1, (a.sampleRate*dur)|0);
  const b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
  for(let i=0;i<n;i++){
    const x = i/n;
    let v = Math.random()*2-1;
    if(grain) v *= (Math.random() < grain ? 1 : 0.3);   // 알갱이가 튀는 느낌
    d[i] = v * Math.pow(1-x, decay);
  }
  return b;
}
function grainBuf(a, dur, count, tail){            // 알갱이가 후두둑 쏟아지는 소리
  const n = Math.max(1, (a.sampleRate*dur)|0);
  const b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
  for(let k=0;k<count;k++){
    const s = (Math.pow(Math.random(), tail || 1) * n)|0;   // 앞쪽에 몰리게
    const len = 40 + (Math.random()*90|0);
    const amp = 0.4 + Math.random()*0.6;
    for(let i=0;i<len && s+i<n;i++) d[s+i] += (Math.random()*2-1)*amp*Math.pow(1-i/len, 2.5);
  }
  return b;
}
function noiseVoice(o){                            // 노이즈 → 필터(스윕) → 엔벨로프
  const a = audio(); if(!a) return;
  const t = a.currentTime + (o.at || 0), dur = o.dur, E = t + dur;
  const src = a.createBufferSource(); src.buffer = o.mk(a);
  let node = src;
  if(o.band){
    const bp = a.createBiquadFilter();
    bp.type = o.filter || "bandpass"; bp.Q.value = o.q || 1;
    bp.frequency.setValueAtTime(o.band[0], t);
    bp.frequency.exponentialRampToValueAtTime(o.band[1], E);
    node.connect(bp); node = bp;
  }
  if(o.hp){
    const hp = a.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = o.hp;
    node.connect(hp); node = hp;
  }
  const g = a.createGain();
  const atk = Math.min(o.attack === undefined ? 0.004 : o.attack, dur*0.4);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(o.peak, t+atk);
  g.gain.exponentialRampToValueAtTime(0.0001, E);
  node.connect(g); g.connect(a.destination);
  src.start(t, Math.random()*0.001); src.stop(E+0.02);
}
function resTone(o){                               // 물체를 툭 쳤을 때의 짧은 울림
  const a = audio(); if(!a) return;
  const t = a.currentTime + (o.at || 0), dur = o.dur, E = t + dur;
  const osc = a.createOscillator(); osc.type = o.type || "sine";
  osc.frequency.setValueAtTime(o.f[0], t);
  osc.frequency.exponentialRampToValueAtTime(o.f[1], E);
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(o.peak, t + Math.min(0.006, dur*0.2));
  g.gain.exponentialRampToValueAtTime(0.0001, E);
  osc.connect(g); g.connect(a.destination);
  osc.start(t); osc.stop(E+0.02);
}

// 스크래처 긁기 - 드드득 (발톱이 결에 걸리는 그레인 + 몸통 울림)
function sfxScratch(){
  const dur = 0.18 + Math.random()*0.12;
  const rate = 45 + Math.random()*35;
  noiseVoice({
    mk: a=>{
      const n = Math.max(1,(a.sampleRate*dur)|0);
      const b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
      for(let i=0;i<n;i++){
        const x = i/n, tt = x*dur;
        const grain = 0.35 + 0.65*Math.abs(Math.sin(Math.PI*rate*tt + Math.sin(x*37)*1.6));
        d[i] = (Math.random()*2-1) * grain * Math.min(1, x*14) * Math.pow(1-x, 1.1);
      }
      return b;
    },
    dur, band:[2600, 850], q:1.1, peak:0.13, attack:0.012, hp:280 });
  resTone({ f:[150, 95], dur:0.14, peak:0.03, type:"triangle" });   // 골판지가 울리는 소리
}

/* ---------------------------- 세이브 / 로드 ---------------------------- */
// 처음 시작할 때의 기본 인테리어
function defaultFurn(){
  // 처음엔 꼭 필요한 것만. 나머지는 🛋️ 꾸미기에서 직접 채워 넣는 재미로 남겨 둔다
  return [
    { t:"bowlF",  x:262, y:478 },
    { t:"bowlW",  x:346, y:478 },
    { t:"bed",    x:600, y:494 },
    { t:"litter", x:836, y:482 },
  ];
}
function defaultToys(){
  return [
    { t:"ball", x:470, y:524, gy:524, vx:0, vy:0, rot:0 },
  ];
}
function newSave(breedId, name){
  return {
    breed: breedId,
    name: name,
    born: now(),
    lastSeen: now(),
    stats: { hunger:80, thirst:80, happy:85, clean:90, energy:80 },
    bowlFood: 2,     // 남은 사료 (0~3)
    bowlWater: 2,    // 남은 물 (0~3)
    litter: 15,      // 화장실 더러움 (0~100)
    lightOff: false,
    furn: defaultFurn(),
    toys: defaultToys(),
  };
}
function save(){
  if(!S || S.__preview) return;   // 입양 전 미리보기 상태는 저장하지 않는다
  S.lastSeen = now();
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    const d = JSON.parse(raw);
    if(!d || !d.breed || !d.stats) return null;
    // 구버전 세이브 보정
    if(!Array.isArray(d.furn) || !d.furn.length) d.furn = defaultFurn();
    if(!Array.isArray(d.toys)) d.toys = defaultToys();
    d.furn = d.furn.filter(f => FURN[f.t] && FURN[f.t].kind !== "toy");
    d.toys = d.toys.filter(o => FURN[o.t] && FURN[o.t].kind === "toy")
                   .map(o => { const gy = clamp(o.gy === undefined ? TOY_GY : o.gy, TOY_MIN, TOY_MAX);
                               return { t:o.t, x:o.x, y:Math.min(o.y, gy), gy:gy, vx:0, vy:0, rot:o.rot||0 }; });
    return d;
  }catch(e){ return null; }
}
// 접속하지 않은 사이 흐른 시간 반영 (최대 12시간)
// 자리를 비운 동안에는 소모 속도를 낮춰서(OFFLINE_MULT) 돌아왔을 때 너무 가혹하지 않게 한다
function applyOffline(){
  const mins = clamp((now() - S.lastSeen) / 60000, 0, 12*60);
  if(mins < 0.2) return;
  const t = breed().trait, m = mins * OFFLINE_MULT;
  S.stats.hunger -= DECAY.hunger * m * t.appetite;
  S.stats.thirst -= DECAY.thirst * m;
  S.stats.happy  -= DECAY.happy  * m;
  S.stats.clean  -= DECAY.clean  * m;
  S.stats.energy = S.lightOff ? S.stats.energy + ENERGY_RECOVER*mins
                              : S.stats.energy - DECAY.energy*m*t.energy;
  S.litter = clamp(S.litter + m*0.25, 0, 100);
  // 밥/물은 자동으로 조금씩 줄어듦
  S.bowlFood = clamp(S.bowlFood - mins/40, 0, 3);
  S.bowlWater = clamp(S.bowlWater - mins/50, 0, 3);
  clampStats();
  if(mins > 20) toast(`${Math.floor(mins/60)>0? Math.floor(mins/60)+"시간 ":""}${Math.round(mins%60)}분 만이에요!`);
}
function clampStats(){
  for(const k in S.stats) S.stats[k] = clamp(S.stats[k], 0, 100);
}
const breed = ()=> BREEDS.find(b=>b.id===S.breed) || BREEDS[0];

/* ---------------------------- 고양이 런타임 객체 ---------------------------- */
function makeCat(){

    jump: null,
    walkPhase: 0, tailPhase: 0,
    blink: 0, blinkTimer: rand(2,5), earTwitch: 0,
    purr: 0, say: null, sayT: 0,
    targetToy: null, batDone: false,
    // --- 잡기 / 던지기 물리 ---
    vy: 0,                         // 공중에 떠 있을 때의 낙하 속도
    sx: 1, sy: 1, sxv: 0, syv: 0,  // 몸이 늘어나고 찌그러지는 정도(스프링)
    rot: 0, rotV: 0,               // 던져졌을 때의 회전
    holdDY: HOLD_DY, heldT: 0,     // 잡은 지점에서 발까지의 거리 / 잡고 있은 시간
    px: 480, py: CAT_Y,            // 직전 프레임 위치 (던지는 속도 계산용)
    landF: null,
    holdX: 480, holdY: CAT_Y-90,   // 손(집은 지점)의 위치
    pin: null,                     // 집은 지점의 격자 좌표 {u,v}
    swing: 0, swingV: 0,           // 매달려 흔들리는 각도
    limp: false, limpT: 0,         // 목덜미를 잡히면 축 늘어지는 상태
    face: 1,                       // 실제로 바라보고 있는 방향 (돌 때 서서히 변한다)
    // --- 걷기 물리 (가감속 · 선회) ---
    spd: 0,                        // 현재 이동 속력 (px/s)
    hdg: 0,                        // 진행 방향 (라디안). 목표 쪽으로 서서히 돌아간다
    turnA: 0,                      // 몸이 돌아간 정도 (0 = 오른쪽, π = 왼쪽)
    turnV: 0,                      // 돌아가는 각속도 (꼬리가 휘는 데 쓴다)
    accX: 0, accY: 0,              // 화면상 가속도 (관성 표현용)
    pauseT: 0, pauseCd: 2.5,       // 걷다가 잠깐 멈칫하는 타이머
    exert: 0,                      // 숨찬 정도 (0~1). 뛰면 오르고 쉬면 내린다
    look: 0, lookT: 0, lookA: 0,   // 두리번거리는 고개 각도
    flick: 0, flickV: 0, flickT: 3,// 꼬리 끝 파르르 (충동적으로 튄다)
    shiftT: 0,                     // 가만히 있을 때 무게중심을 옮기는 주기
  };
}
// 몸을 찌그러뜨린다 (착지 충격 등). horiz=true 면 좌우로 찌그러짐
function squash(a, horiz){
  if(horiz){ cat.sx = 1 - a; cat.sy = 1 + a*0.7; }
  else      { cat.sy = 1 - a; cat.sx = 1 + a*0.75; }
  cat.sxv = 0; cat.syv = 0;
}
// 늘어난 몸이 통통 튀며 원래대로 돌아온다
function springScale(dt){
  const K = 200, D = 14;
  cat.sxv += ((1 - cat.sx)*K - cat.sxv*D)*dt;
  cat.syv += ((1 - cat.sy)*K - cat.syv*D)*dt;
  cat.sx = clamp(cat.sx + cat.sxv*dt, 0.55, 1.7);
  cat.sy = clamp(cat.sy + cat.syv*dt, 0.55, 1.7);
}
function setState(st, dur){
  if(cat.state === "roll" && st !== "roll") cat.rot = 0;   // 뒹굴기에서 빠져나오면 기울기 초기화
  cat.state = st; cat.stateT = 0;
  cat.stateDur = dur !== undefined ? dur : rand(2,5);
}
function stateDuration(st){
  switch(st){
    case "sleep":   return rand(30,66);   // 낮잠도 기력이 눈에 띄게 차도록 길게
    case "perch":   return rand(8,20);
    case "hide":    return rand(8,18);
    case "wheel":   return rand(4,9);
    case "scratch": return rand(3,6);
    case "roll":    return rand(5,9);
    case "watch":   return rand(8,18);
    case "eat":
    case "drink":   return rand(4,7);
    case "litter":  return 3.6;
    default:        return rand(2,5);
  }
}
function say(text, dur=1.6){ cat.say = text; cat.sayT = dur; }
const randDepth = ()=> rand(CAT_Y-6, FLOOR_MAX-14);

/* ---------------------------- 이동 (가속 · 감속 · 선회) ----------------------------
   방을 위에서 내려다보면 세로(깊이)로 1px 가는 것이 가로로 1px 가는 것보다 실제로는
   훨씬 먼 거리다. DEPTH_K 로 그 비율을 보정해서 대각선으로 걸을 때 어색하지 않게 한다. */
const DEPTH_K   = 2.0;
const TURN_RATE = 8.5;                 // 최대 선회 각속도 (rad/s)
const angWrap = a => Math.atan2(Math.sin(a), Math.cos(a));

// 진행 방향에 맞춰 몸을 돌린다. 거의 정면/후면으로 갈 땐 방향을 유지한다
function faceHeading(){
  const c = Math.cos(cat.hdg);
  if(Math.abs(c)*cat.spd > 12) cat.dir = c > 0 ? 1 : -1;
}
// 걸음마다 조금씩 달라지는 속도 (기계적으로 일정하지 않게)
function paceWobble(){
  return 1 + Math.sin(elapsed*1.7)*0.06 + Math.sin(elapsed*2.63 + 1.2)*0.045;
}
/* 목표 지점을 향해 한 프레임 이동한다.
   - 방향은 한 번에 꺾이지 않고 최대 각속도로 서서히 돌아간다 (곡선 궤적)
   - 방향이 어긋나 있거나 목표가 가까우면 속도를 줄인다 (제자리 선회 · 도착 감속)
   반환값: 도착했으면 true */
function moveToward(dt, tx, ty, o){
  o = o || {};
  const top   = o.top || 78;
  const acc   = o.acc || 340, dec = o.dec || 620;
  const brake = o.brake || 70;
  const dx = tx - cat.x, dy = (ty - cat.y)*DEPTH_K;
  const dist = Math.hypot(dx, dy);

  let slow = 1;
  if(dist > 1){
    const diff = angWrap(Math.atan2(dy, dx) - cat.hdg);
    const turn = clamp(diff, -TURN_RATE*dt, TURN_RATE*dt);
    cat.hdg = angWrap(cat.hdg + turn);
    cat.turnV = turn/Math.max(dt, 1e-4);
    // 방향이 크게 어긋나면 거의 제자리에서 몸을 돌린다
    slow = clamp(1 - Math.abs(diff)/1.7, 0.05, 1);
  }else cat.turnV = 0;

  const want = (cat.pauseT > 0 ? 0 : top*slow*clamp(dist/brake, 0.12, 1)*paceWobble());
  const rate = want > cat.spd ? acc : dec;
  cat.spd = clamp(cat.spd + clamp(want - cat.spd, -rate*dt, rate*dt), 0, top*1.2);

  const mv = cat.spd*dt;
  cat.x = clamp(cat.x + Math.cos(cat.hdg)*mv, X_MIN, X_MAX);
  cat.y = clamp(cat.y + Math.sin(cat.hdg)*mv/DEPTH_K, CAT_Y-10, FLOOR_MAX-8);
  cat.gy = cat.y;
  cat.walkPhase += dt*(4 + cat.spd*0.055);
  advanceGait(mv);
  faceHeading();
  return dist < 6;
}
// 멈춰 있는 상태 — 남은 속도를 미끄러지듯 흘려보낸다
function coast(dt){
  if(cat.spd < 0.5){ cat.spd = 0; return; }
  cat.spd = Math.max(0, cat.spd - 900*dt);
  const mv = cat.spd*dt;
  cat.x = clamp(cat.x + Math.cos(cat.hdg)*mv, X_MIN, X_MAX);
  cat.y = clamp(cat.y + Math.sin(cat.hdg)*mv/DEPTH_K, CAT_Y-10, FLOOR_MAX-8);
  cat.gy = cat.y;
  advanceGait(mv);
}
/* 숨쉬기 곡선 (0~1) — 들이쉴 땐 빠르고 내쉴 땐 느리다 */
function breathe(t, rate){
  const p = (t*rate) % 1;
  return p < 0.38 ? 0.5 - 0.5*Math.cos(Math.PI*p/0.38)
                  : 0.5 + 0.5*Math.cos(Math.PI*(p - 0.38)/0.62);
}

// 목표 지점으로 걸어간다. after 는 도착 후 전환할 상태("__use" 면 가구 사용)
function goTo(x, y, after){
  cat.tx = clamp(x, X_MIN, X_MAX);
  cat.ty = clamp(y, CAT_Y-8, FLOOR_MAX-8);
  cat.after = after || null;
  setState(Math.random() < 0.22 ? "run" : "walk", 40);
}
// 포물선 점프. opt.down 이면 바닥으로 내려오는 점프
function jumpTo(x, y, after, gy, opt){
  const x1 = clamp(x, X_MIN, X_MAX);
  const dx = x1 - cat.x, dy = y - cat.y;
  cat.jump = {
    x0: cat.x, y0: cat.y, x1: x1, y1: y, t: 0,
    dur: clamp(Math.hypot(dx, dy)/300, 0.36, 0.95),
    arc: 46 + Math.max(0, -dy)*0.32,
    gy: gy !== undefined ? gy : cat.gy,
    down: !!(opt && opt.down),
    // 뛰기 직전에 몸을 웅크리는 시간 (예비동작). 위로 뛸 땐 더 길게 준다
    pre: (opt && opt.down) ? 0.12 : 0.22,
  };
  cat.spd = 0;
  if(Math.abs(dx) > 8){ cat.dir = dx > 0 ? 1 : -1; cat.hdg = dx > 0 ? 0 : Math.PI; }
  cat.after = after || null;
  setState("jump", 9);
}
// 올라가 있던 곳에서 바닥으로 내려온다
function hopDown(){
  const tx = clamp(cat.x + cat.dir*rand(36,60), X_MIN, X_MAX);
  cat.useF = null; cat.useRole = null; cat.pending = null; cat.behind = false;
  jumpTo(tx, CAT_Y, null, CAT_Y, { down:true });
}
// 가구를 쓰러 간다
function useFurniture(f, role){
  if(!f){ setState("sit", rand(2,4)); return; }
  const s = furnSpot(f, role);
  cat.useF = f; cat.useRole = role;
  cat.pending = { spot:s, st:(ROLE_STATE[role] || "sit"), jump:!!s.jump, behind:!!s.behind };
  // 뛰어올라야 하는 자리는 일단 가구 앞 바닥까지 걸어간다
  const standX = s.jump ? f.x - (f.t === "tower" ? 66 : 52) : s.x;
  const standY = s.jump ? clamp(f.y - 2, CAT_Y-8, FLOOR_MAX-8) : s.y;
  goTo(standX, standY, "__use");
}
function arriveAtFurniture(){
  const p = cat.pending;
  if(!p){ decideNext(); return; }
  if(p.jump){
    const f = cat.useF;
    const gy = FURN[f.t].kind === "wall" ? FLOOR_MIN - 4 : f.y;
    jumpTo(p.spot.x, p.spot.y, p.st, gy, { down:false });
  }else{
    cat.gy = cat.y;
    setState(p.st, stateDuration(p.st));
  }
}
// 지금 가지고 놀 만한 장난감
function findPlayToy(){
  if(!S.toys || !S.toys.length) return null;
  let best = null, bd = 1e9;
  for(const o of S.toys){
    if(o.held) continue;
    const speed = Math.hypot(o.vx, o.vy);
    const d = Math.abs(o.x - cat.x);
    const range = speed > 40 ? 900 : 250;   // 굴러가는 중이면 멀리서도 반응
    if(d < range && d < bd){ bd = d; best = o; }
  }
  return best;
}

/* ---------------------------- 잡기 / 던지기 ---------------------------- */
// 마우스로 고양이를 집어 든다
function activateCatGrab(){
  drag.active = true;
  cat.holdDY = clamp(cat.y - pointerRaw.y, 24, 150);
  cat.heldT = 0;
  cat.holdX = pointerRaw.x; cat.holdY = pointerRaw.y;
  cat.swing = 0; cat.swingV = 0;
  // 어느 지점을 집었는지 격자에서 찾는다 (목덜미를 잡으면 얌전히, 꼬리를 잡으면 거꾸로 매달린다)
  cat.pin = useSprite() ? pickGrabPart(pointerRaw.x, pointerRaw.y) : null;
  cat.px = cat.holdX; cat.py = cat.holdY;
  cat.vx = 0; cat.vy = 0; cat.rot = 0; cat.rotV = 0;
  cat.perched = false; cat.behind = false;
  cat.useF = null; cat.useRole = null; cat.pending = null; cat.after = null;
  cat.targetToy = null; cat.jump = null;
  setState("held", 999);
  stage.classList.add("grabbing");
  squash(0.16);
  say(pick(["냐앙?","응?","냥!"]), 1.2);
  if(Math.random() < 0.7) catVoice("surprise", rand(1.05,1.2));
}
// 손을 놓는다. 속도가 붙어 있으면 그대로 날아간다
function releaseCat(){
  stage.classList.remove("grabbing");
  const sp = Math.hypot(cat.vx, cat.vy);
  cat.heldT = 0;
  cat.pin = null;
  // 놓은 자리와 던진 방향으로 착지할 앞뒤 자리를 정한다
  cat.gy = throwLanding(cat.y, cat.vy, cat.gy, CAT_Y-10, FLOOR_MAX-8);
  if(cat.y >= cat.gy - 8 && sp < 130){        // 바닥에 살며시 내려놓기
    cat.y = cat.gy; cat.vx = 0; cat.vy = 0; cat.rot = 0;
    squash(0.14); setState("land", 0.4);
    return;
  }
  cat.vx = clamp(cat.vx, -1100, 1100);
  cat.vy = clamp(cat.vy, -1250, 1250);
  cat.rotV = clamp(cat.vx/230, -7, 7);
  setState("fall", 30);
  if(sp > 520){
    say(pick(["냐아아!","우와앗!","꺄악!"]), 1.2);
    if(Math.random() < 0.7) catVoice("scared", rand(1.05,1.2));
    S.stats.happy = clamp(S.stats.happy - 2, 0, 100);
  }
}
// 지금 위치에서 떨어지면 어디에 착지하는지 (가구 위에 올라탈 수 있다)
// fromY = 이번 프레임에 내려오기 시작한 높이. 한 프레임에 표면을 지나쳐 버려도 놓치지 않는다
function landingY(fromY){
  const topY = fromY !== undefined ? fromY : cat.y;
  let best = cat.gy;
  cat.landF = null; cat.landRole = null; cat.landSpot = null;
  for(const f of S.furn){
    const D = FURN[f.t];
    if(!D || D.kind !== "floor" || D.deco) continue;
    const roles = D.roles || [];
    // 올라타거나 들어갈 수 있는 가구만 (역할별 실제 자리 높이를 그대로 쓴다)
    const role = roles.indexOf("hide")  >= 0 ? "hide"
               : roles.indexOf("perch") >= 0 ? "perch"
               : roles.indexOf("sleep") >= 0 ? "sleep" : null;
    if(!role) continue;
    if(Math.abs(f.y - cat.gy) > 52) continue;
    const b = furnBox(f);
    if(cat.x < b.x + 10 || cat.x > b.x + b.w - 10) continue;
    const sp = furnSpot(f, role);
    if(sp.y < best && sp.y >= topY - 2){
      best = sp.y; cat.landF = f; cat.landRole = role; cat.landSpot = sp;
    }
  }
  return best;
}
// 착지 처리 (충격이 크면 한 번 더 튄다)
function landCat(ground){
  const impact = Math.abs(cat.vy);
  cat.y = ground; cat.rot = 0; cat.rotV = 0;
  const f = cat.landF;
  if(f){                                   // 가구 위(또는 안)에 착지
    cat.useF = f; cat.perched = true; cat.gy = f.y;
    cat.useRole = cat.landRole;
    cat.behind = cat.useRole === "hide";
    if(cat.landSpot) cat.x = lerp(cat.x, cat.landSpot.x, 0.6);   // 자리에 맞춰 살짝 정렬
  }
  spawnFx(cat.x + rand(-14,14), cat.y-4, "dust");
  sfxThud(clamp(impact/900, 0.12, 1));        // 발이 바닥에 닿는 소리
  if(impact > 240) spawnFx(cat.x + rand(-22,22), cat.y-6, "dust");
  squash(clamp(impact/1100, 0.08, 0.42));
  if(impact > 430 && !f){                  // 바닥에서 한 번 더 튀어오름
    cat.vy = -impact*0.34;
    cat.vx *= 0.62;
    setState("fall", 30);
    return;
  }
  cat.vy = 0; cat.vx *= 0.5;
  if(impact > 700){
    S.stats.happy = clamp(S.stats.happy - 3, 0, 100);
    if(Math.random() < 0.6) say(pick(["냐악!","!!","...냥"]), 1.2);
  }
  setState("land", 0.7);
}

/* ---------------------------- 고양이 AI ---------------------------- */
function weighted(opts){
  let sum = 0;
  for(const o of opts) sum += o[1];
  let r = Math.random()*sum;
  for(const o of opts){ r -= o[1]; if(r <= 0) return o[0]; }
  return opts[0][0];
}
function decideNext(){
  const st = S.stats, tr = breed().trait;
  cat.pending = null;

  // 올라가 있거나 숨어 있으면 먼저 내려온다
  if(cat.perched){ hopDown(); return; }
  cat.useF = null; cat.useRole = null;

  // 1) 졸리면 잠자리로
  if(st.energy < 22 || (S.lightOff && st.energy < 92)){
    const f = nearestFurn("sleep");
    if(f) return useFurniture(f, "sleep");
    setState("sleep", rand(20,45)); return;
  }
  // 2) 배고픔 / 목마름
  if(st.hunger < 55 && S.bowlFood > 0.05){
    const f = nearestFurn("food");
    if(f) return useFurniture(f, "food");
  }
  if(st.thirst < 55 && S.bowlWater > 0.05){
    const f = nearestFurn("water");
    if(f) return useFurniture(f, "water");
  }
  // 3) 먹을 게 없으면 조른다
  if((st.hunger < 30 && S.bowlFood <= 0.05) || (st.thirst < 30 && S.bowlWater <= 0.05)){
    say(pick(["야옹...","밥 주세요","냐앙~"]), 2);
    if(Math.random() < 0.8) catVoice("beg", rand(0.95,1.1));
    setState("sit", rand(2,4)); return;
  }
  // 4) 화장실
  if(Math.random() < 0.08 && S.litter < 85){
    const f = nearestFurn("litter");
    if(f) return useFurniture(f, "litter");
  }
  // 5) 굴러다니는 장난감
  const toy = findPlayToy();
  if(toy && Math.random() < 0.55){
    cat.targetToy = toy; setState("chase", 8); return;
  }

  // 6) 성격과 놓여 있는 가구에 따른 랜덤 행동
  const opts = [["wander",30], ["dash",14*tr.energy], ["sit",16], ["groom",14]];
  if(st.energy < 55) opts.push(["nap",14]);
  if(furnWithRole("scratch").length) opts.push(["scratch",16]);
  if(furnWithRole("perch").length)   opts.push(["perch",16*tr.energy]);
  if(furnWithRole("hide").length)    opts.push(["hide",14]);
  if(furnWithRole("run").length && st.energy > 35) opts.push(["wheel",14*tr.energy]);
  if(furnWithRole("catnip").length) opts.push(["catnip", 18*tr.social]);
  if(furnWithRole("watch").length)  opts.push(["watch", 18]);

  switch(weighted(opts)){
    case "wander": goTo(rand(X_MIN,X_MAX), randDepth(), null); break;
    case "dash":
      cat.tx = clamp(rand(X_MIN,X_MAX), X_MIN, X_MAX);
      cat.ty = randDepth(); cat.after = null; setState("run", 40); break;
    case "sit":   setState("sit", rand(3,7)); break;
    case "groom": setState("groom", rand(4,8)); S.stats.clean = clamp(st.clean+4,0,100); break;
    case "nap": {
      const f = nearestFurn("sleep");
      if(f) useFurniture(f, "sleep"); else setState("sleep", rand(10,25));
      break;
    }
    case "scratch": useFurniture(nearestFurn("scratch"), "scratch"); break;
    case "perch":   useFurniture(nearestFurn("perch"),   "perch");   break;
    case "hide":    useFurniture(nearestFurn("hide"),    "hide");    break;
    case "wheel":   useFurniture(nearestFurn("run"),     "run");     break;
    case "catnip":  useFurniture(nearestFurn("catnip"),  "catnip");  break;
    case "watch":   useFurniture(nearestFurn("watch"),   "watch");   break;
    default: setState("idle", rand(2,4));
  }
}

/* 상태가 이어지는 동안 일정 간격으로 반복되는 소리 (씹기·핥기·긁기) */
function rhythmSfx(dt, gap, fn){
  cat.sfxT = (cat.sfxT || 0) - dt;
  if(cat.sfxT > 0) return;
  cat.sfxT = gap*(0.75 + Math.random()*0.5);        // 간격을 흔들어 기계적이지 않게
  fn();
}

/* 가끔 혼잣말처럼 우는 소리 - 지금 상태와 컨디션에 따라 종류가 달라진다 */
let voiceT = rand(8, 16);
function ambientVoice(dt){
  voiceT -= dt;
  if(voiceT > 0) return;
  voiceT = rand(9, 20);
  if(cat.state === "held") return;               // 들려 있을 땐 따로 반응한다
  const st = S.stats;
  if(cat.state === "sleep"){ if(Math.random() < 0.6) sfxPurr(rand(1.4,2.2)); return; }
  if(cat.state === "chase" || cat.state === "bat" || cat.state === "play"){ catVoice("hunt", rand(1,1.15)); return; }
  if(st.hunger < 35 || st.thirst < 35) return catVoice("beg", rand(0.95,1.05));
  if(st.happy < 30)  return catVoice("angry", rand(1,1.1));
  if(st.happy > 72)  return catVoice(Math.random() < 0.5 ? "happy" : "greet", rand(1,1.1));
  catVoice("call", rand(0.95,1.1));
}

// 스스로 걸어 움직이는 상태들
const LOCO = { walk:1, run:1, chase:1, fall:1, held:1, land:1, jump:1, wheel:1 };

/* 프레임마다 갱신되는 자잘한 생명감 — 시선 · 꼬리 끝 · 호흡 · 멈칫거림 */
function updateLife(dt){
  const moving = cat.spd > 20;
  // 두리번거리기: 가끔 새로운 곳을 본다 (움직일 땐 진행 방향을 본다)
  cat.lookT -= dt;
  if(cat.lookT <= 0){
    cat.lookT = moving ? rand(0.8, 2.0) : rand(1.2, 4.0);
    cat.look = moving ? rand(-0.05, 0.05) : rand(-0.20, 0.22);
    if(!moving && Math.random() < 0.25) cat.earTwitch = 0.35;
  }
  cat.lookA += (cat.look - cat.lookA)*clamp(4.5*dt, 0, 1);

  // 꼬리 끝 파르르 — 기분이 나쁘거나 사냥 중일 때 잦다
  cat.flickT -= dt;
  if(cat.flickT <= 0){
    const hunt = cat.state === "chase" || cat.state === "bat" || cat.state === "play";
    cat.flickT = hunt ? rand(0.5,1.4) : (S.stats.happy < 40 ? rand(1.2,3) : rand(3,8));
    if(cat.state !== "sleep") cat.flickV += rand(4, 9)*(Math.random() < 0.5 ? -1 : 1);
  }
  cat.flickV += (-cat.flick*260 - cat.flickV*11)*dt;      // 감쇠 진동
  cat.flick  = clamp(cat.flick + cat.flickV*dt, -0.5, 0.5);

  // 숨찬 정도 — 뛰면 오르고 쉬면 천천히 내린다
  const hard = (cat.state === "run" || cat.state === "chase" || cat.state === "wheel" ? 1 : 0)
             + (cat.state === "play" || cat.state === "bat" ? 0.6 : 0);
  cat.exert = clamp(cat.exert + (hard ? 0.55*hard : -0.16)*dt, 0, 1);

  // 이동하지 않는 상태에선 속력과 선회를 서서히 0 으로 되돌린다
  if(!LOCO[cat.state]){
    cat.spd = Math.max(0, cat.spd - 900*dt);
    cat.turnV *= Math.pow(0.02, dt);
  }

  // 걷다가 문득 멈춰 서서 주변을 살핀다
  if(cat.pauseT > 0) cat.pauseT -= dt;
  else if(cat.state === "walk"){
    cat.pauseCd -= dt;
    if(cat.pauseCd <= 0){
      cat.pauseCd = rand(3.5, 9);
      if(Math.random() < 0.55){ cat.pauseT = rand(0.35, 1.1); cat.lookT = 0; }
    }
  }
}

function updateCat(dt){
  cat.stateT += dt;
  cat.tailPhase += dt * (cat.state === "sleep" ? 0.6 : 2.2);
  if(cat.sayT > 0) cat.sayT -= dt;
  if(cat.purr > 0) cat.purr -= dt;
  ambientVoice(dt);
  updateLife(dt);

  // 몸이 받는 가속도 (꼬리·머리가 관성으로 늦게 따라오는 데 쓴다)
  const idt = 1/Math.max(dt, 1e-4);
  const nvx = (cat.x - (cat.lastX === undefined ? cat.x : cat.lastX))*idt;
  const nvy = (cat.y - (cat.lastY === undefined ? cat.y : cat.lastY))*idt;
  const ia = clamp(10*dt, 0, 1);
  cat.accX += (clamp((nvx - (cat.mvx||0))*idt, -4000, 4000) - cat.accX)*ia;
  cat.accY += (clamp((nvy - (cat.mvy||0))*idt, -4000, 4000) - cat.accY)*ia;
  cat.mvx = nvx; cat.mvy = nvy;
  cat.lastX = cat.x; cat.lastY = cat.y;

  // 눈 깜빡임 / 귀 씰룩
  cat.blinkTimer -= dt;
  if(cat.blinkTimer <= 0){ cat.blink = 0.16; cat.blinkTimer = rand(2.5,6); }
  if(cat.blink > 0) cat.blink -= dt;
  cat.earTwitch = Math.max(0, cat.earTwitch - dt);
  if(Math.random() < dt*0.25) cat.earTwitch = 0.35;

  // 누르고 잠깐 기다리기만 해도 집어 올려진다
  if(drag && drag.cat && !drag.active && elapsed - drag.t0 > 0.22) activateCatGrab();

  springScale(dt);   // 늘어난 몸이 원래대로 돌아오는 스프링

  // --- 손에 잡혀 있는 동안 ---
  if(cat.state === "held"){
    if(!drag || !drag.cat){ releaseCat(); return; }   // 포인터를 놓친 경우 안전장치
    cat.holdDY = lerp(cat.holdDY, HOLD_DY, clamp(9*dt, 0, 1));
    // 손(집은 지점)이 포인터를 조금 늦게 따라가서 흔들리는 느낌을 준다
    const hx = clamp(pointerRaw.x, X_MIN, X_MAX);
    const hy = clamp(pointerRaw.y, 50, FLOOR_MAX - 20);
    const k = clamp(24*dt, 0, 1);
    const prevHX = cat.holdX;
    cat.holdX = lerp(cat.holdX, hx, k);
    cat.holdY = lerp(cat.holdY, hy, k);

    // 던지는 속도 = 손의 속도
    const inv = 1/Math.max(dt, 0.008);
    cat.vx = clamp((cat.holdX - cat.px)*inv, -1600, 1600);
    cat.vy = clamp((cat.holdY - cat.py)*inv, -1600, 1600);
    cat.px = cat.holdX; cat.py = cat.holdY;

    // 매달린 몸이 손을 따라 흔들린다 (진자)
    const targetSwing = clamp(-cat.vx/1100, -0.7, 0.7);
    cat.swingV += (targetSwing - cat.swing)*52*dt - cat.swingV*7*dt;
    cat.swing = clamp(cat.swing + cat.swingV*dt, -1.1, 1.1);

    // 몸통 위치 갱신 (스프라이트는 매달린 자세에서 발 위치를 역산)
    if(useSprite() && rigReady && rig.root){
      const f = Mapply(rig.root, 0, 0);
      cat.x = f[0]; cat.y = f[1];
    }else{
      cat.x = cat.holdX; cat.y = cat.holdY + cat.holdDY;
    }
    // 바닥 가까이에서 천천히 끌면 앞뒤 자리가 따라온다 (들어 올리는 중엔 유지)
    if(cat.y >= CAT_Y-10 && Math.hypot(cat.vx, cat.vy) < 400) cat.gy = clamp(cat.y, CAT_Y-10, FLOOR_MAX-8);
    if(Math.abs(cat.holdX - prevHX) > 0.6) cat.dir = cat.holdX > prevHX ? 1 : -1;

    // 빠르게 휘두르면 몸이 쭉 늘어난다
    const sp = Math.hypot(cat.vx, cat.vy);
    const st = clamp(sp/1500, 0, 0.34);
    cat.sy = lerp(cat.sy, 1 + st, 0.4);
    cat.sx = lerp(cat.sx, 1 - st*0.62, 0.4);
    cat.walkPhase += dt*6;

    cat.heldT += dt;

    // 목덜미를 살살 잡고 가만히 있으면 새끼고양이처럼 축 늘어진다
    const scruff = !!(cat.pin && cat.pin.v <= 0.32 && cat.pin.u > 0.26 && cat.pin.u < 0.88);
    cat.limpT = (scruff && sp < 90) ? cat.limpT + dt : Math.max(0, cat.limpT - dt*2.5);
    cat.limp = cat.limpT > 1.2;

    if(cat.limp){                           // 얌전히 매달려 있는 상태
      S.stats.happy = clamp(S.stats.happy + 0.5*dt, 0, 100);
      cat.purr = Math.max(cat.purr, 0.5);
      if(Math.random() < dt*0.25){
        say(pick(["...", "골골", "냐아"]), 1.3);
        if(Math.random() < 0.5) catVoice("happy", rand(0.95,1.05));
      }
    }else if(cat.heldT > 3){                // 오래 들고 있으면 싫어한다
      S.stats.happy = clamp(S.stats.happy - 2.6*dt, 0, 100);
      if(Math.random() < dt*0.6){
        say(pick(["냐아앙!","내려줘!","캬악!"]), 1.2);
        if(Math.random() < 0.6) catVoice("angry", rand(1.05,1.2));
      }
    }else if(Math.random() < dt*0.3) say(pick(["냥?","...냐"]), 1.0);
    return;
  }

  // --- 공중에 떠 있는 동안 (던져짐 / 떨어짐) ---
  if(cat.state === "fall"){
    const y0 = cat.y;                 // 이번 프레임 시작 높이 (표면 통과 판정용)
    cat.vy += GRAVITY*0.8*dt;
    cat.x += cat.vx*dt;
    cat.y += cat.vy*dt;
    // 벽에서 튕김
    if(cat.x <= X_MIN && cat.vx < 0){ cat.x = X_MIN; cat.vx = -cat.vx*0.52; squash(0.2, true); sfxThud(0.45); }
    if(cat.x >= X_MAX && cat.vx > 0){ cat.x = X_MAX; cat.vx = -cat.vx*0.52; squash(0.2, true); sfxThud(0.45); }
    // 천장
    if(cat.y < 70 && cat.vy < 0){ cat.y = 70; cat.vy = -cat.vy*0.4; squash(0.18); }

    const ground = landingY(y0);
    cat.rot += cat.rotV*dt;
    if(ground - cat.y < 140){          // 착지 직전엔 자세를 바로잡는다 (고양이는 발로 착지)
      cat.rotV *= Math.pow(0.015, dt);
      cat.rot = lerp(cat.rot, 0, clamp(9*dt, 0, 1));
    }
    // 떨어지는 동안 살짝 길쭉해진다
    const stretch = clamp(Math.abs(cat.vy)/2400, 0, 0.2);
    cat.sy = lerp(cat.sy, 1 + stretch, 0.25);
    cat.sx = lerp(cat.sx, 1 - stretch*0.7, 0.25);
    if(Math.random() < dt*3) spawnFx(cat.x + rand(-18,18), cat.y - 40, "spark");

    if(cat.y >= ground) landCat(ground);
    return;
  }

  // --- 낚싯대 모드: 포인터 쫓아가기 ---
  if(playMode && pointer.active && cat.state !== "sleep" && !cat.perched && cat.state !== "jump"){
    const dx = lure.x - cat.x;                 // 커서가 아니라 실제로 흔들리는 깃털을 쫓는다
    const dist = Math.abs(dx);
    if(dist > 40){
      if(cat.state !== "run"){ cat.state = "run"; cat.stateT = 0; }
      moveToward(dt, lure.x, cat.y, { top:lerp(120, 235, clamp(dist/400, 0, 1)),
                                         acc:600, dec:700, brake:56 });
      cat.vx = Math.cos(cat.hdg)*cat.spd;
      return;
    }else{
      cat.spd = Math.max(0, cat.spd - 900*dt);
      cat.vx = 0;
      if(cat.state !== "play"){ cat.state = "play"; cat.stateT = 0; }
      S.stats.happy  = clamp(S.stats.happy + 9*dt, 0, 100);
      S.stats.energy = clamp(S.stats.energy - 2.0*dt, 0, 100);
      if(Math.random() < dt*2.2) spawnFx(cat.x + rand(-20,20), cat.y-70, "spark");
      if(Math.random() < dt*0.35){ say(pick(["냥!","캬웅!","!"]), 0.9); catVoice("hunt", rand(1.0,1.15)); }
    }
    cat.x = clamp(cat.x + cat.vx*dt, X_MIN, X_MAX);
    cat.gy = cat.y;
    return;
  }

  switch(cat.state){
    case "walk":
    case "run": {
      const fast = cat.state === "run";
      const arrived = moveToward(dt, cat.tx, cat.ty, {
        top:   fast ? 196 : 76,
        acc:   fast ? 420 : 230,             // 뛸 땐 힘차게, 걸을 땐 슬금슬금 붙는다
        dec:   fast ? 520 : 340,
        brake: fast ? 130 : 64,              // 목표 앞에서 미리 속도를 줄인다
      });
      cat.vx = Math.cos(cat.hdg)*cat.spd;
      if(arrived || cat.stateT > 16){
        cat.vx = 0;
        const nx = cat.after; cat.after = null;
        if(nx === "__use") arriveAtFurniture();
        else if(nx) setState(nx, stateDuration(nx));
        else decideNext();
      }
      break;
    }
    case "jump": {
      const j = cat.jump;
      if(!j){ decideNext(); break; }
      j.t += dt;
      if(j.t < j.pre) break;                          // 예비동작(웅크리기) 동안은 제자리
      const k = clamp((j.t - j.pre)/j.dur, 0, 1);
      cat.x = lerp(j.x0, j.x1, k);
      cat.y = lerp(j.y0, j.y1, k) - 4*k*(1-k)*j.arc;  // 포물선 (중력이 일정한 궤적)
      if(k >= 1){
        cat.x = j.x1; cat.y = j.y1; cat.gy = j.gy;
        cat.perched = !j.down;
        cat.behind = !j.down && !!(cat.pending && cat.pending.behind);
        const nx = cat.after; cat.after = null; cat.jump = null;
        if(j.down) spawnFx(cat.x, cat.y-4, "dust");
        if(nx) setState(nx, stateDuration(nx)); else decideNext();
      }
      break;
    }
    case "land": {   // 착지 직후 — 미끄러지다가 자세를 추스른다
      cat.x = clamp(cat.x + cat.vx*dt, X_MIN, X_MAX);
      cat.vx *= Math.pow(0.02, dt);
      cat.spd = Math.abs(cat.vx);
      if(cat.stateT > cat.stateDur){
        if(cat.useF && cat.perched){
          const st = ROLE_STATE[cat.useRole] || "sit";
          setState(st, stateDuration(st));
        }else if(Math.random() < 0.5){
          setState("groom", rand(1.5,3));       // 몸을 한 번 고르고
        }else decideNext();
      }
      break;
    }
    case "eat": {
      cat.dir = 1;
      const eat = Math.min(S.bowlFood, 0.42*dt);
      S.bowlFood -= eat;
      S.stats.hunger = clamp(S.stats.hunger + eat*95, 0, 100);
      if(cat.useF && Math.random() < dt*1.5) spawnFx(cat.useF.x + rand(-14,14), cat.useF.y-18, "crumb");
      rhythmSfx(dt, 0.2, sfxCrunch);                 // 아작아작
      if(S.bowlFood <= 0.02 || S.stats.hunger >= 99 || cat.stateT > cat.stateDur) decideNext();
      break;
    }
    case "drink": {
      cat.dir = 1;
      const dr = Math.min(S.bowlWater, 0.4*dt);
      S.bowlWater -= dr;
      S.stats.thirst = clamp(S.stats.thirst + dr*105, 0, 100);
      if(cat.useF && Math.random() < dt*2) spawnFx(cat.useF.x + rand(-10,10), cat.useF.y-16, "drop");
      rhythmSfx(dt, 0.22, sfxLap);                   // 촵촵
      if(S.bowlWater <= 0.02 || S.stats.thirst >= 99 || cat.stateT > cat.stateDur) decideNext();
      break;
    }
    case "sleep": {
      S.stats.energy = clamp(S.stats.energy + ENERGY_RECOVER/60*dt, 0, 100);
      if(Math.random() < dt*0.5) spawnFx(cat.x + 26*cat.dir, cat.y-42, "zzz");
      if((S.stats.energy >= 99 && !S.lightOff) || cat.stateT > cat.stateDur){
        if(!S.lightOff) setState("sit", 2);
        else cat.stateT = 0;
      }
      break;
    }
    case "litter": {
      cat.dir = -1;
      rhythmSfx(dt, 0.3, sfxLitterDig);              // 모래 파는 소리
      if(cat.stateT > 3.2){
        S.litter = clamp(S.litter + 12, 0, 100);
        S.stats.clean = clamp(S.stats.clean - 3, 0, 100);
        if(cat.useF) spawnFx(cat.useF.x, cat.useF.y-26, "dust");
        decideNext();
      }
      break;
    }
    case "groom": {
      if(Math.random() < dt*0.8) spawnFx(cat.x + rand(-14,14), cat.y-58, "spark");
      rhythmSfx(dt, 0.55, sfxLick);                  // 핥는 소리
      if(cat.stateT > cat.stateDur) decideNext();
      break;
    }
    case "scratch": {
      if(Math.random() < dt*7) spawnFx(cat.x + 24*cat.dir + rand(-6,6), cat.y - rand(24,74), "crumb");
      S.stats.clean = clamp(S.stats.clean + 2.2*dt, 0, 100);
      S.stats.happy = clamp(S.stats.happy + 2.6*dt, 0, 100);
      rhythmSfx(dt, 0.42, sfxScratch);               // 드드득 긁는 리듬
      if(cat.stateT > cat.stateDur) decideNext();
      break;
    }
    case "hide": {
      S.stats.happy  = clamp(S.stats.happy  + 1.2*dt, 0, 100);
      S.stats.energy = clamp(S.stats.energy + 1.1*dt, 0, 100);   // 상자·터널 안에서 쉬는 셈
      if(Math.random() < dt*0.15) say(pick(["...","냥?","여기 좋다"]), 1.4);
      if(cat.stateT > cat.stateDur) decideNext();
      break;
    }
    case "wheel": {
      cat.walkPhase += dt*15;
      cat.spd = lerp(cat.spd, 200, clamp(2.2*dt, 0, 1));   // 서서히 속도를 올린다
      advanceGait(cat.spd*dt);
      if(cat.useF) cat.useF.spin = (cat.useF.spin || 0) + dt*7;
      S.stats.energy = clamp(S.stats.energy - 4.5*dt, 0, 100);
      S.stats.happy  = clamp(S.stats.happy  + 3.4*dt, 0, 100);
      if(Math.random() < dt*0.5) spawnFx(cat.x + rand(-30,30), cat.y-60, "spark");
      if(S.stats.energy < 12 || cat.stateT > cat.stateDur) decideNext();
      break;
    }
    case "roll": {
      // 캣닢에 취해 뒹군다
      cat.rot = Math.sin(cat.stateT*7.5)*0.34;
      S.stats.happy = clamp(S.stats.happy + 7.5*dt, 0, 100);
      if(Math.random() < dt*1.6) spawnFx(cat.x + rand(-24,24), cat.y-46, "heart");
      if(Math.random() < dt*0.5) say(pick(["냐하항","골골골...","헤헹","(뒹굴뒹굴)"]), 1.4);
      if(Math.random() < dt*0.35) sfxPurr(rand(1.0,1.6));
      if(cat.stateT > cat.stateDur){ cat.rot = 0; decideNext(); }
      break;
    }
    case "watch": {
      // 어항 앞에 앉아 물고기를 구경한다 (가끔 캭캭거린다)
      S.stats.happy = clamp(S.stats.happy + 2.4*dt, 0, 100);
      if(Math.random() < dt*0.35) say(pick(["캭캭캭","냥...","(꼬리 살랑)","저거 뭐지"]), 1.5);
      if(Math.random() < dt*0.25) catVoice("hunt", rand(1.05,1.25));   // 캭캭거리는 사냥 본능
      if(Math.random() < dt*0.6) spawnFx(cat.x + rand(-10,10), cat.y-56, "spark");
      if(cat.stateT > cat.stateDur) decideNext();
      break;
    }
    case "perch": {
      // 높은 곳에서 방 구경. 가끔 그대로 존다
      if(Math.random() < dt*0.06){ setState("sleep", rand(10,25)); break; }
      if(cat.stateT > cat.stateDur) decideNext();
      break;
    }
    case "chase": {
      const o = cat.targetToy;
      if(!o || o.held || S.toys.indexOf(o) < 0){ decideNext(); break; }
      const dx = o.x - cat.x, dy = toyGY(o) - cat.y;
      if(Math.abs(dx) < 34 && Math.abs(dy) < 26 && cat.spd < 180){
        cat.batDone = false; setState("bat", 0.5);
      }else{
        // 굴러가는 장난감을 앞질러 가로챈다 (조금 앞을 노린다)
        const lead = clamp((o.vx || 0)*0.28, -90, 90);
        moveToward(dt, o.x + lead, toyGY(o), { top:205, acc:520, dec:640, brake:52 });
        if(cat.stateT > 8) decideNext();
      }
      break;
    }
    case "bat": {
      if(!cat.batDone && cat.stateT > 0.18){
        cat.batDone = true;
        const o = cat.targetToy;
        if(o){
          o.vx += cat.dir * rand(220, 460);
          o.vy -= rand(120, 300);
          o.gy = clamp(toyGY(o) + rand(-38, 38), TOY_MIN, TOY_MAX);   // 앞뒤로도 조금 튄다
          o.rotV = (o.rotV || 0) + cat.dir*rand(6,14);
          spawnFx(o.x, o.y-14, "spark"); spawnFx(o.x + rand(-8,8), o.y-22, "spark");
          sfxToyHit();
        }
        S.stats.happy  = clamp(S.stats.happy + 4, 0, 100);
        S.stats.energy = clamp(S.stats.energy - 0.5, 0, 100);
        if(Math.random() < 0.35){ say(pick(["냥!","캬웅!"]), 0.9); catVoice("hunt", rand(1.0,1.2)); }
      }
      if(cat.stateT > cat.stateDur){
        if(cat.targetToy && Math.random() < 0.6) setState("chase", 8);
        else decideNext();
      }
      break;
    }
    default: { // idle, sit, play
      cat.vx = 0;
      coast(dt);                                     // 남은 속도를 부드럽게 흘려보낸다
      if(cat.stateT > cat.stateDur) decideNext();
    }
  }
}

/* ---------------------------- 장난감 물리 ---------------------------- */
let lastBounceT = -9;
function sfxBounce(){
  if(elapsed - lastBounceT < 0.12) return;
  lastBounceT = elapsed;
  sfxToyBounce();
}
function updateToys(dt){
  if(!S.toys) return;
  for(const o of S.toys){
    const D = FURN[o.t], r = D.r;

    // 손에 쥐고 있는 동안은 중력 대신 이동 속도를 기록해 둔다 (놓으면 그대로 던져짐)
    if(o.held){
      const inv = 1/Math.max(dt, 0.008);
      if(o.px !== undefined){
        o.vx = clamp((o.x - o.px)*inv, -1600, 1600);
        o.vy = clamp((o.y - o.py)*inv, -1600, 1600);
      }
      o.px = o.x; o.py = o.y;
      o.rot = (o.rot || 0) + o.vx*dt*0.02;
      continue;
    }

    o.vy += GRAVITY*dt;
    o.x += o.vx*dt;
    o.y += o.vy*dt;
    o.rot = (o.rot || 0) + (o.rotV || 0)*dt;

    // 바닥 반사
    const gy = toyGY(o);
    if(o.y > gy){
      o.y = gy;
      if(Math.abs(o.vy) > 60){
        if(o.vy > 140) sfxBounce();
        o.vy = -o.vy*0.5;
      }else o.vy = 0;
      o.vx *= 0.88;
      o.rotV = o.vx / r;                 // 구르는 회전
    }
    // 좌우 벽
    if(o.x < X_MIN-10){ o.x = X_MIN-10; o.vx = -o.vx*0.55; o.rotV = o.vx/r; sfxBounce(); }
    if(o.x > X_MAX+10){ o.x = X_MAX+10; o.vx = -o.vx*0.55; o.rotV = o.vx/r; sfxBounce(); }

    // 가구와 충돌 (장난감과 비슷한 깊이에 있는 바닥 가구만)
    for(const f of S.furn){
      const FD = FURN[f.t];
      if(FD.kind !== "floor" || FD.deco) continue;
      if(Math.abs(f.y - gy) > 46) continue;
      const b = furnBox(f);
      if(o.x + r < b.x || o.x - r > b.x + b.w) continue;
      if(o.y + r < b.y || o.y - r > b.y + b.h) continue;
      // 겹친 깊이가 가장 얕은 면으로 밀어낸다
      const pl = (o.x + r) - b.x, pr = (b.x + b.w) - (o.x - r);
      const pt = (o.y + r) - b.y, pb = (b.y + b.h) - (o.y - r);
      const m = Math.min(pl, pr, pt, pb);
      if(m === pt){                                   // 위에 올라탐
        o.y = b.y - r;
        if(o.vy > 0){ if(o.vy > 150) sfxBounce(); o.vy = -o.vy*0.42; if(Math.abs(o.vy) < 50) o.vy = 0; }
        o.vx *= 0.9; o.rotV = o.vx/r;
      }else if(m === pb){
        o.y = b.y + b.h + r;
        if(o.vy < 0) o.vy = -o.vy*0.4;
      }else if(m === pl){
        o.x = b.x - r; o.vx = -Math.abs(o.vx)*0.5; o.rotV = o.vx/r; sfxBounce();
      }else{
        o.x = b.x + b.w + r; o.vx = Math.abs(o.vx)*0.5; o.rotV = o.vx/r; sfxBounce();
      }
    }
    // 거의 멈추면 정지
    if(o.y >= gy - 0.5 && Math.abs(o.vx) < 4){ o.vx = 0; o.rotV = (o.rotV || 0)*0.86; }
  }
}
// 장난감을 던졌을 때 고양이의 관심을 끈다
function alertCatToToy(o){
  if(!o || !cat) return;
  if(cat.state === "sleep" || cat.perched || cat.state === "jump") return;
  if(Math.hypot(o.vx, o.vy) < 180) return;
  cat.targetToy = o;
  setState("chase", 8);
}

/* ---------------------------- 스탯 진행 ---------------------------- */
// 기력이 닳지 않고 오히려 조금씩 차는 '쉬는' 상태들
const RESTING = { sit:1, idle:1, groom:1, perch:1, hide:1, watch:1, litter:1 };
function updateStats(dt){
  const m = dt/60, tr = breed().trait;
  const st = S.stats;
  st.hunger -= DECAY.hunger * m * tr.appetite;
  st.thirst -= DECAY.thirst * m;
  st.clean  -= DECAY.clean  * m;

  // 화장실이 더러우면 청결/행복이 더 빨리 떨어진다
  const dirty = S.litter > 65 ? (S.litter-65)/35 : 0;
  st.clean -= dirty * 1.2 * m * 60 * 0.02;
  st.happy -= DECAY.happy * m * (1 + dirty*0.8);

  // 자면 크게, 앉아서 쉬면 조금씩 기력이 찬다
  if(cat.state === "sleep")   st.energy += ENERGY_RECOVER * m;
  else if(RESTING[cat.state]) st.energy += ENERGY_REST * m;
  else                        st.energy -= DECAY.energy * m * tr.energy;

  S.litter = clamp(S.litter + m*0.25, 0, 100);

  // 배고프거나 목마르면 행복도 추가 하락
  if(st.hunger < 25) st.happy -= 1.2*m*60*0.02;
  if(st.thirst < 25) st.happy -= 1.2*m*60*0.02;

  clampStats();
}

function moodText(){
  const st = S.stats;
  const avg = (st.hunger + st.thirst + st.happy + st.clean + st.energy)/5;
  if(cat.state === "sleep") return "쿨쿨 자는 중";
  if(st.hunger < 20) return "배고파요";
  if(st.thirst < 20) return "목말라요";
  if(S.litter > 80) return "화장실 더러움";
  if(avg > 82) return "최고로 행복";
  if(avg > 62) return "기분 좋음";
  if(avg > 40) return "그저 그럼";
  if(avg > 22) return "시무룩";
  return "많이 힘들어요";
}

/* ---------------------------- 파티클 ---------------------------- */
function spawnFx(x,y,type){
  const p = { x, y, type, life:1, max:1, vx:rand(-12,12), vy:rand(-30,-14), rot:rand(0,6.28) };
  if(type==="heart"){ p.max=1.4; p.vy=rand(-46,-28); }
  if(type==="zzz"){ p.max=2.2; p.vy=-16; p.vx=rand(4,14); }
  if(type==="drop"){ p.max=0.5; p.vy=rand(-46,-24); p.vx=rand(-26,26); }
  if(type==="crumb"){ p.max=0.6; p.vy=rand(-40,-18); p.vx=rand(-30,30); }
  if(type==="spark"){ p.max=0.7; p.vy=rand(-40,-16); }
  if(type==="dust"){ p.max=0.9; p.vy=rand(-24,-8); p.vx=rand(-40,40); }
  p.life = p.max;
  fx.push(p);
  if(fx.length > 160) fx.shift();
}
function updateFx(dt){
  for(let i=fx.length-1;i>=0;i--){
    const p = fx[i];
    p.life -= dt;
    p.x += p.vx*dt;
    p.y += p.vy*dt;
    if(p.type!=="zzz" && p.type!=="heart") p.vy += 90*dt;
    if(p.life <= 0) fx.splice(i,1);
  }
}
function drawFx(){
  for(const p of fx){
    const a = clamp(p.life/p.max, 0, 1);
    ctx.save(); ctx.globalAlpha = a;
    ctx.translate(p.x, p.y);
    switch(p.type){
      case "heart":{
        const s = 1 + (1-a)*0.5;
        ctx.scale(s,s); ctx.fillStyle="#ff7d92";
        heartPath(0,0,9); ctx.fill();
        break;
      }
      case "zzz":{
        ctx.fillStyle="#6b7d96"; ctx.font="bold 20px system-ui";
        ctx.fillText("z", 0, 0);
        break;
      }
      case "drop":{
        ctx.fillStyle="#79c6f0"; ctx.beginPath(); ctx.arc(0,0,3,0,6.283); ctx.fill();
        break;
      }
      case "crumb":{
        ctx.fillStyle="#a9713a"; ctx.fillRect(-2,-2,4,4);
        break;
      }
      case "dust":{
        ctx.fillStyle="#cbb79c"; ctx.beginPath(); ctx.arc(0,0,4*a+1,0,6.283); ctx.fill();
        break;
      }
      default:{ // spark
        ctx.fillStyle="#ffd76e"; ctx.rotate(p.rot);
        ctx.beginPath();
        for(let i=0;i<4;i++){ ctx.rotate(Math.PI/2); ctx.moveTo(0,0); ctx.lineTo(2,5); ctx.lineTo(0,9); ctx.lineTo(-2,5); }
        ctx.fill();
      }
    }
    ctx.restore();
  }
}
function heartPath(x,y,r){
  ctx.beginPath();
  ctx.moveTo(x, y+r*0.75);
  ctx.bezierCurveTo(x-r*1.4, y-r*0.4, x-r*0.5, y-r*1.3, x, y-r*0.45);
  ctx.bezierCurveTo(x+r*0.5, y-r*1.3, x+r*1.4, y-r*0.4, x, y+r*0.75);
  ctx.closePath();
}

/* =========================================================================
   방 · 가구 그리기 (실사풍)
   사진으로 그려지는 고양이와 톤이 맞도록, 만화풍 단색 대신
   "재질 그러데이션 + 미세 입자 + 부드러운 접지 그림자"로 그린다.
   ========================================================================= */

/* ---------------------------- 재질 헬퍼 ---------------------------- */
// 결정적 난수 : 매 프레임 같은 무늬가 나와야 화면이 지글거리지 않는다
function hash(n){ const s = Math.sin(n*127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }

// 미세 노이즈 타일 (한 번만 만들어 모든 재질에 재사용)
let _noiseTile = null;
function noiseTile(){
  if(_noiseTile) return _noiseTile;
  const c = document.createElement("canvas"); c.width = c.height = 128;
  const g = c.getContext("2d"), img = g.createImageData(128,128), d = img.data;
  for(let i=0; i<d.length; i+=4){
    const v = 110 + ((Math.random()*90)|0);
    d[i] = d[i+1] = d[i+2] = v; d[i+3] = 255;
  }
  g.putImageData(img, 0, 0);
  _noiseTile = c; return c;
}
const _patCache = new WeakMap();
function noisePattern(){
  let p = _patCache.get(ctx);
  if(!p){ p = ctx.createPattern(noiseTile(), "repeat"); _patCache.set(ctx, p); }
  return p;
}
// 이미 그려 둔 면 위에 표면 입자감을 얹는다 (clip 안에서 부르는 것을 전제)
function grain(x, y, w, h, alpha){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.globalCompositeOperation = "overlay";
  ctx.fillStyle = noisePattern();
  ctx.fillRect(x, y, w, h);
  ctx.restore();
}
// 경로 안쪽에만 입자감
function texture(pathFn, x, y, w, h, alpha){
  ctx.save(); pathFn(); ctx.clip(); grain(x, y, w, h, alpha); ctx.restore();
}

/* 정적인 그림은 한 번만 그려 두고 이미지로 재사용한다 (매 프레임 비용 절감)
   box: 기준점에서 좌/우/위/아래로 그려지는 범위 */
const _partCache = new Map();
function cachedPart(key, box, drawFn, x, y){
  let c = _partCache.get(key);
  if(!c){
    c = document.createElement('canvas');
    c.width = box.l + box.r; c.height = box.t + box.b;
    const prev = ctx;
    ctx = c.getContext('2d');
    drawFn(box.l, box.t);
    ctx = prev;
    _partCache.set(key, c);
  }
  ctx.drawImage(c, x - box.l, y - box.t);
}

// 경로를 세로 그러데이션으로 채운다
function fillGrad(pathFn, y0, y1, stops){
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  for(const s of stops) g.addColorStop(s[0], s[1]);
  ctx.fillStyle = g; pathFn(); ctx.fill();
}
// 가로 그러데이션 (원통형 물체의 명암)
function fillGradX(pathFn, x0, x1, stops){
  const g = ctx.createLinearGradient(x0, 0, x1, 0);
  for(const s of stops) g.addColorStop(s[0], s[1]);
  ctx.fillStyle = g; pathFn(); ctx.fill();
}
// 접지 그림자 : 닿는 부분은 진하고 밖으로 갈수록 흐려진다
function shadowEllipse(x, y, rx, ry, a){
  const al = (a === undefined) ? 1 : a;
  ctx.save();
  ctx.translate(x, y); ctx.scale(1, Math.max(0.05, ry/rx));
  const g = ctx.createRadialGradient(0, 0, rx*0.12, 0, 0, rx);
  g.addColorStop(0,    "rgba(42,28,16," + (0.40*al) + ")");
  g.addColorStop(0.42, "rgba(42,28,16," + (0.22*al) + ")");
  g.addColorStop(0.75, "rgba(42,28,16," + (0.07*al) + ")");
  g.addColorStop(1,    "rgba(42,28,16,0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, rx, 0, 6.283); ctx.fill();
  ctx.restore();
}
// 벽에 붙은 물건이 벽에 드리우는 그림자
function wallShadow(pathFn){
  ctx.save();
  ctx.shadowColor = "rgba(58,42,28,.42)";
  ctx.shadowBlur = 12; ctx.shadowOffsetX = 5; ctx.shadowOffsetY = 8;
  ctx.fillStyle = "rgba(0,0,0,.5)";
  pathFn(); ctx.fill();
  ctx.restore();
}
// 나뭇결 : 길이 방향으로 흐르는 결 + 가끔 옹이
function woodGrain(x, y, w, h, seed, alpha){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.lineWidth = 1;
  for(let i=0; i<Math.max(3, h/5); i++){
    const gy = y + (i + 0.5) * h / Math.max(3, h/5) + (hash(seed+i)-0.5)*2;
    ctx.strokeStyle = hash(seed+i*3.3) > 0.5 ? "rgba(92,60,32,.55)" : "rgba(232,206,172,.45)";
    ctx.beginPath();
    ctx.moveTo(x, gy);
    const seg = Math.max(2, Math.round(w/50));
    for(let k=1; k<=seg; k++){
      const px = x + w*k/seg;
      const py = gy + Math.sin(k*1.7 + seed + i) * 1.6;
      ctx.quadraticCurveTo(px - w/(seg*2), py + (hash(seed+i*7+k)-0.5)*2.4, px, py);
    }
    ctx.stroke();
  }
  ctx.restore();
}
// 천/카펫 가장자리의 보풀
function fuzzEdge(cx, cy, rx, ry, n, len, color, seed){
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = 1.1; ctx.lineCap = "round";
  for(let i=0; i<n; i++){
    const a = (i/n)*6.283;
    const px = cx + Math.cos(a)*rx, py = cy + Math.sin(a)*ry;
    const l = len*(0.45 + hash(seed + i*2.3));
    ctx.beginPath(); ctx.moveTo(px, py);
    ctx.lineTo(px + Math.cos(a)*l, py + Math.sin(a)*l*0.7);
    ctx.stroke();
  }
  ctx.restore();
}
// 재봉선
function seam(x0, y0, x1, y1, color, dash){
  ctx.save();
  ctx.strokeStyle = color || "rgba(60,50,40,.35)";
  ctx.lineWidth = 1.2;
  if(dash) ctx.setLineDash([3, 3]);
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  ctx.restore();
}

/* =========================================================================
   방 : 벽 · 마루는 변하지 않으므로 한 번만 그려서 재사용한다
   ========================================================================= */
let _roomBase = null;
function roomBase(){
  if(_roomBase) return _roomBase;
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const prev = ctx;
  ctx = c.getContext("2d");
  paintWall();
  paintFloor();
  ctx = prev;
  _roomBase = c;
  return c;
}

function drawRoom(t){
  ctx.drawImage(roomBase(), 0, 0);
  drawWindow(t);
}

/* --------- 벽 (매트 페인트) --------- */
function paintWall(){
  const wall = ctx.createLinearGradient(0, 0, 0, FLOOR_Y);
  wall.addColorStop(0,    "#efe8dc");
  wall.addColorStop(0.55, "#e5dbcd");
  wall.addColorStop(1,    "#d6cab8");
  ctx.fillStyle = wall; ctx.fillRect(0, 0, W, FLOOR_Y);

  // 창 쪽이 밝고 구석으로 갈수록 어두운, 실제 방의 빛 분포
  let g = ctx.createRadialGradient(700, 140, 30, 700, 140, 640);
  g.addColorStop(0, "rgba(255,248,233,.34)"); g.addColorStop(1, "rgba(255,248,233,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, FLOOR_Y);

  g = ctx.createLinearGradient(0, 0, 260, 0);
  g.addColorStop(0, "rgba(74,56,40,.22)"); g.addColorStop(1, "rgba(74,56,40,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, 260, FLOOR_Y);

  g = ctx.createLinearGradient(W, 0, W-190, 0);
  g.addColorStop(0, "rgba(74,56,40,.16)"); g.addColorStop(1, "rgba(74,56,40,0)");
  ctx.fillStyle = g; ctx.fillRect(W-190, 0, 190, FLOOR_Y);

  g = ctx.createLinearGradient(0, 0, 0, 110);
  g.addColorStop(0, "rgba(66,50,36,.20)"); g.addColorStop(1, "rgba(66,50,36,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 110);

  // 페인트가 마르며 생긴 넓은 얼룩
  ctx.save(); ctx.globalAlpha = 0.05;
  for(let i=0; i<16; i++){
    const cx = hash(i*3.1)*W, cy = hash(i*5.7)*FLOOR_Y, r = 70 + hash(i*9.3)*160;
    const dark = hash(i*2.2) > 0.5;
    const gg = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    gg.addColorStop(0, dark ? "rgba(88,70,52,1)" : "rgba(255,251,242,1)");
    gg.addColorStop(1, dark ? "rgba(88,70,52,0)" : "rgba(255,251,242,0)");
    ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.283); ctx.fill();
  }
  ctx.restore();

  grain(0, 0, W, FLOOR_Y, 0.17);   // 벽지 질감
  paintBaseboard();
}

/* --------- 걸레받이 --------- */
function paintBaseboard(){
  const top = FLOOR_Y - 30;
  let g = ctx.createLinearGradient(0, top-14, 0, top);
  g.addColorStop(0, "rgba(72,54,38,0)"); g.addColorStop(1, "rgba(72,54,38,.15)");
  ctx.fillStyle = g; ctx.fillRect(0, top-14, W, 14);

  g = ctx.createLinearGradient(0, top, 0, FLOOR_Y);
  g.addColorStop(0,    "#f7f2e9");
  g.addColorStop(0.16, "#efe9dd");
  g.addColorStop(0.72, "#e0d6c6");
  g.addColorStop(1,    "#c7bba7");
  ctx.fillStyle = g; ctx.fillRect(0, top, W, 30);

  ctx.fillStyle = "#fcf8f0";              ctx.fillRect(0, top, W, 2.5);
  ctx.fillStyle = "rgba(118,94,68,.28)";  ctx.fillRect(0, top+2.5, W, 1.4);
  ctx.fillStyle = "rgba(255,255,255,.55)";ctx.fillRect(0, top+7, W, 1);
  ctx.fillStyle = "rgba(118,94,68,.18)";  ctx.fillRect(0, top+8, W, 1);
  ctx.fillStyle = "rgba(48,34,22,.40)";   ctx.fillRect(0, FLOOR_Y-2.5, W, 2.5);
  grain(0, top, W, 30, 0.09);
}

/* --------- 원목 마루 --------- */
function paintFloor(){
  const depth = H - FLOOR_Y;
  const rows = 6;
  const wts = [];
  let acc = 0;
  for(let i=0; i<rows; i++){ const w = Math.pow(1.34, i); wts.push(w); acc += w; }
  let yy = FLOOR_Y;
  for(let i=0; i<rows; i++){
    const h = depth * wts[i] / acc;
    paintPlankRow(i, yy, h);
    yy += h;
  }
  // 마루 전체의 광택 (창 쪽 반사가 더 세다)
  let g = ctx.createLinearGradient(0, FLOOR_Y, 0, H);
  g.addColorStop(0,   "rgba(255,243,220,.10)");
  g.addColorStop(0.5, "rgba(255,243,220,.03)");
  g.addColorStop(1,   "rgba(255,238,212,.11)");
  ctx.fillStyle = g; ctx.fillRect(0, FLOOR_Y, W, depth);

  g = ctx.createRadialGradient(760, 520, 20, 760, 520, 340);
  g.addColorStop(0, "rgba(255,240,206,.16)"); g.addColorStop(1, "rgba(255,240,206,0)");
  ctx.fillStyle = g; ctx.fillRect(400, FLOOR_Y, W-400, depth);

  // 좌우 구석 그늘
  g = ctx.createLinearGradient(0, 0, 200, 0);
  g.addColorStop(0, "rgba(48,32,18,.24)"); g.addColorStop(1, "rgba(48,32,18,0)");
  ctx.fillStyle = g; ctx.fillRect(0, FLOOR_Y, 200, depth);
  g = ctx.createLinearGradient(W, 0, W-180, 0);
  g.addColorStop(0, "rgba(48,32,18,.20)"); g.addColorStop(1, "rgba(48,32,18,0)");
  ctx.fillStyle = g; ctx.fillRect(W-180, FLOOR_Y, 180, depth);

  grain(0, FLOOR_Y, W, depth, 0.13);
  drawFloorAO();
}

// 한 줄의 마루널. 앞쪽 줄일수록 널이 넓어 보이게(원근) 이음매를 벌린다
function paintPlankRow(row, y0, h){
  const scale = 1 + row*0.19;
  const off   = (hash(row*7.7) - 0.5) * 170;
  const wood  = ["#b5875a","#c0946a","#a87c50","#c79a6f","#ab8055","#bd8d5e"];

  const seams = [];
  for(let k=-12; k<=12; k++){
    const xw = W/2 + k*170 + off;
    seams.push({ k:k, x: W/2 + (xw - W/2)*scale });
  }
  ctx.save();
  ctx.beginPath(); ctx.rect(0, y0, W, h); ctx.clip();
  for(let i=0; i<seams.length-1; i++){
    const a = seams[i], b = seams[i+1];
    if(b.x < -20 || a.x > W+20) continue;
    const base = wood[((a.k % wood.length) + wood.length + row) % wood.length];
    const lift = (hash(a.k*3.7 + row*11.3) - 0.5) * 0.16;
    const c1 = mix(base, "#f4dcc0", Math.max(0, 0.14 + lift));
    const c2 = mix(base, "#4a2f18", Math.max(0, 0.16 - lift));
    const g = ctx.createLinearGradient(0, y0, 0, y0+h);
    g.addColorStop(0,   c2);
    g.addColorStop(0.3, base);
    g.addColorStop(0.8, c1);
    g.addColorStop(1,   mix(base, "#3d2612", 0.22));
    ctx.fillStyle = g;
    ctx.fillRect(a.x, y0, b.x - a.x, h);
    woodGrain(a.x, y0+1, b.x - a.x, h-2, a.k*13.7 + row*5.1, 0.30);
    // 옹이
    if(hash(a.k*5.3 + row*2.9) > 0.86){
      const kx = a.x + (b.x-a.x)*(0.25 + hash(a.k)*0.5), ky = y0 + h*0.5;
      const kg = ctx.createRadialGradient(kx, ky, 0.5, kx, ky, 5.5);
      kg.addColorStop(0, "rgba(70,42,20,.75)"); kg.addColorStop(1, "rgba(70,42,20,0)");
      ctx.fillStyle = kg;
      ctx.beginPath(); ctx.ellipse(kx, ky, 6, 3.2, 0, 0, 6.283); ctx.fill();
    }
    // 널 사이 이음매 (그늘 + 반대쪽 모서리 하이라이트)
    ctx.fillStyle = "rgba(52,32,14,.45)"; ctx.fillRect(b.x - 1.4, y0, 1.6, h);
    ctx.fillStyle = "rgba(255,236,206,.28)"; ctx.fillRect(b.x + 0.4, y0, 1, h);
  }
  // 줄 사이 이음매
  ctx.fillStyle = "rgba(56,34,16,.34)"; ctx.fillRect(0, y0 + h - 1.6, W, 1.8);
  ctx.fillStyle = "rgba(255,238,208,.20)"; ctx.fillRect(0, y0, W, 1);
  ctx.restore();
}

/* =========================================================================
   창문
   ========================================================================= */
function drawWindow(t){
  const x = 600, y = 64, w = 210, h = 150;
  const night = !!(S && S.lightOff);

  // 유리
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  paintSky(x, y, w, h, t, night);
  paintOutside(x, y, w, h, t, night);

  // 유리에 비친 실내 반사
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.fillStyle = "rgba(255,255,255,.10)";
  ctx.beginPath();
  ctx.moveTo(x-10, y+h); ctx.lineTo(x+w*0.42, y-10);
  ctx.lineTo(x+w*0.60, y-10); ctx.lineTo(x+w*0.08, y+h);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.06)";
  ctx.beginPath();
  ctx.moveTo(x+w*0.55, y+h); ctx.lineTo(x+w, y+h*0.18);
  ctx.lineTo(x+w+14, y+h*0.34); ctx.lineTo(x+w*0.78, y+h);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  // 유리 가장자리 그늘
  const eg = ctx.createLinearGradient(x, y, x, y+22);
  eg.addColorStop(0, "rgba(40,44,52,.30)"); eg.addColorStop(1, "rgba(40,44,52,0)");
  ctx.fillStyle = eg; ctx.fillRect(x, y, w, 22);
  ctx.restore();

  // 창살 (가로/세로) — 안쪽 유리보다 앞
  paintSashBar(x + w/2 - 3.5, y, 7, h, true);
  paintSashBar(x, y + h/2 - 3, w, 6, false);

  // 창틀 : 흰색 도장 목재
  paintCasing(x, y, w, h);

  // 창턱
  const sy = y + h + 9;
  ctx.save();
  ctx.fillStyle = "rgba(60,44,30,.22)";
  ctx.fillRect(x-19, sy+13, w+38, 10);
  ctx.restore();
  fillGrad(()=> roundRect(x-20, sy, w+40, 13, 3), sy, sy+13, [
