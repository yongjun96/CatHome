// 고양이를 어느 깊이에 끼워 그릴지 (가구 앞/뒤 판정)
function catDepth(){
  if(cat.state === "held") return 9998;                  // 손에 들려 있으면 맨 앞
  if(cat.useF && cat.behind)  return cat.useF.y - 0.5;   // 상자·터널·캣휠 안
  if(cat.useF && cat.perched) return cat.useF.y + 0.5;   // 캣타워·소파 위
  if(cat.useF && cat.useRole === "sleep") return cat.useF.y + 0.5;  // 방석 안 (테두리에 가리지 않게)
  return cat.gy;
}
function render(t){
  ctx.clearRect(0, 0, W, H);
  drawRoom(t);

  // 벽 아이템 -> 바닥 장식(러그) -> 나머지는 깊이 순으로
  for(const f of S.furn) if(FURN[f.t] && FURN[f.t].kind === "wall") drawFurn(f);
  for(const f of S.furn) if(FURN[f.t] && FURN[f.t].kind === "floor" && FURN[f.t].deco) drawFurn(f);
  drawSunPatch();            // 바닥·러그에 깔리는 햇빛 (가구·고양이보다는 아래)
  drawLureShadow();          // 깃털 그림자는 바닥에 깔린다 (고양이·가구가 그 위를 지나가도록)

  const list = [];
  for(const f of S.furn){
    const D = FURN[f.t];
    if(D && D.kind === "floor" && !D.deco) list.push({ y:f.y, f:f });
  }
  for(const o of S.toys) list.push({ y: o.held ? 9999 : toyGY(o) + 1, o:o });
  list.push({ y: catDepth(), c:true });
  list.sort((a,b)=> a.y - b.y);
  for(const it of list){
    if(it.f) drawFurn(it.f);
    else if(it.o) drawToy(it.o);
    else drawCat(cat, t);
  }

  drawFx();
  drawFeather();             // 방 조명(창빛·밤)을 같이 받도록 분위기 레이어보다 먼저
  drawRoomMood(elapsed);     // 창빛 · 비네팅
  drawNight();
  if(editMode) drawEditOverlay();
}

function loop(ts){
  if(!lastTs) lastTs = ts;
  let dt = (ts - lastTs)/1000;
  lastTs = ts;
  dt = Math.min(dt, 0.05);           // 탭 전환 시 점프 방지
  elapsed += dt;

  if(S){
    updateStats(dt);
    updateLure(dt);            // 깃털이 먼저 움직이고, 고양이가 그걸 쫓는다
    updateCat(dt);
    updateRig(dt, elapsed);    // 사진 관절 리그
    updateToys(dt);
    updateFx(dt);
    render(elapsed);
    uiTick(dt);
  }
  requestAnimationFrame(loop);
}

let uiAcc = 0;
function uiTick(dt){
  uiAcc += dt;
  if(uiAcc < 0.2 || S.__preview) return;
  uiAcc = 0;
  for(const s of STAT_DEF){
    const v = Math.round(S.stats[s.key]);

    document.getElementById("v_"+s.key).textContent = v;
  }

  document.getElementById("uiAge").textContent = Math.floor((now()-S.born)/86400000) + "일차";
  document.getElementById("uiMood").textContent = moodText();
  document.querySelector('[data-act="clean"]').classList.toggle("on", S.litter > 60);
  const lb = document.querySelector('[data-act="light"]');
  lb.querySelector(".tx").textContent = S.lightOff ? "불 켜기" : "불 끄기";
  lb.querySelector(".em").textContent = S.lightOff ? "🌙" : "💡";
}
function hint(t){ document.getElementById("hint").textContent = t; }

/* --------- 액션 --------- */
function doAction(act){
  if(!S || S.__preview) return;
  if(editMode && act !== "edit"){ toast("꾸미기를 끝낸 뒤에 할 수 있어요"); return; }
  switch(act){
    case "feed": {
      const f = nearestFurn("food");
      if(!f){ toast("밥그릇이 없어요. 🛋️ 꾸미기에서 놓아주세요"); return; }
      if(S.bowlFood >= 2.9){ toast("밥그릇이 이미 가득해요"); return; }
      S.bowlFood = 3; sfxPourKibble();
      toast("사료를 채웠어요 🍚");
      for(let i=0;i<10;i++) spawnFx(f.x + rand(-16,16), f.y-26, "crumb");
      if(S.stats.hunger < 60 && cat.state !== "sleep" && !cat.perched){
        useFurniture(f, "food"); say("냐앙!", 1.2);
        if(Math.random() < 0.8) catVoice("happy", rand(1.0,1.1));
      }
      break;
    }
    case "water": {
      const f = nearestFurn("water");
      if(!f){ toast("물그릇이 없어요. 🛋️ 꾸미기에서 놓아주세요"); return; }
      if(S.bowlWater >= 2.9){ toast("물그릇이 이미 가득해요"); return; }
      S.bowlWater = 3; sfxPourWater();
      toast("물을 채웠어요 💧");
      for(let i=0;i<8;i++) spawnFx(f.x + rand(-12,12), f.y-24, "drop");
      if(S.stats.thirst < 60 && cat.state !== "sleep" && !cat.perched) useFurniture(f, "water");
      break;
    }
    case "play":
      playMode = !playMode;
      document.querySelector('[data-act="play"]').classList.toggle("on", playMode);
      document.getElementById("stage").classList.toggle("playmode", playMode);
      hint(playMode ? "마우스(손가락)를 움직여 고양이와 놀아주세요! 다시 누르면 종료"
                    : "고양이를 톡 누르면 쓰다듬기, 꾹 눌러 끌면 번쩍 들어 던질 수 있어요.");
      if(playMode){
        resetLure();                    // 이전 위치에서 날아오지 않도록 손 위치에서 시작
        if(cat.state === "sleep"){ setState("sit",2); say("...냥?",1.4); }
        toast("낚싯대 놀이 시작!");
      }else setState("sit", 2);
      break;
    case "pet": petCat(); break;
    case "clean": {
      const f = nearestFurn("litter");
      if(!f){ toast("화장실이 없어요. 🛋️ 꾸미기에서 놓아주세요"); return; }
      if(S.litter < 5){ toast("화장실이 이미 깨끗해요"); return; }
      S.litter = 0;
      S.stats.clean = clamp(S.stats.clean + 12, 0, 100);
      S.stats.happy = clamp(S.stats.happy + 5, 0, 100);
      sfxLitterScoop();
      for(let i=0;i<12;i++) spawnFx(f.x + rand(-40,40), f.y-20, "dust");
      toast("화장실을 청소했어요 ✨");
      break;
    }
    case "light":
      S.lightOff = !S.lightOff;
      if(S.lightOff){
        toast("불을 껐어요. 이제 푹 자겠네요 🌙");
        if(cat.state !== "sleep" && !cat.perched){
          const f = nearestFurn("sleep");
          if(f) useFurniture(f, "sleep");
        }
      }else{
        toast("불을 켰어요 ☀️");
        if(cat.state === "sleep"){ setState("sit", 2); say("...냐암",1.5); }
      }
      break;
    case "edit":
      editMode ? exitEdit() : enterEdit();
      break;
  }
  save();
}
function petCat(){
  if(cat.state === "sleep"){
    say("Zzz...", 1.5);
    toast("자는 중이에요. 깨우지 마세요!");
    return;
  }
  S.stats.happy = clamp(S.stats.happy + 7, 0, 100);
  S.stats.clean = clamp(S.stats.clean + 1.5, 0, 100);
  cat.purr = 1.6;
  if(!cat.perched) setState("happy", 1.8);
  for(let i=0;i<5;i++) spawnFx(cat.x + rand(-24,24), cat.y-70, "heart");
  catVoice("happy", rand(1.0,1.15));
  say(pick(["골골골","냥~","좋아!"]), 1.4);
  save();
}

function enterEdit(){
  if(playMode) doAction("play");     // 낚싯대 모드 먼저 끄기 (editMode 켜기 전에)
  editMode = true; sel = null; drag = null;
  // 가구 위에 올라가 있으면 내려놓는다
  if(cat.perched){
    cat.perched = false; cat.behind = false; cat.useF = null; cat.pending = null;
    cat.y = CAT_Y; cat.gy = CAT_Y; setState("sit", 3);
  }
  document.getElementById("editbar").classList.remove("hidden");
  document.querySelector('[data-act="edit"]').classList.add("on");
  document.getElementById("stage").classList.add("editmode");
  hint("팔레트에서 골라 놓고, 방 안의 물건을 드래그해서 옮기세요.");
  toast("꾸미기 모드 🛋️");
}
function exitEdit(){
  editMode = false; sel = null; drag = null;
  document.getElementById("editbar").classList.add("hidden");
  document.querySelector('[data-act="edit"]').classList.remove("on");
  document.getElementById("stage").classList.remove("editmode");
  hint("고양이를 톡 누르면 쓰다듬기, 꾹 눌러 끌면 번쩍 들어 던질 수 있어요.");
  save();
}
function buildPalette(){
  const el = document.getElementById("palette");
  el.innerHTML = "";
  for(const t of FURN_ORDER){
    const D = FURN[t];
    const d = document.createElement("div");
    d.className = "pitem"; d.dataset.t = t;
    d.innerHTML = `<canvas width="76" height="76"></canvas><span>${D.name}</span>`;
    el.appendChild(d);
    drawThumb(d.querySelector("canvas"), t);
    d.addEventListener("click", ()=> addFurn(t));
  }
}
// 팔레트 썸네일도 게임과 같은 그리기 코드를 재사용한다
function drawThumb(cv, t){
  const D = FURN[t], prev = ctx;
  ctx = cv.getContext("2d");
  ctx.clearRect(0, 0, 76, 76);
  const w = D.kind === "toy" ? D.r*2 : D.w;
  const h = D.kind === "toy" ? D.r*2 : D.h;
  const sc = Math.min(62/w, 60/h, 1.1);
  ctx.save();
  ctx.translate(38, D.kind === "floor" ? 70 : 38);
  ctx.scale(sc, sc);
  if(D.kind === "toy") D.draw(0, 0, null);
  else D.draw(0, 0, { t:t, spin:0.4 });
  ctx.restore();
  ctx = prev;
}
function addFurn(t){
  const D = FURN[t];
  if(D.kind === "toy"){
    if(S.toys.length >= 6){ toast("장난감은 6개까지만 놓을 수 있어요"); return; }
    const o = { t:t, x:rand(360,600), y:180, gy:rand(TOY_MIN+24, TOY_MAX-16), vx:rand(-70,70), vy:0, rot:0 };
    S.toys.push(o);
    sel = { type:"toy", i:S.toys.length-1 };
    toast(`${D.name}을(를) 떨어뜨렸어요`);
    sfxThud(0.3); save(); return;
  }
  if(S.furn.length >= MAX_FURN){ toast("가구를 더 놓을 자리가 없어요"); return; }
  const f = { t:t, x:470, y: D.kind === "wall" ? 190 : 545 };
  // 이미 있는 것과 너무 겹치면 옆으로 비켜 놓는다
  for(let i=0;i<14;i++){
    const clash = S.furn.some(g => FURN[g.t].kind === D.kind &&
                              Math.abs(g.x - f.x) < 44 && Math.abs(g.y - f.y) < 30);
    if(!clash) break;
    f.x += 52;
    if(f.x > 830){ f.x = 160; f.y += D.kind === "wall" ? 90 : 20; }
  }
  f.x = clamp(f.x, 110, 850);
  f.y = D.kind === "wall" ? clamp(f.y, WALL_MIN, WALL_MAX) : clamp(f.y, FLOOR_MIN, FLOOR_MAX);
  S.furn.push(f);
  sel = { type:"furn", i:S.furn.length-1 };
  toast(`${D.name} 배치! 드래그해서 옮겨보세요`);
  sfxPlace();
  save();
}
function selObj(){
  if(!sel) return null;
  return sel.type === "furn" ? S.furn[sel.i] : S.toys[sel.i];
}
function deleteSel(){
  const o = selObj();
  if(!o){ toast("먼저 옮길 물건을 선택하세요"); return; }
  if(sel.type === "furn"){
    if(cat.useF === o){   // 고양이가 쓰던 가구면 바닥으로 내려놓는다
      cat.useF = null; cat.pending = null; cat.perched = false; cat.behind = false;
      cat.y = CAT_Y; cat.gy = CAT_Y; setState("sit", 2);
    }
    S.furn.splice(sel.i, 1);
  }else{
    if(cat.targetToy === o){ cat.targetToy = null; setState("sit", 2); }
    S.toys.splice(sel.i, 1);
  }
  sel = null; sfxPick(); toast("치웠어요");
  save();
}
function flipSel(){
  const o = selObj();
  if(!o || sel.type !== "furn"){ toast("뒤집을 가구를 선택하세요"); return; }
  o.flip = !o.flip; sfxClick();
  save();
}
function drawEditOverlay(){
  ctx.save();
  // 바닥 배치 범위 안내선
  ctx.strokeStyle = "rgba(255,255,255,.4)"; ctx.lineWidth = 2; ctx.setLineDash([9,7]);
  ctx.beginPath(); ctx.moveTo(0, FLOOR_MIN); ctx.lineTo(W, FLOOR_MIN); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, FLOOR_MAX); ctx.lineTo(W, FLOOR_MAX); ctx.stroke();
  ctx.setLineDash([]);
  const o = selObj();
  if(o){
    let b;
    if(sel.type === "furn") b = furnBox(o);
    else { const r = FURN[o.t].r; b = { x:o.x-r, y:o.y-r*2, w:r*2, h:r*2 }; }
    ctx.strokeStyle = "#e88b5a"; ctx.lineWidth = 3; ctx.setLineDash([8,6]);
    roundRect(b.x-7, b.y-7, b.w+14, b.h+14, 11); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "#e88b5a";
    [[b.x-7,b.y-7],[b.x+b.w+7,b.y-7],[b.x-7,b.y+b.h+7],[b.x+b.w+7,b.y+b.h+7]]
      .forEach(([hx,hy])=>{ ctx.beginPath(); ctx.arc(hx,hy,4.5,0,6.283); ctx.fill(); });
  }
  ctx.restore();
}

/* --------- 히트 테스트 --------- */
function hitToy(px, py){
  for(let i=S.toys.length-1; i>=0; i--){
    const o = S.toys[i], r = FURN[o.t].r;
    if(Math.hypot(px - o.x, py - (o.y - r)) < r + 13) return i;
  }
  return -1;
}
function hitFurn(px, py){
  for(let i=S.furn.length-1; i>=0; i--){
    const b = furnBox(S.furn[i]);
    if(px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h) return i;
  }
  return -1;
}
function hitCat(px, py){
  if(useSprite() && rigReady && rig.root){     // 사진 리그는 실제 부위 범위로 판정
    const b = catBBox();
    return px > b.x0 - 5 && px < b.x1 + 5 && py > b.y0 - 5 && py < b.y1 + 5;
  }
  return Math.abs(px - cat.x) < 56 && py > cat.y - 108 && py < cat.y + 22;
}

/* --------- 입력 --------- */
const stage = document.getElementById("stage");
function toLocal(e){
  const r = stage.getBoundingClientRect();
  const cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
  const cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
  return { x: cx * (W/r.width), y: cy * (H/r.height) };
}
stage.addEventListener("pointerdown", e=>{
  if(!S || S.__preview) return;
  const p = toLocal(e);
  pointerRaw.x = p.x; pointerRaw.y = p.y;
  pointer.x = clamp(p.x, X_MIN, X_MAX);
  pointer.y = clamp(p.y, 80, FLOOR_Y-20);
  pointer.active = true;
  stage.setPointerCapture && stage.setPointerCapture(e.pointerId);

  if(editMode){
    const ti = hitToy(p.x, p.y);
    if(ti >= 0){
      sel = { type:"toy", i:ti };
      const o = S.toys[ti];
      o.held = true; o.px = o.x; o.py = o.y; o.vx = 0; o.vy = 0;
      drag = { dx: p.x - o.x, dy: p.y - o.y };
      return;
    }
    const fi = hitFurn(p.x, p.y);
    if(fi >= 0){
      sel = { type:"furn", i:fi };
      const f = S.furn[fi];
      drag = { dx: p.x - f.x, dy: p.y - f.y };
    }else sel = null;
    return;
  }

  if(playMode) return;

  // 장난감 집기
  const ti = hitToy(p.x, p.y);
  if(ti >= 0){
    const o = S.toys[ti];
    o.held = true; o.px = o.x; o.py = o.y; o.vx = 0; o.vy = 0;
    drag = { dx: p.x - o.x, dy: p.y - o.y, toy: o };
    hint("던져보세요! 고양이가 쫓아갑니다");
    return;
  }
  // 고양이 — 톡 누르면 쓰다듬기, 끌면 집어 들기
  if(hitCat(p.x, p.y)){
    drag = { cat:true, t0:elapsed, x0:p.x, y0:p.y, active:false };
    return;
  }
  // 방 안 물건 클릭
  const fi = hitFurn(p.x, p.y);
  if(fi >= 0){
    const roles = FURN[S.furn[fi].t].roles || [];
    if(roles.indexOf("food") >= 0)   return doAction("feed");
    if(roles.indexOf("water") >= 0)  return doAction("water");
    if(roles.indexOf("litter") >= 0) return doAction("clean");
  }
});
stage.addEventListener("pointermove", e=>{
  const p = toLocal(e);
  pointerRaw.x = p.x; pointerRaw.y = p.y;
  pointer.x = clamp(p.x, X_MIN, X_MAX);
  pointer.y = clamp(p.y, 80, FLOOR_Y-20);
  pointer.active = true;
  if(!drag || !S) return;

  if(drag.cat){                                  // 고양이 잡아 끌기 (위치는 updateCat 에서)
    if(!drag.active && Math.hypot(p.x - drag.x0, p.y - drag.y0) > 7) activateCatGrab();
    return;
  }
  if(drag.toy){                                  // 장난감 끌기
    const o = drag.toy;
    o.x = clamp(p.x - drag.dx, X_MIN-8, X_MAX+8);
    o.y = clamp(p.y - drag.dy, 60, TOY_MAX);
    // 바닥 가까이에서 천천히 끌면 그 자리로 옮겨진다 (휙 들어 올릴 때는 유지)
    if(o.y > TOY_MIN && Math.hypot(o.vx||0, o.vy||0) < 400) o.gy = clamp(o.y, TOY_MIN, TOY_MAX);
    return;
  }
  if(!editMode || !sel) return;
  if(sel.type === "toy"){                        // 꾸미기 모드 - 바닥 어디에나 놓는다
    const o = S.toys[sel.i]; if(!o) return;
    o.x = clamp(p.x - drag.dx, X_MIN-8, X_MAX+8);
    o.gy = clamp(p.y - drag.dy, TOY_MIN, TOY_MAX);
    o.y = o.gy; o.vx = 0; o.vy = 0;
    return;
  }
  const f = S.furn[sel.i]; if(!f) return;
  const D = FURN[f.t];
  f.x = clamp(p.x - drag.dx, 100, 860);
  f.y = D.kind === "wall" ? clamp(p.y - drag.dy, WALL_MIN, WALL_MAX)
                          : clamp(p.y - drag.dy, FLOOR_MIN, FLOOR_MAX);
  // 고양이가 올라가 있거나 안에 들어가 있는 가구면 같이 따라 움직인다
  if(cat.useF === f && (cat.perched || cat.behind) && cat.useRole){
    const sp = furnSpot(f, cat.useRole);
    cat.x = clamp(sp.x, X_MIN, X_MAX); cat.y = sp.y;
    cat.gy = D.kind === "wall" ? FLOOR_MIN - 4 : f.y;
  }
});
function endDrag(){
  if(drag && drag.cat){
    if(drag.active) releaseCat();   // 잡고 있었으면 놓기(속도가 있으면 던져진다)
    else petCat();                  // 짧게 톡 누른 것 = 쓰다듬기
    stage.classList.remove("grabbing");
    drag = null; save();
    return;
  }
  if(drag && drag.toy){
    const o = drag.toy;
    o.gy = throwLanding(o.y, o.vy || 0, toyGY(o), TOY_MIN, TOY_MAX);
    o.held = false;
    alertCatToToy(o);
  }else if(sel && sel.type === "toy" && S.toys[sel.i]){
    S.toys[sel.i].held = false;
  }
  if(drag) save();
  drag = null;
}
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);
stage.addEventListener("pointerleave", ()=>{ pointer.active = false; endDrag(); });

document.querySelectorAll(".act").forEach(el=>{
  el.addEventListener("click", ()=> doAction(el.dataset.act));
});
document.getElementById("btnDel").addEventListener("click", deleteSel);
document.getElementById("btnFlip").addEventListener("click", flipSel);
document.getElementById("btnDone").addEventListener("click", exitEdit);
document.getElementById("btnSound").addEventListener("click", e=>{
  soundOn = !soundOn;
  e.currentTarget.textContent = soundOn ? "🔊" : "🔇";
  toast(soundOn ? "소리 켜짐" : "소리 꺼짐");
});
document.getElementById("btnReset").addEventListener("click", ()=>{
  if(confirm("정말 처음부터 다시 시작할까요? 지금 고양이와의 기록이 사라져요.")){
    localStorage.removeItem(SAVE_KEY);
    location.reload();
  }
});
document.addEventListener("keydown", e=>{
  if(!editMode) return;
  if(e.key === "Delete" || e.key === "Backspace"){ e.preventDefault(); deleteSel(); }
  if(e.key === "Escape") exitEdit();
});
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden) save();
  else lastTs = 0;
});
window.addEventListener("beforeunload", save);
setInterval(()=>{ if(S) save(); }, 15000);

/* =========================================================================
   입양 화면
   ========================================================================= */
let selectedBreed = BREEDS[0].id;
function buildPicks(){
  const wrap = document.getElementById("picks");
  wrap.innerHTML = "";
  BREEDS.forEach(b=>{
    const div = document.createElement("div");
    div.className = "pick" + (b.id === selectedBreed ? " sel" : "");
    div.dataset.id = b.id;
    div.innerHTML = `<canvas width="180" height="150"></canvas>
      <div class="nm">${b.name}</div><div class="ds">${b.desc}</div>`;
    wrap.appendChild(div);
    drawPreview(div.querySelector("canvas"), b);
    div.addEventListener("click", ()=>{
      selectedBreed = b.id;
      document.querySelectorAll(".pick").forEach(p=> p.classList.toggle("sel", p.dataset.id === b.id));
      sfxClick();
    });
  });
}
// 미리보기: 메인 그리기 함수를 그대로 쓰되 컨텍스트만 잠시 바꿔치기
function drawPreview(canvas, b){
  const prevCtx = ctx, prevCat = cat;
  ctx = canvas.getContext("2d");
  cat = makeCat();
  cat.x = 90; cat.y = 132; cat.gy = CAT_Y; cat.dir = 1;
  setState("sit", 5);

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#f3e2d1";
  ctx.beginPath(); ctx.ellipse(90, 134, 62, 12, 0, 0, 6.283); ctx.fill();
  if(catImgReady && breedSprite[b.id]){
    drawSpritePlain(ctx, b.id, 92, 136, 116);      // 사진 미리보기
  }else{
    ctx.save();
    ctx.translate(cat.x, cat.y);
    drawCatPose(cat, b, poseParams(cat, 0), 0);
    ctx.restore();
  }

  ctx = prevCtx; cat = prevCat;
}
document.getElementById("btnAdopt").addEventListener("click", ()=>{
  const nm = (document.getElementById("nameInput").value || "").trim() || "나비";
  S = newSave(selectedBreed, nm);
  cat = makeCat();
  document.getElementById("adopt").classList.add("hidden");
  buildPalette();
  save();
  toast(`${nm}을(를) 입양했어요! 잘 돌봐주세요 🐾`);
  catVoice("greet", 1.05);
  setTimeout(()=> say("냐옹~", 2), 600);
});
document.getElementById("nameInput").addEventListener("keydown", e=>{
  if(e.key === "Enter") document.getElementById("btnAdopt").click();
});

/* =========================================================================
   시작
   ========================================================================= */
function boot(){
  buildStatPanel();
  const d = load();
  if(d){
    S = d; cat = makeCat();
    applyOffline();
    document.getElementById("adopt").classList.add("hidden");
    buildPalette();
  }else{
    // 입양 전: 빈 방을 배경으로 보여주고 저장은 하지 않는다(__preview)
    S = { breed:BREEDS[0].id, name:"", born:now(), lastSeen:now(),
          stats:{ hunger:70, thirst:70, happy:70, clean:70, energy:70 },
          bowlFood:2, bowlWater:2, litter:10, lightOff:false,
          furn:defaultFurn(), toys:defaultToys(), __preview:true };
    cat = makeCat();
    buildPicks();
  }
  requestAnimationFrame(loop);
}
boot();

</script>
